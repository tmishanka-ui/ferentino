<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technical Department Employees — FIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--bg:#F2F0EB;--card:#fff;--ink:#1D2127;--soft:#5E6772;--line:#DDD8CF;--line2:#ECE8E0;--accent:#4F46E5;--accent-d:#4338CA;--head:'Barlow Condensed','Arial Narrow',sans-serif}
  *{box-sizing:border-box}[hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Inter',system-ui,sans-serif}
  button,input,select{font:inherit;color:inherit}h1,h2,h3{font-family:var(--head);font-weight:600;margin:0}
  header{background:var(--card);border-bottom:3px solid var(--accent);padding:12px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:26px;text-transform:uppercase;line-height:1}.sub{color:var(--soft);font-size:12.5px;margin-top:3px}.grow{flex:1;min-width:240px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:500}.btn:hover{border-color:#B9B2A6}.btn.sm{padding:3px 9px;font-size:12px}.btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.go{background:var(--accent);border-color:var(--accent);color:#fff}
  main{padding:16px 22px 50px;max-width:1400px;margin:0 auto;display:grid;grid-template-columns:minmax(380px,.9fr) minmax(0,1.1fr);gap:16px;align-items:start}
  @media(max-width:1000px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px}
  .pn{padding:14px 16px}.pn h2{font-size:20px;text-transform:uppercase;margin-bottom:8px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .bar select,.bar input,.add input{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 8px}
  td input.einp{border:1px solid transparent;background:transparent;border-radius:4px;padding:4px 6px;width:100%}
  td input.einp:hover,td input.einp:focus{border-color:var(--line);background:#fff}
  .tw{max-height:560px;overflow:auto;border:1px solid var(--line2);border-radius:8px}
  table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 9px;border-bottom:1px solid var(--line2);text-align:left}
  th{position:sticky;top:0;background:#F7F4EE;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);z-index:1}
  .gh{padding:12px 16px;border-left:8px solid var(--accent);display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;background:#FBFAF7;border-bottom:1px solid var(--line2)}
  .gh h2{font-size:22px;text-transform:uppercase}.gh .who{font-size:13px;color:var(--soft)}.gh .who b{color:var(--ink)}
  .empty{padding:22px;text-align:center;color:var(--soft)}.note{color:var(--soft);font-size:12.5px;margin:6px 0 0}
  .add{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  #toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;z-index:60;pointer-events:none}#toast.show{opacity:1}
</style>
</head>
<body>
<header><div class="grow"><h1>Technical Department — Employees</h1><div class="sub">Assign employees to the Technical Department roster</div></div><button class="btn" id="xl">Download roster (Excel)</button><button class="btn" id="bk">Backup</button><label class="btn" style="margin:0">Restore<input id="rs" type="file" accept=".json" hidden></label></header>
<main>
 <section class="card pn"><h2>Employees</h2>
  <div class="bar"><input id="q" placeholder="Search name or number" style="min-width:190px"><select id="lf"></select><label style="display:flex;gap:5px;align-items:center"><input type="checkbox" id="un" checked> not yet in this department</label></div>
  <div class="bar"><span class="note" style="margin:0" id="sel">0 selected</span><button class="btn sm go" data-to="1">→ Assign to Technical Department</button><button class="btn sm" data-to="0">Remove from department</button></div>
  <div class="tw"><table><thead><tr><th><input type="checkbox" id="all"></th><th>No</th><th>Name</th><th>Location</th><th>In dept?</th><th></th></tr></thead><tbody id="pool"></tbody></table></div>
  <p class="note" id="src">Employees come from the attendance reports uploaded on the HR Department · Attendance tab. You can also add someone by hand.</p>
  <div class="add"><input id="mn" placeholder="Employee no" style="width:120px"><input id="mm" placeholder="Name" style="min-width:160px"><button class="btn sm" id="ma">Add employee</button></div>
 </section>
 <section class="card"><div class="gh"><h2>Technical Department roster</h2><span class="who"><b id="cnt">0</b> assigned</span></div><div id="roster"></div></section>
</main>
<div id="toast"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id),KEY='fitl_tech_employees_v1';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const normLoc=l=>String(l==null?'':l).replace(/\s+/g,' ').trim();
let POOL={},ASSIGN={},PICK=new Set();const F={q:'',loc:'',un:true};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){POOL=s.POOL||{};ASSIGN=s.ASSIGN||{}}}catch(_){}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({POOL,ASSIGN}))}catch(_){toast('Could not save — browser storage is full. Download a backup.')}}
const nm=no=>(POOL[no]||{}).name||no;
function renameEmployee(oldNo,newVal){
  const newNo=(newVal||'').trim().toUpperCase();
  if(!newNo||newNo===oldNo){render();return}
  if(POOL[newNo]){toast('Employee '+newNo+' already exists');render();return}
  POOL[newNo]=POOL[oldNo];delete POOL[oldNo];
  if(ASSIGN[oldNo]){ASSIGN[newNo]=ASSIGN[oldNo];delete ASSIGN[oldNo]}
  if(PICK.has(oldNo)){PICK.delete(oldNo);PICK.add(newNo)}
  save();render();toast('Renamed to '+newNo)
}
function deleteEmployee(no){
  const n=(POOL[no]||{}).name||no;
  if(!confirm('Delete employee '+no+' ('+n+')? This also removes them from the department roster if assigned.'))return;
  delete POOL[no];delete ASSIGN[no];PICK.delete(no);save();render()
}
function render(){
  const locs=[...new Set(Object.values(POOL).map(p=>normLoc(p.loc)).filter(Boolean))].sort();
  $('lf').innerHTML='<option value="">All locations</option>'+locs.map(l=>'<option value="'+esc(l)+'"'+(l===F.loc?' selected':'')+'>'+esc(l)+'</option>').join('');
  const q=F.q.trim().toLowerCase();
  const rows=Object.keys(POOL).filter(no=>(!F.un||!ASSIGN[no])&&(!F.loc||normLoc(POOL[no].loc)===F.loc)&&(!q||(no+' '+POOL[no].name).toLowerCase().includes(q))).sort((a,b)=>(POOL[a].loc||'').localeCompare(POOL[b].loc||'')||POOL[a].name.localeCompare(POOL[b].name));
  $('pool').innerHTML=rows.slice(0,700).map(no=>'<tr><td><input type="checkbox" data-pick="'+no+'"'+(PICK.has(no)?' checked':'')+'></td>'+
    '<td><input class="einp" data-eno="'+esc(no)+'" value="'+esc(no)+'" style="width:76px"></td>'+
    '<td><input class="einp" data-ename="'+esc(no)+'" value="'+esc(POOL[no].name)+'" style="min-width:150px"></td>'+
    '<td>'+esc(POOL[no].loc||'')+'</td><td>'+(ASSIGN[no]?'Yes':'–')+'</td>'+
    '<td><button class="btn sm" data-del="'+esc(no)+'">Delete</button></td></tr>').join('')||'<tr><td colspan="6" class="empty">'+(Object.keys(POOL).length?'Nobody matches these filters.':'No employees yet — upload an attendance report on the HR Department · Attendance tab, or add someone by hand below.')+'</td></tr>';
  $('sel').textContent=PICK.size+' selected · '+rows.length+' shown';$('all').checked=false;
  const assigned=Object.keys(ASSIGN).sort((a,b)=>nm(a).localeCompare(nm(b)));
  $('cnt').textContent=assigned.length;
  $('roster').innerHTML=assigned.length?'<div class="tw" style="border:0;border-radius:0;max-height:560px"><table><thead><tr><th>No</th><th>Name</th><th>Location</th><th>Designation</th><th></th></tr></thead><tbody>'+
    assigned.map(no=>'<tr><td>'+no+'</td><td>'+esc(nm(no))+'</td><td>'+esc((POOL[no]||{}).loc||'')+'</td>'+
      '<td><input class="einp" data-desig="'+esc(no)+'" value="'+esc(ASSIGN[no].desig||'')+'" placeholder="e.g. Technical Officer" style="min-width:150px"></td>'+
      '<td><button class="btn sm" data-out="'+esc(no)+'">Remove</button></td></tr>').join('')+'</tbody></table></div>'
    :'<div class="empty">Nobody in the Technical Department roster yet — tick employees on the left and press “→ Assign to Technical Department”.</div>';
}
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.pick){t.checked?PICK.add(t.dataset.pick):PICK.delete(t.dataset.pick);$('sel').textContent=PICK.size+' selected'}
  else if(t.id==='all'){document.querySelectorAll('[data-pick]').forEach(c=>{c.checked=t.checked;t.checked?PICK.add(c.dataset.pick):PICK.delete(c.dataset.pick)});$('sel').textContent=PICK.size+' selected'}
  else if(t.dataset.eno){renameEmployee(t.dataset.eno,t.value)}
  else if(t.dataset.ename){const no=t.dataset.ename,v=t.value.trim();if(!v){toast('Name cannot be empty');render();return}POOL[no].name=v;POOL[no].manual=true;save();render()}
  else if(t.dataset.desig){const no=t.dataset.desig;if(ASSIGN[no]){ASSIGN[no].desig=t.value.trim();save()}}
  else if(t.id==='lf'){F.loc=t.value;render()}else if(t.id==='un'){F.un=t.checked;render()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){F.q=e.target.value;const p=e.target.selectionStart;render();const n=$('q');n.focus();try{n.setSelectionRange(p,p)}catch(_){}}});
document.addEventListener('click',e=>{
  const to=e.target.closest('[data-to]');if(to){if(!PICK.size){toast('Tick the employees first');return}const add=to.dataset.to==='1';PICK.forEach(no=>{if(add)ASSIGN[no]=ASSIGN[no]||{desig:''};else delete ASSIGN[no]});const n=PICK.size;PICK.clear();save();render();toast(n+' employee'+(n===1?'':'s')+(add?' assigned to Technical Department':' removed from the department'));return}
  const out=e.target.closest('[data-out]');if(out){delete ASSIGN[out.dataset.out];save();render();return}
  const del=e.target.closest('[data-del]');if(del){deleteEmployee(del.dataset.del)}});
$('ma').onclick=()=>{const no=$('mn').value.trim().toUpperCase(),n=$('mm').value.trim();if(!no||!n){toast('Enter the employee number and name');return}POOL[no]={name:n,loc:'',manual:true};$('mn').value=$('mm').value='';save();render();toast(n+' added')};
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
$('bk').onclick=()=>dl(new Blob([JSON.stringify({POOL,ASSIGN})],{type:'application/json'}),'Technical_employees_backup_'+new Date().toISOString().slice(0,10)+'.json');
$('rs').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.ASSIGN)throw 0;if(!confirm('Restoring replaces the current roster. Continue?'))return;POOL=s.POOL||{};ASSIGN=s.ASSIGN;save();render();toast('Backup restored')}catch(_){toast('That is not a Technical employees backup')}};r.readAsText(f);e.target.value=''};
$('xl').onclick=()=>{const rows=Object.keys(ASSIGN).sort((a,b)=>nm(a).localeCompare(nm(b))).map(no=>({'Employee no':no,Name:nm(no),Location:(POOL[no]||{}).loc||'',Designation:ASSIGN[no].desig||''}));
  if(!rows.length){toast('No employees are assigned yet');return}const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Technical roster');XLSX.writeFile(wb,'Technical_employees_'+new Date().toISOString().slice(0,10)+'.xlsx')};
/* the employee list arrives from the HR Attendance tab, through the host page */
addEventListener('message',ev=>{if(ev.source!==parent)return;const m=ev.data;
  if(m&&m.type==='fitl-employees'&&Array.isArray(m.items)){let changed=false;m.items.forEach(i=>{if(!i.no)return;const o=POOL[i.no],nw={name:i.name||(o&&o.name)||i.no,loc:normLoc(i.loc)||(o&&o.loc)||'',manual:o&&o.manual&&!i.name};if(!o||o.name!==nw.name||o.loc!==nw.loc){POOL[i.no]=nw;changed=true}});if(changed){save();render()}$('src').textContent=m.items.length+' employees received from the attendance reports (HR Department · Attendance).'}});
render();
try{parent.postMessage({type:'fitl-techemployees-ready'},'*')}catch(_){}
})();
</script>
</body>
</html>
