<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maintenance Dashboard — FITL</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--red:#c8102e;--ink:#1f2328;--mut:#6b7280;--bg:#f3f4f6;--line:#e5e7eb;--S:#16a34a;--N:#2563eb;--B:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--red);color:#fff;padding:12px 18px}
header h1{margin:0;font-size:19px}header small{opacity:.85}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
button,select,input{font:inherit;font-size:14px;border:1px solid #cbd5e1;border-radius:7px;padding:6px 11px;background:#fff;color:var(--ink)}
button{cursor:pointer}button:hover{border-color:var(--red)}
header button{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff}
header button:hover{background:rgba(255,255,255,.28)}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 16px 0;max-width:1250px;margin:0 auto}
nav button{border-radius:8px 8px 0 0;border-bottom:none;background:#e5e7eb}
nav button.on{background:#fff;color:var(--red);font-weight:700}
main{max-width:1250px;margin:0 auto;padding:0 16px 24px}
.pane{background:#fff;border:1px solid var(--line);border-radius:0 10px 10px 10px;padding:14px}
.flt{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.flt label{display:block;font-size:12px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.k b{display:block;font-size:24px}.k span{font-size:12px;color:var(--mut)}
.k.r b{color:var(--B)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;margin-bottom:14px}
.cb{border:1px solid var(--line);border-radius:9px;padding:10px;min-width:0}
.cb h3{margin:0 0 6px;font-size:14px}.cb canvas{max-height:300px}
.tw{overflow-x:auto;max-height:460px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
th{background:#f9fafb;position:sticky;top:0;font-size:11px;text-transform:uppercase;color:var(--mut)}
td.n,th.n{text-align:right}
.tag{font-weight:700;border-radius:5px;padding:1px 7px;color:#fff;font-size:12px}
.tag.S{background:var(--S)}.tag.N{background:var(--N)}.tag.B{background:var(--B)}
.empty{text-align:center;padding:50px 10px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin:6px 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;z-index:9}
#toast.on{opacity:1}#toast.bad{background:var(--B)}
@media print{header .bar,nav,.flt button,.no-print{display:none!important}body{background:#fff}.pane{border:none}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>

<script>
const LS="fitl_maint_dash_v1",MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const SL={S:"Service (planned)",N:"Normal work",B:"Breakdown"},SC={S:"#16a34a",N:"#2563eb",B:"#dc2626"};
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0"),r1=n=>Math.round(n*10)/10;
/*PARSE_START*/
const clean=v=>v==null?"":String(v).replace(/\s+/g," ").trim();
function parseHours(v){
 if(v==null||v==="")return{h:null,t:"missing"};
 if(typeof v==="number")return{h:v};
 const s=clean(v).toLowerCase().replace(/\s/g,"");
 if(/^\d+(\.\d+)?$/.test(s))return{h:+s};
 let m=s.match(/(\d+(?:\.\d+)?)h/);
 if(m){const mm=s.match(/(\d+)m/);return{h:+m[1]+(mm?+mm[1]/60:0)}}
 m=s.match(/(\d+(?:\.\d+)?)m/);if(m)return{h:+m[1]/60};
 return{h:null,t:/^\*+$/.test(s)?"stars":"bad"};
}
function parseDate(v,today){
 let y,m,d,note="";
 if(Object.prototype.toString.call(v)==="[object Date]"){const x=new Date(v.getTime()+43200000);y=x.getFullYear();m=x.getMonth()+1;d=x.getDate()}
 else{
  const s=clean(v);if(!s)return null;
  const n=s.match(/\d+/g)||[];
  if(n.length===3){let a=+n[0],b=+n[1];y=+n[2];if(y<100)y+=2000;if(a>12&&b<=12){d=a;m=b}else if(b>12&&a<=12){m=a;d=b}else{d=a;m=b}}
  else if(n.length===2&&n[1].length===6){y=+n[1].slice(2);d=+n[1].slice(0,2);m=+n[0]}
  else return{bad:s};
  note="text date";
 }
 const ok=(Y,M,D)=>Y>=2020&&Y<=2035&&M>=1&&M<=12&&D>=1&&D<=31;
 if(!ok(y,m,d))return{bad:clean(v)};

function parseDaily(wb,fname,today){
 const ws=wb.Sheets[wb.SheetNames[0]],A=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
 const r0=XLSX.utils.decode_range(ws["!ref"]).s.r;
 const hi=A.findIndex(r=>r&&r.some(c=>typeof c==="string"&&/^\s*date\s*$/i.test(c)));
 if(hi<0)throw new Error('Could not find the "date" header row — is this the Daily Maintenance Record?');
 const H=A[hi].map(c=>clean(c).toLowerCase()),ix=k=>H.findIndex(h=>h.startsWith(k));
 const c={d:ix("date"),m:ix("machine"),x:ix("desc"),h:ix("time"),s:ix("status"),t:ix("tech"),r:ix("remark")};
 const recs=[],issues=[],names={};
 for(let i=hi+1;i<A.length;i++){
  const w=A[i];if(!w)continue;
  const row=r0+i+1,mach=clean(w[c.m]),desc=clean(w[c.x]);
  if(!mach&&!desc)continue;
  const iss=(type,val,note)=>issues.push({row,type,val:clean(val),note});
  let hv=w[c.h],sv=w[c.s];
  const isS=x=>/^[SNB]$/i.test(clean(x));
  if(!isS(sv)&&isS(hv)){const t=hv;hv=sv;sv=t;iss("Columns swapped",t+" / "+hv,"Status and hours were in each other's column — corrected")}
  const st=isS(sv)?clean(sv).toUpperCase():"";
  if(!st)iss("Status missing/invalid",sv,"Counted as 'No status'");
  const ph=parseHours(hv);
  if(ph.h==null)iss(ph.t==="missing"?"Hours missing":ph.t==="stars"?"Hours not recorded (***)":"Hours unreadable",hv,"Job counted, hours excluded");
  const pd=parseDate(w[c.d],today);
  if(!pd){iss("Date missing","","Record excluded from the dashboard");continue}
  if(pd.bad){iss("Date unreadable",pd.bad,"Record excluded from the dashboard");continue}
  if(pd.fix)iss(pd.fix.startsWith("Future date")&&pd.fix.includes("auto")?"Date auto-corrected":"Date in future",pd.iso,pd.fix);
  const key=(mach.toLowerCase().replace(/[.\s]+/g," ").trim().replace(/bambury|banbary/,"banbury").replace(/batch[- ]?off/,"batch off"))||"(not stated)";
  if(!names[key])names[key]=mach||"(not stated)";
  recs.push({d:pd.iso,m:key,x:desc,h:ph.h,s:st,t:splitTech(w[c.t]),r:clean(w[c.r]),row});
 }
 recs.forEach(r=>r.g=grp(r.m));
 const cnt={};recs.forEach(r=>r.t.forEach(t=>cnt[t]=(cnt[t]||0)+1));
 const lev=(a,b)=>{if(Math.abs(a.length-b.length)>1)return 9;let i=0;while(i<a.length&&a[i]===b[i])i++;const x=a.slice(i),y=b.slice(i);if(x.length===y.length)return x.slice(1)===y.slice(1)?1:9;return(x.length>y.length?x.slice(1)===y:y.slice(1)===x)?1:9};
 const ns=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]),map={},merged=[];
 ns.forEach((n,i)=>{if(n.length<5||n==="Outsource")return;for(let j=0;j<i;j++){const m=ns[j];if(!map[m]&&m.length>=5&&lev(n.toLowerCase(),m.toLowerCase())===1){map[n]=m;merged.push(n+" → "+m);break}}});

function parsePM(wb,fname){
 const plans={},XU=XLSX.utils;
 wb.SheetNames.forEach(n=>{
  const ws=wb.Sheets[n];if(!ws["!ref"]||/machine/i.test(n))return;
  const R=XU.decode_range(ws["!ref"]),v=(r,c)=>{const x=ws[XU.encode_cell({r,c})];return x?x.v:null};
  const tasks=[];let blk="",sec="";
  for(let r=0;r<=R.e.r;r++){
   const b=v(r,1);if(typeof b==="string"&&/^[A-D]$/.test(b.trim()))blk=b.trim();
   const F=clean(v(r,5));if(!F)continue;
   const E=clean(v(r,4)),D=v(r,3),w={};let hdr=true,any=false;
   for(let k=1;k<=52;k++){const x=v(r,5+k);if(typeof x==="number"){any=true;if(x>0)w[k]=x;if(x!==k)hdr=false}}
   if(any&&hdr){if(!E)sec=F;continue}
   if(!E&&(D==null||D==="")&&!any){sec=F;continue}
   tasks.push({sec:(blk?blk+" · ":"")+(sec||"General"),fr:E,task:F,w});
  }
  if(tasks.length<10)return;
  const cap={};
  for(let r=0;r<=Math.min(R.e.r,12);r++)if(/target/i.test(clean(v(r,61))))for(let k=1;k<=52;k++){const x=v(r,61+k);if(typeof x==="number")cap[k]=x}
  let ytd=0;
  for(let r=0;r<=12;r++)for(let c=61;c<=113;c++){const x=ws[XU.encode_cell({r,c})];if(x&&typeof x.f==="string"){const m=x.f.match(/SUM\(\$?([A-Z]+)\$?\d+:\$?([A-Z]+)\$?\d+\)\s*\/\s*SUM/);if(m)ytd=Math.max(ytd,XU.decode_col(m[2])-61)}}
  plans[n]={tasks,cap,ytd};
 });
 const names=Object.keys(plans);if(!names.length)throw new Error("No annual plan sheet found — is this the Annual Works PM file?");
 const hasT=n=>Object.keys(plans[n].cap).length>0;
 const act=names.find(hasT)||"",pl=names.find(n=>n!==act)||names[0];
 const ym=(fname+names.join(" ")).match(/20\d\d/);
 const o={file:fname,at:new Date().toISOString(),plans,planSel:pl,actSel:act,year:ym?+ym[0]:new Date().getFullYear(),through:0};
 o.through=(act&&plans[act].ytd)||guessThrough(o);return o;
}

}

 const lab=[...Array(52)].map((_,i)=>i+1);
 drawChart("c1",{data:{labels:lab,datasets:[{type:"bar",label:"Target hours",data:lab.map(k=>T[k]),backgroundColor:"#d1d5db"},{type:"bar",label:"Actual hours",data:lab.map(k=>ac&&k<=N?M.AW[k]:null),backgroundColor:"#c8102e"},{type:"line",label:"Service (S) hours in daily record",data:lab.map(k=>r1(done[k])),borderColor:"#16a34a",pointRadius:2}]}});
 drawChart("c2",{type:"bar",data:{labels:mo.map(x=>x.m),datasets:[{label:"Adherence %",data:mo.map(x=>x.adh==null?null:Math.round(x.adh*100)),backgroundColor:mo.map(x=>x.adh!=null&&x.adh<.8?"#dc2626":"#16a34a")}]},options:{scales:{y:{suggestedMax:100}}},legend:false});
 const el=document.querySelector('[data-f="pq"]');if(el&&document.activeElement===document.body&&pq){el.focus();el.setSelectionRange(pq.length,pq.length)}
}
function vRc(){
 const L=rows().filter(r=>!q||(r.m+r.x+r.t.join()+r.r).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.d.localeCompare(a.d));
 $("#pane").innerHTML=filters(`<div><label>Search</label><input data-f="q" value="${esc(q)}" placeholder="machine, work, technician"></div>`)+`<div class="note">${L.length} matching job(s)${L.length>300?" — showing newest 300 (the Excel report contains all)":""}</div>`+
 tbl(["Date","Machine","Description","Hrs","St","Technician","Remark"],L.slice(0,300).map(r=>[r.d,esc(mName(r.m)),esc(r.x),r.h==null?"–":r1(r.h),tag(r.s),esc(r.t.join(", ")),esc(r.r)]),[3]);
 const el=document.querySelector('[data-f="q"]');if(el&&q){el.focus();el.setSelectionRange(q.length,q.length)}
}
function vDq(){
 const I=D.daily.issues,C={};I.forEach(i=>C[i.type]=(C[i.type]||0)+1);
 $("#pane").innerHTML=`<div class="kpis">${kpi(D.daily.recs.length,"Jobs loaded")}${Object.entries(C).map(([k,v])=>kpi(v,k,/excluded/.test(I.find(i=>i.type===k).note)?"r":"")).join("")}</div>
 <div class="note">${D.daily.merged&&D.daily.merged.length?"Technician spellings merged: "+esc(D.daily.merged.join(", "))+". ":""}These are problems in the Excel sheet itself. Fix them in the source file and upload it again. “Auto-corrected” dates were future dates whose day and month looked swapped — please verify them.</div>`+
 tbl(["Excel row","Issue","Value","Handled as"],I.map(i=>[i.row,esc(i.type),esc(i.val),esc(i.note)]),[0]);
}

/* ---------- reports & backup ---------- */
function report(){
 if(!D.daily&&!D.pm){toast("Upload a file first",1);return}
 const wb=XLSX.utils.book_new(),add=(n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n);
 if(D.daily){
  const L=rows(),T=totals(L);
  add("Summary",[["Maintenance report — Ferentino Industrial Tyres (Pvt) Ltd"],["Generated",new Date().toLocaleString()],["Source",D.daily.file],["Filter","Year: "+F.y+" | Month: "+F.m+" | Status: "+F.s],[],["Jobs",T.n],["Hours recorded",r1(T.h)],["Breakdown jobs",T.B],["Breakdown hours",r1(T.Bh)],["Breakdown % of hours",T.h?r1(T.Bh/T.h*100):0],[],["Status codes","S = planned service, N = normal work, B = breakdown"]]);
  const ms=[...new Set(L.map(r=>r.d.slice(0,7)))].sort();
  add("Monthly",[["Month","Jobs","Hours","Service jobs","Normal jobs","Breakdown jobs","Breakdown hours"],...ms.map(m=>{const o=agg(L.filter(r=>r.d.startsWith(m)),()=>"x")[0];return[m,o.n,r1(o.h),o.S,o.N,o.B,r1(o.Bh)]})]);
  add("Machines",[["Machine / area","Group","Jobs","Hours","Service","Normal","Breakdown","Breakdown hours"],...agg(L,r=>r.m).sort((a,b)=>b.n-a.n).map(x=>[mName(x.k),grp(x.k),x.n,r1(x.h),x.S,x.N,x.B,r1(x.Bh)])]);
  add("Technicians",[["Technician","Jobs","Job hours","Service","Normal","Breakdown"],...agg(L,r=>r.t.length?r.t:["(not recorded)"]).sort((a,b)=>b.n-a.n).map(x=>[x.k,x.n,r1(x.h),x.S,x.N,x.B])]);
  add("Job records",[["Date","Machine","Group","Description","Hours","Status","Technician","Remark"],...L.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(r=>[r.d,mName(r.m),r.g,r.x,r.h,r.s,r.t.join(" + "),r.r])]);
  add("Data issues",[["Excel row","Issue","Value","Handled as"],...D.daily.issues.map(i=>[i.row,i.type,i.val,i.note])]);
 }
 if(D.pm){
  const M=pmModel(),ds=serviceByWeek(M.P.year);
  add("PM adherence",[["PM adherence through week "+M.N,M.adh==null?"":r1(M.adh*100)+"%"],[],["Month","Target hours","Actual hours","Adherence (avg of weekly %)"],...M.mo.filter(x=>x.ts).map(x=>[x.m,x.ts,x.as,x.adh==null?"":r1(x.adh*100)+"%"])]);
  add("PM weekly",[["Week","Target hours","Actual hours","Adherence","Service hours (daily record)"],...[...Array(52)].map((_,i)=>{const k=i+1,a=M.ac&&k<=M.N;return[k,M.T[k],a?M.AW[k]:"",a&&M.T[k]?r1(M.AW[k]/M.T[k]*100)+"%":"",r1(ds[k])]})]);
  add("PM tasks",[["Section","Frequency","Task","Planned (year)","Planned to wk "+M.N,"Actual to wk "+M.N,"Weeks missed","Missed week numbers"],...M.pairs.map(p=>[p.t.sec,p.t.fr,p.t.task,p.tot,p.pn,p.a?p.an:"",p.miss.length,p.miss.join(", ")])]);
 }
 XLSX.writeFile(wb,"Maintenance_Report_"+todayISO()+".xlsx");
}
function dlText(txt,name,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function readBook(file,fn){const r=new FileReader();r.onload=()=>{try{fn(XLSX.read(new Uint8Array(r.result),{type:"array",cellDates:true}))}catch(e){toast(e.message||"Could not read the file",1)}};r.readAsArrayBuffer(file)}

document.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a==="tab"){tab=b.dataset.k;render()}
 else if(a==="upd")$("#f_d").click();else if(a==="upp")$("#f_p").click();else if(a==="res")$("#f_b").click();
 else if(a==="rep")report();else if(a==="print")window.print();
 else if(a==="bak"){if(!D.daily&&!D.pm){toast("Nothing to back up yet",1);return}dlText(JSON.stringify({app:"fitl-maintenance-dashboard",v:1,saved:new Date().toISOString(),...D}),"Maintenance_Dashboard_Backup_"+todayISO()+".json","application/json")}
});
document.addEventListener("change",e=>{
 const t=e.target,f=t.dataset.f;
 if(t.id==="f_d"&&t.files[0]){const n=t.files[0].name;readBook(t.files[0],wb=>{D.daily=parseDaily(wb,n,todayISO());save();F={y:"all",m:"all",s:"all"};render();toast(`Loaded ${D.daily.recs.length} jobs · ${D.daily.issues.length} data issue(s) noted`)});t.value="";return}
 if(t.id==="f_p"&&t.files[0]){const n=t.files[0].name;readBook(t.files[0],wb=>{D.pm=parsePM(wb,n);save();tab="pm";render();toast("Annual PM plan loaded")});t.value="";return}
 if(t.id==="f_b"&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.app!=="fitl-maintenance-dashboard")throw 0;if(!confirm("Replace the data currently in the dashboard with this backup?"))return;D={daily:j.daily||null,pm:j.pm||null};save();render();toast("Backup restored")}catch(x){toast("Not a valid dashboard backup file",1)}};r.readAsText(t.files[0]);t.value="";return}
 if(f==="y"||f==="m"||f==="s"){F[f]=t.value;render()}
 else if(f==="mt"){mt=t.value;render()}
 else if(f==="sheet"){D.pm.planSel=t.value;save();render()}
 else if(f==="asheet"){D.pm.actSel=t.value;D.pm.through=guessThrough(D.pm);save();render()}
 else if(f==="thru"){D.pm.through=Math.max(0,Math.min(52,+t.value||0));save();render()}
 else if(f==="year"){D.pm.year=+t.value||D.pm.year;save();render()}
});
document.addEventListener("input",e=>{const f=e.target.dataset.f;if(f==="q"){q=e.target.value;render()}if(f==="pq"){pq=e.target.value;render()}});
render();
</script>
</body>
</html>
