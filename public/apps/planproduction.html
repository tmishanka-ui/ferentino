function yearsPresent(){
  const s=new Set([Y]);
  [...D.planned,...D.actual,...D.shipments].forEach(e=>{if(e.date)s.add(+e.date.slice(0,4))});
  return[...s].sort((a,b)=>a-b);
}
function daysInMonth(y,m){return new Date(y,m,0).getDate()}
function periodDefs(){
  if(V.view==='day'){
    const dim=daysInMonth(V.year,V.month),out=[];
    for(let d=1;d<=dim;d++){const ds=V.year+'-'+pad(V.month)+'-'+pad(d);out.push({label:pad(d)+' '+MONS[V.month-1],from:ds,to:ds})}
    return out;
  }
  if(V.view==='month'){
    const out=[];
    for(let m=1;m<=12;m++){out.push({label:MONS[m-1],from:V.year+'-'+pad(m)+'-01',to:V.year+'-'+pad(m)+'-'+pad(daysInMonth(V.year,m))})}
    return out;
  }
  return yearsPresent().map(y=>({label:String(y),from:y+'-01-01',to:y+'-12-31'}));
}
const sumIn=(list,from,to)=>list.reduce((s,e)=>s+(e.date>=from&&e.date<=to?num(e.qty):0),0);
function rows(){return periodDefs().map(p=>{const planned=sumIn(D.planned,p.from,p.to),actual=sumIn(D.actual,p.from,p.to),shipment=sumIn(D.shipments,p.from,p.to);
  return{label:p.label,planned,actual,shipment,variance:actual-planned,pct:planned>0?(actual-planned)/planned*100:null}})}

/* ---------- screen ---------- */
let CH=[];
function destroy(){CH.forEach(c=>c.destroy());CH=[]}
const mk=(id,cfg)=>{if(typeof Chart==='undefined'||!$(id))return;Chart.defaults.font.family="Inter,system-ui,sans-serif";CH.push(new Chart($(id),cfg))};
const yOpts=()=>yearsPresent().map(y=>'<option'+(y===V.year?' selected':'')+'>'+y+'</option>').join('');
const mOpts=()=>MONS.map((m,i)=>'<option value="'+(i+1)+'"'+(i+1===V.month?' selected':'')+'>'+m+'</option>').join('');

function render(){
  destroy();
  const R=rows(),tot=R.reduce((a,r)=>({planned:a.planned+r.planned,actual:a.actual+r.actual,shipment:a.shipment+r.shipment}),{planned:0,actual:0,shipment:0});
  const totPct=tot.planned>0?(tot.actual-tot.planned)/tot.planned*100:null;
  const shipGap=tot.actual-tot.shipment;
  let h='<div class="bar"><div class="seg">'+[['day','Daily'],['month','Monthly'],['year','Yearly']].map(v=>'<button class="'+(V.view===v[0]?'on':'')+'" data-view="'+v[0]+'">'+v[1]+'</button>').join('')+'</div>';
  if(V.view!=='year')h+='<select id="vy">'+yOpts()+'</select>';
  if(V.view==='day')h+='<select id="vm">'+mOpts()+'</select>';
  h+='<span class="note" style="flex:1"></span></div>';
  h+='<div class="tiles">'+
   '<div class="card t"><small>Planned production</small><b>'+nf(tot.planned)+'</b><div class="n">selected period</div></div>'+
   '<div class="card t"><small>Actual production</small><b>'+nf(tot.actual)+'</b><div class="n">selected period</div></div>'+
   '<div class="card t '+(totPct==null?'':totPct>=0?'good':'bad')+'"><small>Actual vs planned</small><b class="'+(totPct==null?'':totPct>=0?'good-tx':'bad-tx')+'">'+(totPct==null?'–':(totPct>=0?'+':'')+totPct.toFixed(1)+' %')+'</b><div class="n">variance: '+(tot.actual-tot.planned>=0?'+':'')+nf(tot.actual-tot.planned)+'</div></div>'+
   '<div class="card t"><small>Shipment load</small><b>'+nf(tot.shipment)+'</b><div class="n">selected period</div></div>'+
   '<div class="card t '+(shipGap===0?'':shipGap>0?'mid':'good')+'"><small>Actual vs shipment</small><b>'+(shipGap>=0?'+':'')+nf(shipGap)+'</b><div class="n">'+(shipGap>0?'produced not yet shipped':shipGap<0?'shipped more than produced in period':'in balance')+'</div></div></div>';
  h+='<div class="grid2"><div class="card cb"><canvas id="c1"></canvas></div><div class="card cb"><canvas id="c2"></canvas></div></div>';
  h+='<div class="card pn"><h2>Breakdown — '+(V.view==='day'?MONS[V.month-1]+' '+V.year:V.view==='month'?V.year:'all years')+'</h2><div class="tw"><table><thead><tr><th>'+(V.view==='day'?'Day':V.view==='month'?'Month':'Year')+'</th><th class="r">Planned</th><th class="r">Actual</th><th class="r">Variance</th><th class="r">Variance %</th><th class="r">Shipment load</th></tr></thead><tbody>'+
   R.map(r=>'<tr><td>'+esc(r.label)+'</td><td class="r">'+nf(r.planned)+'</td><td class="r">'+nf(r.actual)+'</td><td class="r '+(r.variance>=0?'good-tx':'bad-tx')+'">'+(r.variance>=0?'+':'')+nf(r.variance)+'</td><td class="r '+(r.pct==null?'':r.pct>=0?'good-tx':'bad-tx')+'">'+(r.pct==null?'–':(r.pct>=0?'+':'')+r.pct.toFixed(1)+' %')+'</td><td class="r">'+nf(r.shipment)+'</td></tr>').join('')+
   '<tr class="tot"><td>Total</td><td class="r">'+nf(tot.planned)+'</td><td class="r">'+nf(tot.actual)+'</td><td class="r">'+(tot.actual-tot.planned>=0?'+':'')+nf(tot.actual-tot.planned)+'</td><td class="r">'+(totPct==null?'–':(totPct>=0?'+':'')+totPct.toFixed(1)+' %')+'</td><td class="r">'+nf(tot.shipment)+'</td></tr></tbody></table></div></div>';
  h+=entryPanel('planned','Planned production entry','Enter the planned production target for a date. Daily entries roll up automatically into the Monthly and Yearly views above.',false);
  h+=entryPanel('actual','Actual production entry','Enter the actual production achieved for a date.',false);
  h+=entryPanel('shipments','Shipment load entry','Record each dispatch — date, tyre description and quantity shipped.',true);
  $('main').innerHTML=h;
  const labels=R.map(r=>r.label);
  mk('c1',{type:'bar',data:{labels,datasets:[{label:'Planned production',data:R.map(r=>r.planned),backgroundColor:'#9CB4D6'},{label:'Actual production',data:R.map(r=>r.actual),backgroundColor:'#1F3A5F'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:'Actual vs Planned Production',font:{size:15}},legend:{position:'bottom'}},scales:{y:{beginAtZero:true}}}});
  mk('c2',{type:'bar',data:{labels,datasets:[{label:'Actual production',data:R.map(r=>r.actual),backgroundColor:'#1F3A5F'},{label:'Shipment load',data:R.map(r=>r.shipment),backgroundColor:'#DA1B22'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:'Actual Production vs Shipment Load',font:{size:15}},legend:{position:'bottom'}},scales:{y:{beginAtZero:true}}}});
}
function entryPanel(key,title,note,isShipment){
  const list=D[key].filter(e=>e.date&&e.date.slice(0,4)===String(V.year)).sort((a,b)=>String(b.date).localeCompare(a.date));
  let h='<details class="card pn" '+(key==='planned'?'open':'')+'><summary>'+esc(title)+' ('+D[key].length+' total)</summary><p class="note" style="margin:6px 0 10px">'+esc(note)+'</p>';
  h+='<div class="entry" data-key="'+key+'"><div><label class="f">Date</label><input type="date" class="ei-date" value="'+todayISO()+'"></div>';
  if(isShipment)h+='<div style="min-width:220px;flex:1"><label class="f">Tyre description</label><input type="text" class="ei-desc" placeholder="e.g. 7.50-16 12PR XZY"></div>';
  h+='<div><label class="f">Quantity</label><input type="number" min="0" class="ei-qty"></div><div><button class="btn red" data-act="addentry" data-key="'+key+'">Add</button></div></div>';
  h+='<div class="tw" style="max-height:300px">'+(list.length?'<table><thead><tr><th>Date</th>'+(isShipment?'<th>Tyre description</th>':'')+'<th class="r">Quantity</th><th></th></tr></thead><tbody>'+
    list.map(e=>'<tr><td>'+dot(e.date)+'</td>'+(isShipment?'<td>'+esc(e.desc)+'</td>':'')+'<td class="r">'+nf(e.qty)+'</td><td><button class="btn sm ghost" data-act="delentry" data-key="'+key+'" data-id="'+e.id+'">✕</button></td></tr>').join('')+
    '</tbody></table>':'<div class="empty">No entries yet for '+V.year+'.</div>')+'</div></details>';
  return h;
}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-view]');if(v){V.view=v.dataset.view;render();return}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,key=a.dataset.key,id=a.dataset.id;
  if(act==='addentry'){
    const box=a.closest('.entry'),date=box.querySelector('.ei-date').value,qty=num(box.querySelector('.ei-qty').value);
    if(!date){toast('Choose a date');return}
    if(!(qty>0)){toast('Enter a quantity greater than zero');return}
    const rec={id:'e'+uid(),date,qty};
    const descEl=box.querySelector('.ei-desc');if(descEl){const desc=descEl.value.trim();if(!desc){toast('Enter the tyre description');return}rec.desc=desc}
    D[key].push(rec);save();V.year=+date.slice(0,4);render();toast('Entry added');
  }
  else if(act==='delentry'){if(confirm('Delete this entry?')){D[key]=D[key].filter(r=>r.id!==id);save();render()}}
});
document.addEventListener('change',e=>{
  if(e.target.id==='vy'){V.year=+e.target.value;render()}
  else if(e.target.id==='vm'){V.month=+e.target.value;render()}
});
$('xl').onclick=()=>{
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows().map(r=>({Period:r.label,Planned:r.planned,Actual:r.actual,Variance:r.variance,'Variance %':r.pct==null?'':+r.pct.toFixed(1),'Shipment load':r.shipment}))),'Summary ('+V.view+')');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.planned.map(e=>({Date:e.date,'Planned qty':e.qty}))),'Planned production');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.actual.map(e=>({Date:e.date,'Actual qty':e.qty}))),'Actual production');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.shipments.map(e=>({Date:e.date,'Tyre description':e.desc,Quantity:e.qty}))),'Shipment load');
  XLSX.writeFile(wb,'Planned_vs_actual_production_'+todayISO()+'.xlsx');
};
render();
})();
</script>
</body>
</html>
