<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internal Audit — FIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--bg:#F2F0EB;--card:#fff;--ink:#1D2127;--soft:#5E6772;--line:#DDD8CF;--line2:#ECE8E0;--red:#DA1B22;--red-d:#B3151B;--red-bg:#FBE9EA;--amber:#B97708;--amber-bg:#FBF0D8;--green:#2C7A4B;--green-bg:#E1F0E7;--blue:#2B5A8C;--blue-bg:#E3ECF6;--head:'Barlow Condensed','Arial Narrow',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box}[hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Inter',system-ui,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}h1,h2,h3{font-family:var(--head);font-weight:600;margin:0}
  header{background:var(--card);border-bottom:3px solid var(--red);padding:12px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header img{height:38px;width:auto;border-radius:4px}h1{font-size:26px;text-transform:uppercase;line-height:1}.sub{color:var(--soft);font-size:12.5px;margin-top:3px}.grow{flex:1;min-width:240px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:500}.btn:hover{border-color:#B9B2A6}.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.red:hover{background:var(--red-d)}.btn.sm{padding:3px 9px;font-size:12px}.btn.ghost{border-color:transparent;color:var(--soft)}.btn.ghost:hover{color:var(--red);background:var(--red-bg)}.btn:disabled{opacity:.5;cursor:default}
  header select{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 10px;max-width:260px}
  nav{background:var(--card);border-bottom:1px solid var(--line);padding:0 22px;display:flex;gap:2px;overflow-x:auto}
  .tab{background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-1px;padding:11px 16px 9px;cursor:pointer;white-space:nowrap;color:var(--soft);font-weight:600}.tab.on{color:var(--ink);border-bottom-color:var(--red)}
  main{padding:18px 22px 60px;max-width:1500px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px}.pn{padding:16px 18px;margin-bottom:14px}.pn h2{font-size:21px;text-transform:uppercase;margin-bottom:10px}
  .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.g .w2{grid-column:1/-1}
  label.f{display:block;font-size:12px;font-weight:600;color:var(--soft);margin-bottom:3px}
  input[type=text],input[type=date],select,textarea{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 9px;width:100%}textarea{resize:vertical;min-height:34px;line-height:1.4}
  input:focus,select:focus,textarea:focus{outline:2px solid #E8A0A3;border-color:var(--red)}
  .tw{overflow:auto;border:1px solid var(--line2);border-radius:8px}
  table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 9px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
  th{background:#F7F4EE;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);position:sticky;top:0;z-index:1}
  td input[type=text],td input[type=date],td select,td textarea{padding:4px 7px;font-size:13px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}.t{padding:12px 14px}.t small{display:block;color:var(--soft);font-size:12px}.t b{font:600 30px/1.1 var(--head)}
  .chip{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .chip.C{background:var(--green-bg);color:var(--green)}.chip.O{background:var(--amber-bg);color:#7A4F05}.chip.N{background:var(--red-bg);color:var(--red-d)}.chip.x{background:#ECE9E3;color:var(--soft)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;white-space:nowrap}.seg button{border:none;background:#fff;padding:5px 10px;cursor:pointer;font-size:12px;font-weight:600;color:var(--soft);border-right:1px solid var(--line)}.seg button:last-child{border-right:none}
  .seg button.C.on{background:var(--green);color:#fff}.seg button.O.on{background:#D69E2E;color:#fff}.seg button.N.on{background:var(--red);color:#fff}
  .lay{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}@media(max-width:900px){.lay{grid-template-columns:1fr}}
  .rail{padding:8px}.rail button{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:9px 10px;cursor:pointer}.rail button:hover{background:#F7F4EE}.rail button.on{background:var(--red-bg);border-color:#F1B9BC}
  .rail b{display:block;font-size:13.5px}.rail small{color:var(--soft);font-size:11.5px}.bar2{height:5px;background:#ECE8E0;border-radius:3px;margin-top:5px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--green)}
  .doc{display:grid;grid-template-columns:1fr auto;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:12px;background:#FBFAF7}.doc b{font-family:var(--mono);font-size:12.5px}
  td.pt{min-width:260px}td.ev{min-width:200px}td.rm{min-width:240px}.cont td{border-top:1px dashed var(--line2)}.sect td{background:#F7F4EE;font-weight:600;font-family:var(--head);font-size:16px;text-transform:uppercase}
  .mx td.c,.mx th.c{text-align:center}.mx td.c label{cursor:pointer;display:block}.mx .n{font-size:11px;color:var(--soft)}.mx .z{color:#B97708;font-weight:700}
  .cb{padding:12px 14px;height:300px;margin-bottom:14px}.empty{padding:34px;text-align:center;color:var(--soft)}
  .veil{position:fixed;inset:0;background:rgba(29,33,39,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px;z-index:50;overflow:auto}.modal{background:#fff;border-radius:12px;width:min(560px,100%);padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}.modal h2{font-size:24px;text-transform:uppercase;margin-bottom:12px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  #toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:420px}#toast.show{opacity:1}
  .note{color:var(--soft);font-size:12.5px}
  .sigbox{border:1px solid var(--line);border-left:4px solid var(--green);border-radius:8px;padding:9px 12px;background:#F4FAF6}.sigbox.empty{border-left-color:var(--line);background:#FBFAF7}.sigbox.stale{border-left-color:var(--amber);background:var(--amber-bg)}.sigbox .warn{color:#7A4F05;font-weight:600;font-size:12.5px;margin-top:4px}
  #printArea{display:none}
  .nf{width:100%;border-collapse:collapse;font-family:Calibri,Arial,sans-serif;margin-bottom:8px}.nf th,.nf td{border:1px solid #444;padding:5px 8px;font-size:11.5px;vertical-align:top;text-align:left}.nf th{background:#EDEDED;width:16%;font-weight:700}
  .nf.head td{vertical-align:middle}.nf .lg{width:24%;text-align:center}.nf .lg img{height:34px;display:block;margin:0 auto 4px}.nf .lg{font-size:10px;font-weight:600}.nf .sys{text-align:center;font-weight:700;letter-spacing:.06em}.nf .ttl{text-align:center;font-weight:700;font-size:17px}
  .nf .big{min-height:70px;height:70px}.nf .sig{height:44px}
  .ncr-form .g{margin-bottom:12px}.ncr-form h3{font-size:18px;text-transform:uppercase;margin:16px 0 8px;padding-top:10px;border-top:1px solid var(--line2)}.ncr-form h3:first-child{border-top:none;margin-top:0;padding-top:0}
  @media print{@page{size:A4 portrait;margin:12mm}body{background:#fff}body>*:not(#printArea){display:none!important}#printArea{display:block}}
</style>
</head>

const sigContent=(kind,a,sh,r)=>kind==='ack'?'ACK|'+ncrBase(a,sh,r):'VER|'+ncrBase(a,sh,r)+'|'+(r.ncr.effective||'')+'|'+(r.ncr.ackSig?r.ncr.ackSig.id:'');

function sigBlock(a,sh,r,kind){
  const n=r.ncr,g=n[kind+'Sig'],lab=kind==='ack'?'Acknowledged by (auditee / process owner)':'Verified by (auditor)';
  const btn='<button class="btn sm" data-act="sign" data-k="'+kind+'" data-rid="'+r.id+'">Sign again</button>';
  if(g)return'<div class="w2"><label class="f">'+lab+'</label>'+sigBox(g,g.content!==sigContent(kind,a,sh,r),btn)+'</div>';
  if(AUTH.server)return'<div class="w2"><label class="f">'+lab+'</label><div class="sigbox empty"><button class="btn red" data-act="sign" data-k="'+kind+'" data-rid="'+r.id+'">Sign with my password</button><div class="note" style="margin-top:4px">'+(AUTH.user?'Signing as '+esc(AUTH.user.name)+'.':'You will be asked to sign in first.')+'</div></div></div>';
  return kind==='ack'?f2('ackBy',r,'Acknowledged by (auditee)')+f2('ackDate',r,'Date','yyyy.mm.dd'):f2('verifiedBy',r,'Verified by (auditor)')+f2('verifyDate',r,'Date verified','yyyy.mm.dd');

const f2=(k,r,lab,ph)=>'<div><label class="f">'+lab+'</label><input type="text" data-n="'+r.id+'" data-f="'+k+'" value="'+esc(r.ncr[k])+'" placeholder="'+esc(ph||'')+'"></div>';
const ncrRows=a=>{const o=[];a.sheets.forEach(sh=>sh.rows.forEach(r=>{if(r.status==='N'&&r.ncr)o.push({s:sh,r})}));return o};
function viewNcr(a){
  const L=ncrRows(a);

  if(!L.some(x=>x.r.id===nk))nk=L[0].r.id;
  const {s:sh,r}=L.find(x=>x.r.id===nk),n=r.ncr,u=r.fu=r.fu||{owner:'',due:'',action:'',state:'Open',capa:false};
  const f=(k,lab,ph,type)=>'<div'+(type==='area'?' class="w2"':'')+'><label class="f">'+lab+'</label>'+(type==='area'?'<textarea data-n="'+r.id+'" data-f="'+k+'" rows="3" placeholder="'+esc(ph||'')+'">'+esc(n[k])+'</textarea>':'<input type="text" data-n="'+r.id+'" data-f="'+k+'" value="'+esc(n[k])+'" placeholder="'+esc(ph||'')+'">')+'</div>';
  const fu=(k,lab,ph,type)=>'<div'+(type==='area'?' class="w2"':'')+'><label class="f">'+lab+'</label>'+(type==='area'?'<textarea data-u="'+r.id+'" data-f="'+k+'" rows="3" placeholder="'+esc(ph||'')+'">'+esc(u[k])+'</textarea>':'<input type="text" data-u="'+r.id+'" data-f="'+k+'" value="'+esc(u[k])+'" placeholder="'+esc(ph||'')+'">')+'</div>';

  h+='<div class="card pn ncr-form"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px"><div style="flex:1;min-width:220px"><h2 style="margin:0">Non-conformity report</h2><div class="sub" style="font-size:12.5px;color:var(--soft)">'+esc(a.title)+' · '+esc(sh.name)+' ('+esc(sh.docNo)+') · finding '+esc(r.fno)+'</div></div><button class="btn" data-act="ncrprint" data-rid="'+r.id+'">Print / Save as PDF</button>'+(u.wmm?'<span class="chip C">In the weekly meeting ✓</span>':'<button class="btn" data-act="wmm" data-rid="'+r.id+'">Send to Weekly Management Meeting</button>')+'</div><p class="note" style="margin:-4px 0 12px">Whether this non-conformity goes to CAPA is decided at the Weekly Management Meeting, after it has been reviewed there.</p>';
  h+='<h3>1 · The finding</h3><div class="g">'+f('no','Report no')+f('date','Date raised','yyyy.mm.dd')+'<div><label class="f">Category</label><select data-n="'+r.id+'" data-f="category"><option'+(n.category==='Major'?' selected':'')+'>Major</option><option'+(n.category!=='Major'?' selected':'')+'>Minor</option></select></div>'+f('auditors','Auditor(s)')+f('auditee','Auditee (responsible person)')+
    f('requirement','Requirement that is not met','The clause or procedure requirement','area')+f('statement','Non-conformity found','What was seen: '+(r.remark||'describe the finding'),'area')+f('evidence','Objective evidence checked','Records, documents, observations','area')+'</div>';
  h+='<h3>2 · Correction and root cause</h3><div class="g">'+f('correction','Immediate correction / containment','What was done straight away','area')+f('correctionDate','Date of correction','yyyy.mm.dd')+f('rootCause','Root cause (why did it happen?)','5-why or fishbone summary','area')+'</div>';
  h+='<h3>3 · Corrective action</h3><div class="g">'+fu('action','Corrective action to stop it happening again','','area')+fu('owner','Responsible person')+fu('due','Target date','yyyy.mm.dd')+'<div><label class="f">Status</label><select data-u="'+r.id+'" data-f="state"><option'+(u.state!=='Closed'?' selected':'')+'>Open</option><option'+(u.state==='Closed'?' selected':'')+'>Closed</option></select></div></div>';
  h+='<h3>4 · Acknowledgement and verification</h3><div class="g">'+sigBlock(a,sh,r,'ack')+
    '<div><label class="f">Effectiveness of the action</label><select data-n="'+r.id+'" data-f="effective"><option value="">Not verified yet</option><option'+(n.effective==='Effective'?' selected':'')+'>Effective</option><option'+(n.effective==='Not effective'?' selected':'')+'>Not effective</option></select></div>'+f('closureDate','Closure date','yyyy.mm.dd')+sigBlock(a,sh,r,'ver')+'</div></div></div>';
  return{h};
}
const sigPrint=g=>g?'<br><small>✔ Signed electronically · '+esc(new Date(g.at).toLocaleString())+' · Sig #'+g.id+(g.designation?' · '+esc(g.designation):'')+'</small>':'';
function ncrPrint(rid){
  const a=cur(),{s:sh,r}=findRow(rid);if(!r||!r.ncr)return;const n=r.ncr,u=r.fu||{},e=x=>esc(x||'').replace(/\n/g,'<br>');
  const row=(l,v,big)=>'<tr><th>'+l+'</th><td'+(big?' class="big"':'')+' colspan="3">'+(v?e(v):'')+'</td></tr>';

   '<table class="nf"><tr><th>Audit</th><td>'+e(a.title)+' · '+e(a.standard)+'</td><th>Department / process</th><td>'+e(sh.name)+' ('+e(sh.docNo)+')</td></tr><tr><th>Clause</th><td>'+e(r.clause)+'</td><th>Category</th><td>'+(n.category==='Major'?'☒':'☐')+' Major &nbsp;&nbsp; '+(n.category!=='Major'?'☒':'☐')+' Minor</td></tr><tr><th>Auditor(s)</th><td>'+e(n.auditors)+'</td><th>Auditee</th><td>'+e(n.auditee)+'</td></tr></table>'+
   '<table class="nf">'+row('Requirement not met',n.requirement,1)+row('Non-conformity found',n.statement||r.remark,1)+row('Objective evidence',n.evidence,1)+row('Correction / containment',(n.correction||'')+(n.correctionDate?'\n(Date: '+n.correctionDate+')':''),1)+row('Root cause',n.rootCause,1)+row('Corrective action',u.action,1)+
   '<tr><th>Responsible</th><td>'+e(u.owner)+'</td><th>Target date</th><td>'+e(u.due)+'</td></tr></table>'+
   '<table class="nf"><tr><th>Acknowledged by (auditee)</th><td class="sig">'+e(n.ackBy)+sigPrint(n.ackSig)+'</td><th>Date</th><td>'+e(n.ackDate)+'</td></tr><tr><th>Verified by (auditor)</th><td class="sig">'+e(n.verifiedBy)+sigPrint(n.verSig)+'</td><th>Date verified</th><td>'+e(n.verifyDate)+'</td></tr><tr><th>Effectiveness</th><td>'+(n.effective==='Effective'?'☒':'☐')+' Effective &nbsp;&nbsp; '+(n.effective==='Not effective'?'☒':'☐')+' Not effective</td><th>Closed on</th><td>'+e(n.closureDate)+(u.state==='Closed'&&!n.closureDate?'Closed':'')+'</td></tr></table>';
  setTimeout(()=>window.print(),60);
}
function viewFind(a){
  const fs=allFindings(a),T=a.sheets.reduce((q,s)=>{const z=stats(s);q.n+=z.n;q.c+=z.c;q.o+=z.o;q.x+=z.x;return q},{n:0,c:0,o:0,x:0}),done=T.c+T.o+T.x,openF=fs.filter(f=>(f.r.fu||{}).state!=='Closed').length;
  let h='<div class="tiles"><div class="card t"><small>Check points audited</small><b>'+done+'<span style="font-size:18px;color:var(--soft)"> / '+T.n+'</span></b></div><div class="card t"><small>Conformity</small><b style="color:var(--green)">'+T.c+'</b><small>'+(done?Math.round(T.c/done*100):0)+' % of audited points</small></div><div class="card t"><small>Observations</small><b style="color:#B97708">'+T.o+'</b></div><div class="card t"><small>Non-conformities (NC)</small><b style="color:var(--red)">'+T.x+'</b></div><div class="card t"><small>Findings still open</small><b>'+openF+'</b></div></div>';
  h+='<div class="card cb"><canvas id="c1"></canvas></div>';
  const unsent=ncFindings(a).filter(x=>!(x.r.fu||{}).wmm).length;
  h+='<div class="card pn"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><h2 style="margin:0;flex:1">Findings</h2>'+(ncFindings(a).length?(unsent?'<button class="btn red" data-act="wmmall">Send all NCs to the Weekly Management Meeting ('+unsent+')</button>':'<span class="chip C">All NCs sent to the Weekly Management Meeting ✓</span>'):'')+'</div>'+(fs.length?'<div class="tw"><table><thead><tr><th>No</th><th>Department</th><th>Clause</th><th>Audit point and finding</th><th>Owner</th><th>Due date</th><th>Corrective action</th><th>State</th><th>NCR</th><th>Weekly meeting</th></tr></thead><tbody>'+
   fs.map(({s,r})=>{const u=r.fu||{};return'<tr><td><span class="chip '+r.status+'">'+esc(r.fno)+'</span></td><td>'+esc(s.name)+'</td><td>'+esc(r.clause)+'</td><td style="min-width:260px"><b>'+esc(r.point)+'</b><div class="note" style="margin-top:2px">'+(r.remark?esc(r.remark):'No remark written yet')+'</div></td>'+
    '<td><input type="text" data-u="'+r.id+'" data-f="owner" value="'+esc(u.owner)+'" style="min-width:110px"></td><td><input type="text" data-u="'+r.id+'" data-f="due" value="'+esc(u.due)+'" placeholder="yyyy.mm.dd" style="width:105px"></td><td><textarea data-u="'+r.id+'" data-f="action" rows="2" style="min-width:210px">'+esc(u.action)+'</textarea></td>'+
    '<td><select data-u="'+r.id+'" data-f="state"><option'+(u.state!=='Closed'?' selected':'')+'>Open</option><option'+(u.state==='Closed'?' selected':'')+'>Closed</option></select></td><td>'+(r.status==='N'&&r.ncr?'<button class="btn sm" data-act="openncr" data-rid="'+r.id+'">'+esc(r.ncr.no)+'</button>':'<span class="note">—</span>')+'</td><td>'+(r.status==='N'?(u.wmm?'<span class="chip C">Sent ✓</span>':'<button class="btn sm" data-act="wmm" data-rid="'+r.id+'">Send to meeting</button>'):'<span class="note">—</span>')+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty">No observations or non-conformities recorded yet.</div>')+'</div>';
  return{h,after:()=>{if(typeof Chart==='undefined'||!$('c1'))return;Chart.defaults.font.family="Inter,system-ui,sans-serif";
    CH=new Chart($('c1'),{type:'bar',data:{labels:a.sheets.map(s=>s.name),datasets:[['Conformity','c','#2C7A4B'],['Observation','o','#D69E2E'],['NC','x','#DA1B22']].map(d=>({label:d[0],data:a.sheets.map(s=>stats(s)[d[1]]),backgroundColor:d[2],stack:'s'})).concat([{label:'Not yet audited',data:a.sheets.map(s=>{const q=stats(s);return q.n-q.done}),backgroundColor:'#DDD8CF',stack:'s'}])},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},title:{display:true,text:'Audit results by department'}},scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true,ticks:{precision:0}}}}})}};
}

/* ---------- events ---------- */
function setPath(o,p,v){const k=p.split('.');let t=o;for(let i=0;i<k.length-1;i++)t=t[k[i]];t[k[k.length-1]]=v}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();return}
  const sh=e.target.closest('[data-sheet]');if(sh){sk=sh.dataset.sheet;render();return}
  const nr=e.target.closest('[data-ncr]');if(nr){nk=nr.dataset.ncr;render();return}
  const st=e.target.closest('[data-st]');if(st){const a=cur(),{r}=findRow(st.dataset.rid);if(!r)return;r.status=r.status===st.dataset.st?'':st.dataset.st;number(a,r);ensureNcr(a,findRow(r.id).s,r);save();render();return}
  const ac=e.target.closest('[data-act]');if(!ac)return;const a=cur(),act=ac.dataset.act;
  if(act==='addteam'){a.teams.push({no:a.teams.length+1,dept:'',leader:'',m1:'',m2:'',date:'',time:'',venue:''});save();render()}
  else if(act==='delteam'){a.teams.splice(+ac.dataset.i,1);save();render()}
  else if(act==='delrow'){const {s,r}=findRow(ac.dataset.rid);if(r&&confirm('Remove this check point?')){s.rows=s.rows.filter(x=>x!==r);save();render()}}
  else if(act==='addrow'){const s=a.sheets.find(x=>x.key===sk);s.rows.push({id:'r'+uid(),g:Math.max(0,...s.rows.map(r=>r.g))+1,section:(s.rows[s.rows.length-1]||{}).section||'',clause:'',point:'New audit check point',resp:'',evidence:'',status:'',remark:''});save();render()}
  else if(act==='wmm'){const x=findRow(ac.dataset.rid);const n=sendWmm(x.r?[x]:[]);if(n){render();toast((x.r.ncr?x.r.ncr.no:x.r.fno)+' sent to the Weekly Management Meeting as a new requirement')}}
  else if(act==='wmmall'){const n=sendWmm(ncFindings(a).filter(x=>!(x.r.fu||{}).wmm));if(n){render();toast(n+' non-conformit'+(n===1?'y':'ies')+' sent to the Weekly Management Meeting as new requirements')}}
  else if(act==='sign'){const {s:sh,r}=findRow(ac.dataset.rid),k=ac.dataset.k;if(!r||!r.ncr)return;const c=sigContent(k,a,sh,r),n=r.ncr;
    fitlSign({purpose:(k==='ack'?'Acknowledgement of non-conformity report':'Verification of non-conformity report'),ref:n.no,content:c,summary:n.no+' · '+sh.name+(r.clause?' · clause '+r.clause:'')+' · '+n.category+' — '+(n.statement||r.remark||r.point)}).then(res=>{
      if(res.ok){const g=res.sig;n[k+'Sig']={id:g.id,name:g.name,designation:g.designation,at:g.at,hash:g.hash,content:c};
        if(k==='ack'){n.ackBy=g.name;n.ackDate=dotDate(g.at)}else{n.verifiedBy=g.name;n.verifyDate=dotDate(g.at)}save();render();toast('Signed by '+g.name+' (Sig #'+g.id+')')}
      else if(res.reason!=='cancelled')toast('Signing is only possible when the system is opened from the company server.')})}
  else if(act==='signsheet'){const sh=a.sheets.find(x=>x.key===ac.dataset.sk),c=sheetContent(a,sh),q=stats(sh);
    fitlSign({purpose:'Audit check sheet signed by the auditor',ref:sh.docNo+' · '+a.title,content:c,summary:sh.name+' · '+q.done+' of '+q.n+' points audited · '+q.c+' conformity, '+q.o+' observation, '+q.x+' NC'}).then(res=>{
      if(res.ok){const g=res.sig;sh.auditSig={id:g.id,name:g.name,designation:g.designation,at:g.at,hash:g.hash,content:c};sh.auditor=g.name;sh.auditDate=dotDate(g.at);save();render();toast('Check sheet signed by '+g.name+' (Sig #'+g.id+')')}
      else if(res.reason!=='cancelled')toast('Signing is only possible when the system is opened from the company server.')})}
  else if(act==='openncr'){nk=ac.dataset.rid;tab='ncr';render();window.scrollTo(0,0)}
  else if(act==='ncrprint')ncrPrint(ac.dataset.rid);
  else if(act==='capa'){const {s,r}=findRow(ac.dataset.rid);if(!r)return;
    if(parent===window){toast('Raising in CAPA works inside the Ferentino management system.');return}
    parent.postMessage({type:'fitl-capa-requests',items:[{key:'audit:'+a.id+':'+r.fno,date:(s.auditDate||today()).replace(/\./g,'-'),text:'Internal audit non-conformity '+r.fno+' — '+s.name+(r.clause?', clause '+r.clause:'')+': '+r.point+(r.remark?'. '+r.remark:''),dept:s.name}]},'*');
    r.fu=r.fu||{};r.fu.capa=true;save();render();toast(r.fno+' sent to the CAPA platform as a new issue')}
});
document.addEventListener('change',e=>{const t=e.target,a=cur();
  if(t.id==='round'){D.cur=t.value;sk=null;save();render();return}
  if(t.dataset.act==='edit'){edit=t.checked;render();return}
  if(t.dataset.b){setPath(a,t.dataset.b,t.value);save();if(t.dataset.b==='title')render();return}
  if(t.dataset.team!=null){a.teams[+t.dataset.team][t.dataset.f]=t.value;save();return}
  if(t.dataset.mx!=null){const c=a.matrix.clauses[+t.dataset.mx],d=t.dataset.d;c.d=t.checked?Array.from(new Set(c.d.concat(d))):c.d.filter(x=>x!==d);save();render();return}
  if(t.dataset.r){const {s:sx,r}=findRow(t.dataset.r);if(r){r[t.dataset.f]=t.value;save();if(t.dataset.f==='clause'||sx.auditSig||(r.ncr&&(r.ncr.ackSig||r.ncr.verSig)))render()}return}
  if(t.dataset.u){const {r}=findRow(t.dataset.u);if(r){r.fu=r.fu||{};r.fu[t.dataset.f]=t.value;save();if(t.dataset.f==='state'||(r.ncr&&(r.ncr.ackSig||r.ncr.verSig)))render()}return}
  if(t.dataset.n){const {r}=findRow(t.dataset.n);if(r&&r.ncr){r.ncr[t.dataset.f]=t.value;save();if(t.dataset.f==='category'||r.ncr.ackSig||r.ncr.verSig)render()}return}
  if(t.dataset.sf){const s=a.sheets.find(x=>x.key===sk);s[t.dataset.sf]=t.value;save()}
});
