<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waste Disposal — FIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--bg:#F2F0EB;--card:#fff;--ink:#1D2127;--soft:#5E6772;--line:#DDD8CF;--line2:#ECE8E0;--red:#DA1B22;--red-d:#B3151B;--red-bg:#FBE9EA;--navy:#1F3A5F;--green:#2C7A4B;--green-bg:#E1F0E7;--amber:#B97708;--amber-bg:#FBF0D8;--head:'Barlow Condensed','Arial Narrow',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box}[hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Inter',system-ui,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}h1,h2,h3{font-family:var(--head);font-weight:600;margin:0}
  header{background:var(--card);border-bottom:3px solid var(--red);padding:12px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header img{height:38px;width:auto;border-radius:4px}h1{font-size:26px;text-transform:uppercase;line-height:1}.sub{color:var(--soft);font-size:12.5px;margin-top:3px}.grow{flex:1;min-width:240px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap}.btn:hover{border-color:#B9B2A6}.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.red:hover{background:var(--red-d)}.btn.sm{padding:3px 9px;font-size:12.5px}.btn.ghost{border-color:transparent;color:var(--soft)}.btn.ghost:hover{color:var(--red);background:var(--red-bg)}
  nav{background:var(--card);border-bottom:1px solid var(--line);padding:0 22px;display:flex;gap:2px;overflow-x:auto}
  .tab{background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-1px;padding:11px 16px 9px;cursor:pointer;white-space:nowrap;color:var(--soft);font-weight:600}.tab.on{color:var(--ink);border-bottom-color:var(--red)}
  main{padding:16px 22px 60px;max-width:1500px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px}.pn{padding:14px 16px;margin-bottom:14px}.pn h2{font-size:20px;text-transform:uppercase;margin-bottom:8px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 9px}input:focus,select:focus,textarea:focus{outline:2px solid #E8A0A3;border-color:var(--red)}textarea{width:100%;resize:vertical}
  label.f{display:block;font-size:12px;font-weight:600;color:var(--soft);margin-bottom:3px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}.t{padding:12px 14px;border-left:6px solid var(--line)}.t small{display:block;color:var(--soft);font-size:12px}.t b{font:600 30px/1.1 var(--head)}.t .n{font-size:12px;color:var(--soft)}.t.good{border-left-color:var(--green)}.t.bad{border-left-color:var(--red)}.t.mid{border-left-color:var(--amber)}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:14px;margin-bottom:14px}.cb{padding:12px 14px;height:320px;position:relative}.full{grid-column:1/-1}
  .tw{overflow:auto;border-radius:8px}table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}th{background:#F7F4EE;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);position:sticky;top:0;z-index:1;white-space:nowrap}
  td.r,th.r{text-align:right}td.c,th.c{text-align:center}tr.tot td{font-weight:700;background:#F7F4EE}
  .chip{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap;background:#ECE9E3;color:var(--soft)}.chip.ok{background:var(--green-bg);color:var(--green)}.chip.no{background:var(--red-bg);color:var(--red-d)}.chip.na{background:#ECE9E3;color:var(--soft)}.chip.warn{background:var(--amber-bg);color:#7A4F05}
  .types{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:14px}
  .types button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.types button:hover{border-color:#B9B2A6}.types button.on{border-color:var(--red);background:var(--red-bg)}
  .types b{display:block;font-size:13.5px}.types small{color:var(--soft);font-size:11.5px;font-family:var(--mono)}.types span{float:right;font:600 12px var(--mono);color:var(--soft)}
  .entry{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;padding:12px;background:#FBFAF7;border:1px dashed var(--line);border-radius:9px}.entry>div{min-width:110px}.entry input,.entry select{width:100%}
  .empty{padding:34px;text-align:center;color:var(--soft);line-height:1.7}
  .veil{position:fixed;inset:0;background:rgba(29,33,39,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px;z-index:50;overflow:auto}.modal{background:#fff;border-radius:12px;width:min(640px,100%);padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}.modal h2{font-size:24px;text-transform:uppercase;margin-bottom:12px}.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.mg .w2{grid-column:1/-1}.mg input,.mg select{width:100%}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  #toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:420px}#toast.show{opacity:1}
  .note{color:var(--soft);font-size:12.5px}details{margin-top:10px}summary{cursor:pointer;font-weight:600}
  .pv{width:100%;height:66vh;border:1px solid var(--line);border-radius:8px;background:#fff}.pvt{max-height:66vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:12px 16px;background:#fff}.pvt img{max-width:100%}
  .modal.wide{width:min(1000px,100%)}
  #printArea{display:none}
  .nf{width:100%;border-collapse:collapse;font-family:Calibri,Arial,sans-serif;margin-bottom:6px}.nf th,.nf td{border:1px solid #444;padding:4px 7px;font-size:11px;vertical-align:middle;text-align:left;height:21px}.nf th{background:#EDEDED;font-weight:700;text-align:center}
  .nf.head td{vertical-align:middle}.nf .lg{width:24%;text-align:center;font-size:9.5px;font-weight:600}.nf .lg img{height:34px;display:block;margin:0 auto 3px}.nf .sys{text-align:center;font-weight:700;letter-spacing:.06em}.nf .ttl{text-align:center;font-weight:700;font-size:15px}.nf .hd{background:#EDEDED;font-weight:700;width:12%}
  .pgbreak{page-break-after:always;break-after:page}
  @media print{body{background:#fff}body>*:not(#printArea){display:none!important}#printArea{display:block}}
</style>
</head>

function fitlFile(t,k){try{parent.postMessage({type:t,k:k},'*')}catch(_){}}
const FW={db:null,open(){return this.db||(this.db=new Promise((res,rej)=>{const q=indexedDB.open('fitl-library',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('files'))q.result.createObjectStore('files',{keyPath:'k'})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}))},
 async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('files',mode);let out;const r=fn(t.objectStore('files'));if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})},
 put(rec){return this.tx('readwrite',s=>s.put(rec)).then(r=>{fitlFile('fitl-file-saved',rec.k);return r})},get(k){return this.tx('readonly',s=>s.get(k)).then(r=>r||this.fromServer(k))},del(k){return this.tx('readwrite',s=>s.delete(k)).then(r=>{fitlFile('fitl-file-deleted',k);return r})},
 async fromServer(k){try{const r=await fetch('/api/files/'+encodeURIComponent(k),{credentials:'same-origin'});if(!r.ok)return null;const data=await r.arrayBuffer();let nm=k;try{nm=decodeURIComponent(r.headers.get('X-File-Name')||k)}catch(_){}const rec={k,docId:k.split('|')[0],name:nm,type:r.headers.get('Content-Type')||'',size:data.byteLength,at:new Date().toISOString(),data};await this.tx('readwrite',s=>s.put(rec));return rec}catch(_){return null}}};

function legalState(c,k){
  const ds=D.docs.filter(d=>d.col===c.id&&d.type===k&&d.file).sort((a,b)=>String(b.valid||'9999').localeCompare(String(a.valid||'9999')));

}

const closeW=()=>{$('host').innerHTML=''};
function colForm(c){
  const o=['','ok','-'],lab={'':'Not on file','ok':'ok — on file','-':'- — not required'};
  const sel=(id,v)=>'<select id="'+id+'">'+o.map(x=>'<option value="'+x+'"'+(x===v?' selected':'')+'>'+lab[x]+'</option>').join('')+'</select>';
  openModal('<h2>'+(c?'Edit collector':'Add a collector')+'</h2><div class="mg"><div class="w2"><label class="f">Name of the waste collector</label><input type="text" id="k_name" value="'+esc(c?c.name:'')+'"></div><div class="w2"><label class="f">Waste category</label><input type="text" id="k_cat" value="'+esc(c?c.cat:'')+'" placeholder="e.g. Metal Scrap"></div><div><label class="f">Contact details</label><input type="text" id="k_con" value="'+esc(c?c.contact:'')+'" placeholder="name and phone"></div><div><label class="f">Registration number / BR number</label><input type="text" id="k_br" value="'+esc(c?c.br:'')+'"></div>'+
   '<div><label class="f">EPL</label>'+sel('k_epl',c?c.epl:'')+'</div><div><label class="f">Scheduled Waste Management License</label>'+sel('k_swm',c?c.swm:'')+'</div><div><label class="f">Trade License</label>'+sel('k_trade',c?c.trade:'')+'</div></div><div class="foot"><button class="btn" data-act="closew">Cancel</button><button class="btn red" data-act="savecol" data-id="'+(c?c.id:'')+'">Save</button></div>');
}
function recForm(t,r){
  const s=SCH[t];let h='<h2>Edit entry — '+esc(s.label)+'</h2><div class="mg"><div><label class="f">Date</label><input type="date" id="x_date" value="'+esc(r.date)+'"></div><div><label class="f">Waste collector</label><select id="x_col">'+colOpts(r.col)+'</select></div><div><label class="f">Gate pass number</label><input type="text" id="x_gp" value="'+esc(r.gp)+'"></div>';
  if(s.amount)h+='<div><label class="f">Amount</label><input type="number" id="x_amt" step="any" value="'+esc(r.amt==null?'':r.amt)+'"></div><div><label class="f">Unit</label><select id="x_unit">'+UNITS.map(u=>'<option'+(u===(r.unit||s.unit)?' selected':'')+'>'+u+'</option>').join('')+'</select></div>';
  s.qty.forEach(q=>{h+='<div><label class="f">'+esc(q[1])+' (kg)</label><input type="number" id="x_q_'+q[0]+'" step="any" value="'+esc((r.q||{})[q[0]]==null?'':r.q[q[0]])+'"></div>'});
  if(s.rem)h+='<div class="w2"><label class="f">Remarks</label><input type="text" id="x_rem" value="'+esc(r.rem)+'"></div>';
  openModal(h+'</div><div class="foot"><button class="btn" data-act="closew">Cancel</button><button class="btn red" data-act="saverec" data-id="'+r.id+'">Save</button></div>');
}
const findRec=id=>{for(const t of TYPES){const r=D.recs[t].find(x=>x.id===id);if(r)return{t,r}}return{}};

/* ---------- viewing a collector's document ---------- */
const getFile=d=>FW.get('waste:'+d.id).then(r=>{if(!r)toast('That file is not stored in this browser. Attach it again, or restore a system backup that includes the library files.');return r}).catch(()=>{toast('The file could not be read');return null});
let URLS=[];
function viewDoc(d){
  openModal('<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-bottom:10px"><div style="flex:1;min-width:240px"><h2 style="margin:0">'+esc(dtLabel(d.type))+'</h2><div class="note">'+esc(colName(d.col))+(d.no?' · No '+esc(d.no):'')+(d.valid?' · valid until '+dot(d.valid):'')+'</div></div><button class="btn red" data-act="dldoc" data-id="'+d.id+'">Download</button><button class="btn" data-act="closeview">Close</button></div><div id="pvbox"><div class="empty">Opening…</div></div>');
  document.querySelector('#host .modal').classList.add('wide');
  getFile(d).then(r=>{const box=$('pvbox');if(!r||!box){if(box)box.innerHTML='<div class="empty">The file is not stored in this browser.</div>';return}
    const e=((r.name||'').toLowerCase().match(/\.([a-z0-9]+)$/)||[])[1]||'';
    if(e==='pdf'||r.type==='application/pdf'){const u=URL.createObjectURL(new Blob([r.data],{type:'application/pdf'}));URLS.push(u);box.innerHTML='<iframe class="pv" src="'+u+'" title="Document"></iframe><div class="note" style="margin-top:6px">If the page above stays empty in your browser, use Download.</div>'}
    else if(['png','jpg','jpeg','gif','webp','bmp','svg'].includes(e)){const u=URL.createObjectURL(new Blob([r.data],{type:r.type||'image/'+e}));URLS.push(u);box.innerHTML='<div class="pvt"><img src="'+u+'" alt=""></div>'}
    else if(['txt','csv','log'].includes(e))box.innerHTML='<div class="pvt"><pre style="white-space:pre-wrap;margin:0;font:12.5px var(--mono)">'+esc(new TextDecoder().decode(r.data))+'</pre></div>';
    else box.innerHTML='<div class="empty">This kind of file ('+esc(e||'unknown')+') cannot be shown in the browser.<br>Use <b>Download</b> to open it on your computer.</div>'});
}
/* ---------- actions ---------- */
let PRE=null;
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){TAB=tb.dataset.tab;render();return}
  const rt=e.target.closest('[data-rt]');if(rt){RT=rt.dataset.rt;render();return}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,id=a.dataset.id;
  if(act==='closew')closeW();
  else if(act==='closeview'){URLS.splice(0).forEach(u=>URL.revokeObjectURL(u));closeW()}
  else if(act==='addrec'){
    const s=SCH[RT],date=$('e_date').value,col=$('e_col').value,gp=$('e_gp').value.trim();
    if(!date||!col){toast('Choose the date and the waste collector');return}
    const r={id:'r'+uid(),no:nextNo(RT),date,col,gp};
    if(s.amount){r.amt=num($('e_amt').value);r.unit=$('e_unit').value;if(!(r.amt>0)){toast('Enter the amount');return}}
    if(s.qty.length){r.q={};let any=false;s.qty.forEach(q=>{const v=num($('e_q_'+q[0]).value);if(v>0){r.q[q[0]]=v;any=true}});if(!any){toast('Enter at least one weight');return}}
    if(s.rem)r.rem=$('e_rem').value.trim();
    D.recs[RT].push(r);save();F.ry=+date.slice(0,4);render();toast('Entry '+r.no+' added to '+DOCS[RT].no);
  }
  else if(act==='editrec'){const x=findRec(id);if(x.r)recForm(x.t,x.r)}
  else if(act==='saverec'){const x=findRec(id),s=SCH[x.t];x.r.date=$('x_date').value||x.r.date;x.r.col=$('x_col').value;x.r.gp=$('x_gp').value.trim();
    if(s.amount){x.r.amt=num($('x_amt').value);x.r.unit=$('x_unit').value}
    if(s.qty.length){x.r.q={};s.qty.forEach(q=>{const v=num($('x_q_'+q[0]).value);if(v>0)x.r.q[q[0]]=v})}
    if(s.rem)x.r.rem=$('x_rem').value.trim();save();closeW();render();toast('Saved')}
  else if(act==='delrec'){const x=findRec(id);if(x.r&&confirm('Delete entry '+x.r.no+' of '+DOCS[x.t].no+'?')){D.recs[x.t]=D.recs[x.t].filter(r=>r!==x.r);save();render()}}
  else if(act==='score'){const x=findRec(a.dataset.id?a.dataset.id:'');const rr=findRec(id).r;if(!rr)return;if(!String(rr.gp||'').trim()){toast('This collection has no gate pass number');return}PRE={date:rr.date,gp:rr.gp};TAB='mon';MC=rr.col;render()}
  else if(act==='addmon'){const m={id:'m'+uid(),col:MC,date:$('m_date').value,gp:$('m_gp').value.trim()};if(!m.date){toast('Choose the date');return}
    for(const k of CRIT){const v=$('m_'+k[0]).value;if(v===''){toast('Choose the marks for '+k[1]);return}m[k[0]]=+v}
    D.mon.push(m);save();render();toast('Monitoring line added — '+f1(pct(m))+' %')}
  else if(act==='delmon'){if(confirm('Delete this monitoring line?')){D.mon=D.mon.filter(r=>r.id!==id);save();render()}}
  else if(act==='addcol')colForm(null);
  else if(act==='editcol')colForm(D.collectors.find(c=>c.id===id));
  else if(act==='savecol'){const name=$('k_name').value.trim();if(!name){toast('Enter the name of the collector');return}
    let c=id?D.collectors.find(x=>x.id===id):{id:'c'+uid()};Object.assign(c,{name,cat:$('k_cat').value.trim(),contact:$('k_con').value.trim(),br:$('k_br').value.trim(),epl:$('k_epl').value,swm:$('k_swm').value,trade:$('k_trade').value});
    if(!id)D.collectors.push(c);save();closeW();render();toast('Collector saved')}
  else if(act==='delcol'){const c=D.collectors.find(x=>x.id===id),n=TYPES.reduce((s,t)=>s+D.recs[t].filter(r=>r.col===id).length,0)+D.mon.filter(r=>r.col===id).length;
    if(confirm('Remove '+c.name+' from the approved list?'+(n?'\n\n'+n+' record lines mention this collector; they stay in the records.':''))){D.collectors=D.collectors.filter(x=>x!==c);save();render()}}
  else if(act==='opendocs'){DC=id;TAB='docs';render()}
  else if(act==='adddoc'){
    const col=$('d_col').value,f=$('d_file').files[0];if(!col){toast('Choose the waste collector');return}if(!f){toast('Attach the file of the document');return}
    if(f.size>25*1048576&&!confirm('This file is '+(f.size/1048576).toFixed(0)+' MB. Large files fill the browser storage quickly. Attach it anyway?'))return;
    const d={id:'d'+uid(),col,type:$('d_type').value,no:$('d_no').value.trim(),issued:$('d_iss').value,valid:$('d_val').value,note:$('d_note').value.trim()};
    f.arrayBuffer().then(buf=>FW.put({k:'waste:'+d.id,docId:d.id,name:f.name,type:f.type||'',size:f.size,at:new Date().toISOString(),data:buf})).then(()=>{d.file={k:'waste:'+d.id,name:f.name,type:f.type||'',size:f.size};D.docs.push(d);if(DC&&DC!==col)DC=col;save();render();toast('Document added for '+colName(col))}).catch(x=>toast('The file could not be stored: '+x));}
  else if(act==='editdoc'){const d=D.docs.find(x=>x.id===id);openModal('<h2>Edit document</h2><div class="mg"><div><label class="f">Document</label><select id="y_type">'+DTYPES.map(t=>'<option value="'+t[0]+'"'+(t[0]===d.type?' selected':'')+'>'+t[1]+'</option>').join('')+'</select></div><div><label class="f">Document number</label><input type="text" id="y_no" value="'+esc(d.no)+'"></div><div><label class="f">Issued</label><input type="date" id="y_iss" value="'+esc(d.issued)+'"></div><div><label class="f">Valid until</label><input type="date" id="y_val" value="'+esc(d.valid)+'"></div><div class="w2"><label class="f">Note</label><input type="text" id="y_note" value="'+esc(d.note)+'"></div><div class="w2"><label class="f">Replace the file (optional)</label><input type="file" id="y_file"></div></div><div class="foot"><button class="btn" data-act="closew">Cancel</button><button class="btn red" data-act="savedoc" data-id="'+id+'">Save</button></div>')}
  else if(act==='savedoc'){const d=D.docs.find(x=>x.id===id),f=$('y_file').files[0];Object.assign(d,{type:$('y_type').value,no:$('y_no').value.trim(),issued:$('y_iss').value,valid:$('y_val').value,note:$('y_note').value.trim()});
    const done=()=>{save();closeW();render();toast('Saved')};
    if(f)f.arrayBuffer().then(buf=>FW.put({k:'waste:'+d.id,docId:d.id,name:f.name,type:f.type||'',size:f.size,at:new Date().toISOString(),data:buf})).then(()=>{d.file={k:'waste:'+d.id,name:f.name,type:f.type||'',size:f.size};done()}).catch(x=>toast('The file could not be stored: '+x));else done()}
  else if(act==='deldoc'){const d=D.docs.find(x=>x.id===id);if(d&&confirm('Delete this document of '+colName(d.col)+' ('+dtLabel(d.type)+')? The file is removed as well.')){FW.del('waste:'+id).catch(()=>{});D.docs=D.docs.filter(x=>x!==d);save();render()}}
  else if(act==='dldoc'){const d=D.docs.find(x=>x.id===id);getFile(d).then(r=>{if(!r)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.data],{type:r.type||'application/octet-stream'}));a.download=(colName(d.col)+'_'+dtLabel(d.type).split(' ')[0]+(d.no?'_'+d.no:'')).replace(/[^\w.-]+/g,'_')+(/\.[A-Za-z0-9]{1,6}$/.exec(r.name)||[''])[0];document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},900)})}
  else if(act==='viewdoc'){const d=D.docs.find(x=>x.id===id);viewDoc(d)}
  else if(act==='printcol')printForm('col');else if(act==='printmon')printForm('mon');else if(act==='printev')printForm('ev');else if(act==='printrec')printForm(RT);
  else if(act==='xlrec')xl(RT);
});
document.addEventListener('change',e=>{const t=e.target,i=t.id;
  if(i==='dy'){F.year=+t.value;render()}else if(i==='dm'){F.month=+t.value;render()}
  else if(i==='ry'){F.ry=+t.value;render()}else if(i==='rm'){F.rm=+t.value;render()}
  else if(i==='mc'){MC=t.value;render()}else if(i==='dc_f'){DC=t.value;render()}else if(i==='ey'){F.evy=+t.value;render()}
  else if(i==='etg'||i==='dtg'){const v=parseFloat(t.value);D.target=isFinite(v)&&v>=0?v:null;save();render()}
  else if(t.dataset.why){const y=F.evy;D.ev[y]=D.ev[y]||{};D.ev[y][t.dataset.why]={why:t.value.trim()};save()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeW()});

/* ---------- printing, laid out like the Word forms ---------- */
const hdrHTML=(k,pg,n)=>{const d=DOCS[k];return'<table class="nf head"><tr><td rowspan="4" class="lg"><img src="'+LOGO+'" alt="">FERENTINO INDUSTRIAL TYRES (PVT) LTD<br>SRI LANKA</td><td class="sys">ENVIRONMENTAL MANAGEMENT SYSTEM</td><td class="hd">Doc No</td><td colspan="3"><b>'+d.no+'</b></td></tr><tr><td class="ttl" rowspan="3">'+d.title+'</td><td class="hd">Issue No</td><td>02</td><td class="hd">Revision No</td><td>00</td></tr><tr><td class="hd">Issue Date</td><td>2026.04.20</td><td class="hd">Revision Date</td><td></td></tr><tr><td class="hd">Page No</td><td colspan="3">Page '+pg+' of '+n+'</td></tr></table>'};
function chunks(rows,per,min){const out=[];for(let i=0;i<Math.max(rows.length,1);i+=per)out.push(rows.slice(i,i+per));return out}
const blankRows=(n,cols)=>Array.from({length:n},()=>'<tr>'+'<td></td>'.repeat(cols)+'</tr>').join('');
const lg=(c,k)=>{const x=legalState(c,k);return x.s==='doc'?'ok':x.s==='expired'?'expired':(x.s||'')};
function printForm(k){
  const per=k==='ev'?30:12,pages=[];let cols=0,headRow='',data=[],pre='',post='';
  if(k==='col'){headRow='<tr><th rowspan="2">ID</th><th rowspan="2">Waste category</th><th rowspan="2">Name of Waste Collector</th><th rowspan="2">Contact Details</th><th colspan="3">Legal Requirement</th></tr><tr><th>EPL</th><th>Schedule Waste Management License</th><th>Trade License</th></tr>';cols=7;data=D.collectors.map((c,i)=>'<tr><td>'+pad(i+1)+'</td><td>'+esc(c.cat)+'</td><td>'+esc(c.name)+'</td><td>'+esc(c.contact)+'</td><td>'+lg(c,'epl')+'</td><td>'+lg(c,'swm')+'</td><td>'+lg(c,'trade')+'</td></tr>')}
  else if(k==='mon'){const c=D.collectors.find(x=>x.id===MC);if(!c){toast('Choose a collector');return}pre='<table class="nf"><tr><td class="hd">Name of the Waste Collector</td><td>'+esc(c.name)+'</td><td class="hd">Registration Number / BR Number</td><td>'+esc(c.br)+'</td><td class="hd">Waste Category</td><td>'+esc(c.cat)+'</td></tr></table>';
    headRow='<tr><th>Date</th><th>Gate pass Number</th><th>Response Time</th><th>Station Up Time</th><th>Price</th><th>Severity</th><th>%</th></tr>';cols=7;
    data=D.mon.filter(r=>r.col===MC).sort((a,b)=>String(a.date).localeCompare(b.date)).map(r=>'<tr><td>'+dot(r.date)+'</td><td>'+esc(r.gp)+'</td>'+CRIT.map(q=>'<td>'+pad(r[q[0]])+'</td>').join('')+'<td>'+f1(pct(r))+'</td></tr>');
    post='<table class="nf"><tr><th colspan="8">WASTE COLLECTOR PERFORMANCE MONITORING CRITERIA</th></tr><tr>'+CRIT.map(q=>'<td colspan="2" style="vertical-align:top"><b>'+q[1]+'</b><br>'+q[2].map(o=>o[0]+' — '+pad(o[1])+' marks').join('<br>')+'</td>').join('')+'</tr></table>'}
  else if(k==='ev'){const y=F.evy,ev=D.ev[y]||{};headRow='<tr><th>No</th><th>Waste Collector Name</th><th>Achievement</th><th>Reasons for Deviation</th></tr>';cols=4;
    data=D.collectors.map((c,i)=>{const rs=D.mon.filter(r=>r.col===c.id&&inP(r.date,y,0)&&pct(r)!=null),a=rs.length?rs.reduce((s,r)=>s+pct(r),0)/rs.length:null;return'<tr><td>'+pad(i+1)+'</td><td>'+esc(c.name)+'</td><td>'+(a==null?'':f1(a)+' %')+'</td><td>'+esc((ev[c.id]||{}).why||'')+'</td></tr>'});pre='<p style="font:12px Calibri,Arial;margin:0 0 6px">Evaluation year: <b>'+y+'</b></p>'}
  else{const s=SCH[k],rows=D.recs[k].filter(r=>inP(r.date,F.ry,F.rm)).sort((a,b)=>a.no-b.no),base='<th'+(s.qty.length?' rowspan="2"':'')+'>';
    headRow='<tr>'+base+'No</th>'+base+'Date</th>'+base+'Waste Collector Name</th>'+base+'Gate Pass Number</th>'+(s.qty.length?'<th colspan="'+s.qty.length+'">Waste Amount (Kg)</th>':'')+(s.amount?base+'Amount</th>':'')+(s.rem?base+'Remarks</th>':'')+'</tr>'+(s.qty.length?'<tr>'+s.qty.map(q=>'<th>'+esc(q[1])+'</th>').join('')+'</tr>':'');
    cols=4+s.qty.length+(s.amount?1:0)+(s.rem?1:0);
    data=rows.map(r=>'<tr><td>'+r.no+'</td><td>'+dot(r.date)+'</td><td>'+esc(colName(r.col))+'</td><td>'+esc(r.gp)+'</td>'+s.qty.map(q=>'<td>'+((r.q||{})[q[0]]?f1(num(r.q[q[0]])):'')+'</td>').join('')+(s.amount?'<td>'+f1(num(r.amt))+' '+esc(r.unit||s.unit)+'</td>':'')+(s.rem?'<td>'+esc(r.rem)+'</td>':'')+'</tr>')}
  const ch=chunks(data,per);let h='';
  ch.forEach((rs,i)=>{h+='<div class="'+(i<ch.length-1?'pgbreak':'')+'">'+hdrHTML(k,i+1,ch.length)+(i===0?pre:'')+'<table class="nf"><thead>'+headRow+'</thead><tbody>'+rs.join('')+blankRows(Math.max(0,per-rs.length),cols)+'</tbody></table>'+(i===ch.length-1?post:'')+'</div>'});
  $('printArea').innerHTML=h;$('pgstyle').textContent='@page{size:A4 '+(DOCS[k].land?'landscape':'portrait')+';margin:10mm}';setTimeout(()=>window.print(),80);
}

/* ---------- Excel ---------- */
function sheetFor(k){
  if(k==='col')return{n:'RG-HR-01 Collectors',a:[['ID','Waste category','Name of Waste Collector','Contact Details','Registration / BR no','EPL','Schedule Waste Management License','Trade License']].concat(D.collectors.map((c,i)=>[pad(i+1),c.cat,c.name,c.contact,c.br,lg(c,'epl'),lg(c,'swm'),lg(c,'trade')]))};
  if(k==='mon')return{n:'RG-HR-02 Monitoring',a:[['Waste collector','Date','Gate pass Number','Response Time','Station Up Time','Price','Severity','%']].concat(D.mon.slice().sort((a,b)=>colName(a.col).localeCompare(colName(b.col))||String(a.date).localeCompare(b.date)).map(r=>[colName(r.col),r.date,r.gp,r.rt,r.up,r.pr,r.sv,pct(r)==null?'':Math.round(pct(r)*10)/10]))};
  if(k==='ev'){const y=F.evy,ev=D.ev[y]||{};return{n:'RG-HR-03 Evaluation '+y,a:[['No','Waste Collector Name','Achievement %','Scored collections','Reasons for Deviation']].concat(D.collectors.map((c,i)=>{const rs=D.mon.filter(r=>r.col===c.id&&inP(r.date,y,0)&&pct(r)!=null);return[pad(i+1),c.name,rs.length?Math.round(rs.reduce((s,r)=>s+pct(r),0)/rs.length*10)/10:'',rs.length,(ev[c.id]||{}).why||'']}))}}
  const s=SCH[k];return{n:DOCS[k].no.replace('FIT/E/','')+' '+s.label.slice(0,14),a:[['No','Date','Waste Collector Name','Gate Pass Number'].concat(s.qty.map(q=>q[1]+' (kg)')).concat(s.amount?['Amount','Unit']:[]).concat(s.rem?['Remarks']:[])].concat(D.recs[k].slice().sort((a,b)=>a.no-b.no).map(r=>[r.no,r.date,colName(r.col),r.gp].concat(s.qty.map(q=>(r.q||{})[q[0]]||'')).concat(s.amount?[r.amt,r.unit||s.unit]:[]).concat(s.rem?[r.rem||'']:[])))};
}
function xl(only){
  if(typeof XLSX==='undefined'){toast('The Excel library did not load — check the internet connection.');return}
  const wb=XLSX.utils.book_new();(only?[only]:['col','mon','ev'].concat(TYPES)).forEach(k=>{const s=sheetFor(k),w=XLSX.utils.aoa_to_sheet(s.a);w['!cols']=s.a[0].map(()=>({wch:22}));XLSX.utils.book_append_sheet(wb,w,s.n.slice(0,31))});
  if(!only){const a=[['Waste collector','Document','Number','Issued','Valid until','File','Note']].concat(D.docs.map(d=>[colName(d.col),dtLabel(d.type),d.no,d.issued,d.valid,d.file?d.file.name:'',d.note]));const w=XLSX.utils.aoa_to_sheet(a);w['!cols']=a[0].map(()=>({wch:24}));XLSX.utils.book_append_sheet(wb,w,'Collector documents')}
  XLSX.writeFile(wb,only?'Waste_'+DOCS[only].no.replace(/[^\w]+/g,'_')+'.xlsx':'Waste_disposal_records.xlsx');
}
$('xl').onclick=()=>xl();
render();
if(PRE){}
})();
