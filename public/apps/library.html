<head>

<title>Document Library — FIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{--bg:#F2F0EB;--card:#fff;--ink:#1D2127;--soft:#5E6772;--line:#DDD8CF;--line2:#ECE8E0;--red:#DA1B22;--red-d:#B3151B;--red-bg:#FBE9EA;--navy:#1F3A5F;--green:#2C7A4B;--green-bg:#E1F0E7;--amber:#B97708;--amber-bg:#FBF0D8;--head:'Barlow Condensed','Arial Narrow',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box}[hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 'Inter',system-ui,sans-serif}
  button,input,select{font:inherit;color:inherit}h1,h2,h3{font-family:var(--head);font-weight:600;margin:0}
  header{background:var(--card);border-bottom:3px solid var(--red);padding:12px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header img{height:38px;width:auto;border-radius:4px}h1{font-size:26px;text-transform:uppercase;line-height:1}.sub{color:var(--soft);font-size:12.5px;margin-top:3px}.grow{flex:1;min-width:240px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}.btn:hover{border-color:#B9B2A6}.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.red:hover{background:var(--red-d)}.btn.sm{padding:3px 10px;font-size:12.5px}.btn:disabled{opacity:.45;cursor:default}
  .lay{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;padding:16px 22px 40px;max-width:1500px;margin:0 auto;align-items:start}@media(max-width:900px){.lay{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px}
  .tree{padding:8px;position:sticky;top:8px;max-height:calc(100vh - 100px);overflow:auto}
  .tree button{display:flex;width:100%;align-items:center;gap:8px;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink)}
  .tree button:hover{background:#F7F4EE}.tree button.on{background:var(--red-bg);border-color:#F1B9BC;font-weight:600}
  .tree .ic{width:18px;text-align:center}.tree .n{margin-left:auto;font:600 11.5px var(--mono);color:var(--soft);background:#F0EDE6;border-radius:9px;padding:1px 8px}.tree button.on .n{background:#fff}
  .tree .subs{margin-left:16px;border-left:2px solid var(--line2);padding-left:6px}.tree .subs button{padding:5px 8px;font-size:13px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar input[type=text],.bar select{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 10px}
  .crumb{font:600 22px var(--head);text-transform:uppercase;margin-bottom:10px}.crumb span{color:var(--soft)}
  .tw{overflow:auto;border-radius:10px}table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:9px 11px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}th{background:#F7F4EE;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);position:sticky;top:0}
  td.no{font:500 12.5px var(--mono);white-space:nowrap}
  .chip{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap;background:#ECE9E3;color:var(--soft)}.chip.ino{background:#E3ECF6;color:#2B5A8C}.chip.con{background:var(--red-bg);color:var(--red-d)}.chip.iex{background:var(--green-bg);color:var(--green)}.chip.warn{background:var(--amber-bg);color:#7A4F05}
  .empty{padding:44px 20px;text-align:center;color:var(--soft);line-height:1.7}
  .veil{position:fixed;inset:0;background:rgba(29,33,39,.55);display:flex;align-items:flex-start;justify-content:center;padding:16px;z-index:50;overflow:auto}
  .modal{background:#fff;border-radius:12px;width:min(1100px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);margin:auto}.mh{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
  .mh h2{font-size:24px;text-transform:uppercase}.mb{padding:14px 20px 20px}
  .pv{width:100%;height:68vh;border:1px solid var(--line);border-radius:8px;background:#fff}.pvt{max-height:68vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:14px 18px;background:#fff}
  .pvt table{font-size:12.5px}.pvt td,.pvt th{border:1px solid var(--line2);padding:4px 8px}.pvt img{max-width:100%}
  .tabs2{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}.tabs2 button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 10px;cursor:pointer;font-size:12.5px}.tabs2 button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  details{margin-top:12px}summary{cursor:pointer;font-weight:600}
  .note{color:var(--soft);font-size:12.5px}
</style>
</head>

/* the same document types, departments and file naming as the Document Control System */
const T={QP:['Quality Policy','D',1,'Q','POL'],EP:['Environmental Policy','D',1,'E','POL'],QM:['Quality Manual','D',1,'Q','MNL'],EM:['Environmental Manual','D',1,'E','MNL'],PM:['Procedure Manual','D',1,'QE','MNL'],
QSP:['System Procedure (QMS)','D',0,'Q','SOP'],PRO:['System Procedure (EMS)','D',0,'E','SOP'],WI:['Work Instruction','D',0,'QEG','WI'],GL:['Guideline','D',0,'QEG','GDL'],SP:['Specification','D',0,'QEG','SPC'],TM:['Test Method','D',0,'QEG','TST'],CH:['Chart','D',0,'QEG','CHT'],GN:['General Document','D',0,'QEG','DOC'],
FO:['Format / Form','R',0,'QEG','FRM'],RG:['Register','R',0,'QEG','REG'],CL:['Check List','R',0,'QEG','CHK'],PL:['Plan','R',0,'QEG','PLN']};
const D=[['HR','HR Department','HRM'],['MNT','Maintenance','MNT'],['PRD','Production','PRD'],['MIX','Production – Mixing','MIX'],['TBS','Production – Tyre Building','PRD'],['PLN','Production – Planning','PRD'],['QA','Quality Department','QUA'],['MSY','Quality – Management System','QUA'],['PCS','Quality – Process','QUA'],['FIN','Finance','FIN'],['ACC','Finance – Accounts','FIN'],['STR','Finance – Stores','RMW'],['PUR','Finance – Purchasing','PRC'],['TEC','Technical','TEC'],['EXP','Export','SAL'],['GEN','Company-wide / General','QUA']];
const fdef=d=>T[d.type][2]?'QUA':(D.find(x=>x[0]==d.dept)||[0,0,'QUA'])[2];
const fname=d=>{const ti=d.title.replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join('').slice(0,80);const n=d.hist.filter(h=>h.date==d.revDate&&!h.corr).length;return T[d.type][4]+'_'+ti+'_'+(d.fdept||fdef(d))+'_FIT_'+d.cls+'_'+(d.draft?'DRAFT':dmy(d.revDate)+(n>1?'_r'+pad(n-1):''))};
const LIBF={manuals:'Manuals',policy:'Policy',sop:'SOP',wi:'Work Instructions',guideline:'Guide Line',sectional:'Sectional Documents',general:'General',recordroom:'Record Room'};
const ICON={all:'📚',manuals:'📘',policy:'📜',sop:'📋',wi:'🛠️',guideline:'📖',sectional:'🏭',general:'📁',recordroom:'🗄️'};
const libDef=(type,dept)=>({QP:'policy',EP:'policy',QM:'manuals',EM:'manuals',PM:'manuals',QSP:'sop',PRO:'sop',WI:'wi',GL:'guideline'}[type])||((dept&&dept!=='GEN')?'sectional':'general');
const libOf=d=>{const f=d.libFolder||libDef(d.type,d.dept);return{f,dept:f==='sectional'?(d.libDept||d.dept||''):''}};
const deptName=c=>(D.find(x=>x[0]==c)||[0,c||'—'])[1];
const libCur=d=>(d.files||[]).slice().sort((a,b)=>(a.iss+a.rev+a.at).localeCompare(b.iss+b.rev+b.at)).pop();
const ext=n=>{const m=/\.[A-Za-z0-9]{1,6}$/.exec(n||'');return m?m[0]:''};
const FLIB={db:null,open(){return this.db||(this.db=new Promise((res,rej)=>{const q=indexedDB.open('fitl-library',1);q.onupgradeneeded=()=>q.result.createObjectStore('files',{keyPath:'k'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}))},
  async get(k){const r0=await this.getLocal(k);return r0||this.fromServer(k)},async getLocal(k){const db=await this.open();return new Promise((res,rej)=>{const r=db.transaction('files','readonly').objectStore('files').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async fromServer(k){try{const r=await fetch('/api/files/'+encodeURIComponent(k),{credentials:'same-origin'});if(!r.ok)return null;const data=await r.arrayBuffer();let nm=k;try{nm=decodeURIComponent(r.headers.get('X-File-Name')||k)}catch(_){}const rec={k,docId:k.split('|')[0],name:nm,type:r.headers.get('Content-Type')||'',size:data.byteLength,at:new Date().toISOString(),data};const db=await this.open();await new Promise((res,rej)=>{const t=db.transaction('files','readwrite');t.objectStore('files').put(rec);t.oncomplete=res;t.onerror=()=>rej(t.error)});return rec}catch(_){return null}}};

/* documents are added through the Document Control System, which saves them on the server (not
   just in that app's own browser) — this page polls the same small document instead of reading a
   localStorage key, so it works regardless of which browser or device the document was added from. */
let S={docs:[]},rawVer=-1,V={f:'all',dept:'',q:'',type:'',all:false},urls=[];
function load(){
  return fetch('/api/doccontrol/meta',{credentials:'same-origin',headers:{'X-FIT-Request':'1'}}).then(r=>r.json()).then(j=>{
    if(j.version===rawVer)return;
    rawVer=j.version;
    S=(j.data&&typeof j.data==='object'&&Array.isArray(j.data.docs))?j.data:{docs:[]};
    if(!$('#host').firstChild)render();
  }).catch(()=>{});
}
setInterval(load,5000);addEventListener('focus',load);

/* which documents are shown: current, approved and with a file — or everything registered, when asked */
const shown=d=>d.status==='A'&&(V.all||(libCur(d)&&!d.draft));
function inFolder(d,f,dept){const o=libOf(d);return f==='all'||(o.f===f&&(f!=='sectional'||!dept||o.dept===dept))}
function render(){
  const all=S.docs.filter(shown),cnt=(f,dept)=>all.filter(d=>inFolder(d,f,dept)).length;
  let t='<button data-f="all" data-d="" class="'+(V.f==='all'?'on':'')+'"><span class="ic">'+ICON.all+'</span>All documents<span class="n">'+cnt('all')+'</span></button>';
  Object.keys(LIBF).forEach(f=>{
    t+='<button data-f="'+f+'" data-d="" class="'+(V.f===f&&!V.dept?'on':'')+'"><span class="ic">'+ICON[f]+'</span>'+LIBF[f]+'<span class="n">'+cnt(f)+'</span></button>';
    if(f==='sectional'&&(V.f==='sectional')) t+='<div class="subs">'+D.filter(x=>x[0]!=='GEN').map(x=>'<button data-f="sectional" data-d="'+x[0]+'" class="'+(V.f==='sectional'&&V.dept===x[0]?'on':'')+'">'+esc(x[1])+'<span class="n">'+cnt('sectional',x[0])+'</span></button>').join('')+'</div>';
  });
  t+='<label style="display:flex;gap:8px;align-items:flex-start;padding:12px 10px 4px;font-size:12.5px;color:var(--soft);cursor:pointer"><input type="checkbox" id="all"'+(V.all?' checked':'')+' style="margin-top:2px"> Also show documents that are still drafts or have no file yet</label>';
  $('#tree').innerHTML=t;
  let rows=all.filter(d=>inFolder(d,V.f,V.dept));const q=V.q.trim().toLowerCase();
  if(q)rows=rows.filter(d=>(d.no+' '+d.title+' '+T[d.type][0]).toLowerCase().includes(q));
  if(V.type)rows=rows.filter(d=>d.type===V.type);
  rows.sort((a,b)=>'QEG'.indexOf(a.sys)-'QEG'.indexOf(b.sys)||a.no.localeCompare(b.no,undefined,{numeric:true})||String(a.period||'').localeCompare(String(b.period||'')));
  const types=[...new Set(all.filter(d=>inFolder(d,V.f,V.dept)).map(d=>d.type))];
  const title=V.f==='all'?'All documents':LIBF[V.f]+(V.dept?'<span> › '+esc(deptName(V.dept))+'</span>':'');
  let h='<div class="crumb">'+title+'</div><div class="bar"><input type="text" id="q" placeholder="Search number or title" value="'+esc(V.q)+'" style="min-width:260px"><select id="ty"><option value="">All types</option>'+types.map(c=>'<option value="'+c+'"'+(V.type===c?' selected':'')+'>'+esc(T[c][0])+'</option>').join('')+'</select><span class="note">'+rows.length+' document'+(rows.length===1?'':'s')+'</span></div>';
  if(!rows.length){
    h+='<div class="card empty">'+(S.docs.some(d=>d.status==='A')?'<b>Nothing here yet.</b><br>Documents appear in the Library when a file is attached to them in the <b>Document Control System</b> (General › Document Control System › Add Document, or “File…” in the Registry).':'<b>The Library is empty.</b><br>Register a document in the <b>Document Control System</b> and attach its file there — it then appears here in its folder.')+'</div>';
  }else{
    h+='<div class="card tw"><table><thead><tr><th>Doc no</th>'+(V.f==='recordroom'?'<th>Period</th>':'')+'<th>Title</th><th>Type</th>'+(V.f==='sectional'&&V.dept?'':'<th>Department</th>')+'<th>Issue / Rev</th><th>Date</th><th></th><th></th></tr></thead><tbody>'+rows.map(d=>{
      const c=libCur(d),o=libOf(d),stale=c&&(c.iss+c.rev)!==(pad(d.issue)+pad(d.rev));
      return'<tr><td class="no">'+esc(d.no)+'</td>'+(V.f==='recordroom'?'<td>'+esc(d.period||'—')+'</td>':'')+'<td><b>'+esc(d.title)+'</b>'+(d.draft?' <span class="chip warn">DRAFT</span>':'')+'<div class="note">'+(c?esc(c.name)+' · '+(c.size/1024).toFixed(0)+' KB':'No file attached yet')+(stale?' · <b style="color:var(--amber)">file is Issue '+c.iss+' / Rev '+c.rev+'</b>':'')+'</div></td><td>'+esc(T[d.type][0])+'</td>'+
        (V.f==='sectional'&&V.dept?'':'<td>'+(o.f==='sectional'?esc(deptName(o.dept)):(T[d.type][2]?'Company-wide':esc(deptName(d.dept))))+'</td>')+
        '<td>'+pad(d.issue)+' / '+pad(d.rev)+'</td><td>'+dmy(d.revDate)+'</td><td><span class="chip '+d.cls.toLowerCase()+'" title="'+({INO:'Internal only',CON:'Confidential',IEX:'May be shared externally'}[d.cls]||'')+'">'+esc(d.cls)+'</span></td>'+
        '<td style="white-space:nowrap">'+(c?'<button class="btn sm red" data-view="'+d.id+'">View</button> <button class="btn sm" data-dl="'+d.id+'">Download</button>':'<span class="note">—</span>')+'</td></tr>'}).join('')+'</tbody></table></div>';
  }
  const keepQ=document.activeElement&&document.activeElement.id==='q';$('#main').innerHTML=h;if(keepQ){const e=$('#q');e.focus();e.setSelectionRange(e.value.length,e.value.length)}
}
/* ---------- view and download ---------- */
async function download(d,f){
  const r=await FLIB.get(f.k);if(!r){alert('That file is not stored in this browser. Open the Document Control System and attach it again, or restore a backup.');return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.data],{type:r.type||'application/octet-stream'}));
  a.download=fname(d)+(d.period?'_'+d.period.replace(/[^A-Za-z0-9]+/g,'-'):'')+(f.iss+f.rev===pad(d.issue)+pad(d.rev)?'':'_Rev'+f.iss+'-'+f.rev)+ext(r.name);document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},900);
}
async function preview(rec,box){
  const e=((rec.name||'').toLowerCase().match(/\.([a-z0-9]+)$/)||[])[1]||'';
  try{
    if(e==='pdf'||rec.type==='application/pdf'){const u=URL.createObjectURL(new Blob([rec.data],{type:'application/pdf'}));urls.push(u);box.innerHTML='<iframe class="pv" src="'+u+'" title="Preview"></iframe><div class="note" style="margin-top:6px">If the page above stays empty in your browser, use Download.</div>';return}
    if(['png','jpg','jpeg','gif','webp','svg','bmp'].includes(e)){const u=URL.createObjectURL(new Blob([rec.data],{type:rec.type||'image/'+e}));urls.push(u);box.innerHTML='<div class="pvt"><img src="'+u+'" alt=""></div>';return}
    if(e==='docx'){if(!window.mammoth)throw new Error('The Word preview component did not load (internet connection needed).');const r=await mammoth.convertToHtml({arrayBuffer:rec.data});box.innerHTML='<div class="pvt">'+r.value+'</div><div class="note" style="margin-top:6px">Simplified preview of the Word file — layout, headers and footers are not shown. Download it for the exact document.</div>';return}
    if(['xlsx','xlsm','xls','csv'].includes(e)){const wb=XLSX.read(rec.data,{type:'array'});const show=n=>{const t=XLSX.utils.sheet_to_html(wb.Sheets[n]);const m=/<table[\s\S]*<\/table>/.exec(t);box.querySelector('.sheet').innerHTML=m?m[0]:'<p>Empty sheet</p>'};
      box.innerHTML='<div class="tabs2">'+wb.SheetNames.map((n,i)=>'<button data-sh="'+esc(n)+'" class="'+(i?'':'on')+'">'+esc(n)+'</button>').join('')+'</div><div class="pvt sheet"></div><div class="note" style="margin-top:6px">Preview of the sheet values. Download it for the exact workbook.</div>';show(wb.SheetNames[0]);
      box.querySelectorAll('.tabs2 button').forEach(b=>b.onclick=()=>{box.querySelectorAll('.tabs2 button').forEach(x=>x.classList.remove('on'));b.classList.add('on');show(b.getAttribute('data-sh'))});return}
    if(['txt','md','log','json','xml','html','htm'].includes(e)){box.innerHTML='<div class="pvt"><pre style="white-space:pre-wrap;margin:0;font:12.5px var(--mono)">'+esc(new TextDecoder().decode(rec.data))+'</pre></div>';return}
    box.innerHTML='<div class="card empty">This kind of file (<b>'+esc(e||'unknown')+'</b>) cannot be shown in the browser.<br>Use <b>Download</b> to open it on your computer.</div>';
  }catch(err){box.innerHTML='<div class="card empty">The preview could not be made ('+esc(err.message||err)+').<br>Use <b>Download</b> instead.</div>'}
}
function closeView(){urls.splice(0).forEach(u=>URL.revokeObjectURL(u));$('#host').innerHTML='';render()}
async function view(id){
  const d=S.docs.find(x=>x.id===id);if(!d)return;const c=libCur(d),o=libOf(d);
  const fs=(d.files||[]).slice().sort((a,b)=>(b.iss+b.rev+b.at).localeCompare(a.iss+a.rev+a.at));
  $('#host').innerHTML='<div class="veil"><div class="modal"><div class="mh"><div style="flex:1;min-width:260px"><h2>'+esc(d.title)+'</h2><div class="note"><span class="no" style="font:500 12.5px var(--mono)">'+esc(d.no)+'</span> · '+esc(T[d.type][0])+' · Issue '+pad(d.issue)+' / Rev '+pad(d.rev)+' · '+dmy(d.revDate)+' · '+LIBF[o.f]+(o.f==='sectional'?' › '+esc(deptName(o.dept)):'')+(d.period?' · Period '+esc(d.period):'')+'</div></div><button class="btn red" id="vdl">Download</button><button class="btn" id="vx">Close</button></div><div class="mb"><div id="pvbox"><div class="empty">Opening…</div></div>'+
    '<details><summary>Revision history</summary><div class="tw" style="margin-top:8px"><table><thead><tr><th>Issue / Rev</th><th>Date</th><th>Description of change</th><th>Approved by</th></tr></thead><tbody>'+d.hist.filter(h=>!h.corr).map(h=>'<tr><td>'+pad(h.issue)+' / '+pad(h.rev)+'</td><td>'+dmy(h.date)+'</td><td>'+esc(h.desc)+'</td><td>'+(h.sig?esc(h.sig.name)+' ✔':(h.appr?esc(h.appr):'—'))+'</td></tr>').join('')+'</tbody></table></div></details>'+
    (fs.length>1?'<details><summary>Earlier files ('+(fs.length-1)+')</summary><div class="tw" style="margin-top:8px"><table><thead><tr><th>File</th><th>Issue / Rev</th><th>Added</th><th></th></tr></thead><tbody>'+fs.slice(1).map(f=>'<tr><td>'+esc(f.name)+'</td><td>'+f.iss+' / '+f.rev+'</td><td>'+dmy(f.at.slice(0,10))+'</td><td><button class="btn sm" data-old="'+esc(f.k)+'">Download</button></td></tr>').join('')+'</tbody></table></div></details>':'')+'</div></div></div>';
  $('#vx').onclick=closeView;$('#vdl').onclick=()=>download(d,c);
  document.querySelectorAll('[data-old]').forEach(b=>b.onclick=()=>download(d,d.files.find(f=>f.k===b.getAttribute('data-old'))));
  const rec=await FLIB.get(c.k);const box=$('#pvbox');
  if(!rec){box.innerHTML='<div class="card empty"><b>The file is not stored in this browser.</b><br>Attach it again in the Document Control System, or restore a system backup that includes the library files.</div>';return}
  preview(rec,box);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-f]');if(b&&b.closest('#tree')){V.f=b.getAttribute('data-f');V.dept=b.getAttribute('data-d')||'';V.type='';render();return}
  const v=e.target.closest('[data-view]');if(v){view(v.getAttribute('data-view'));return}
  const dl=e.target.closest('[data-dl]');if(dl){const d=S.docs.find(x=>x.id===dl.getAttribute('data-dl'));if(d)download(d,libCur(d))}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){V.q=e.target.value;render()}});
document.addEventListener('change',e=>{if(e.target.id==='ty'){V.type=e.target.value;render()}else if(e.target.id==='all'){V.all=e.target.checked;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#host').firstChild)closeView()});
load();render();
})();
</script>
</body>
</html>
