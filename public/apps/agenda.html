<div id="app"></div>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --ink:#1B2B3A;
    --steel:#3C5266;
    --paper:#EEF1F4;
    --card:#FFFFFF;
    --line:#D7DCE1;
    --amber:#B5651D;
    --amber-bg:#FBEEE1;
    --green:#2F7A4F;
    --green-bg:#E7F3EC;
    --red:#B23A2E;
    --red-bg:#FBEAE8;
    --slate:#6B7A88;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  #app{
    font-family:'IBM Plex Sans', sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:0 0 60px 0;
  }
  .topbar{
    background:var(--ink);
    color:#fff;
    padding:22px 28px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  .topbar h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    letter-spacing:0.02em;
    text-transform:uppercase;
    font-size:22px;
    margin:0;
  }
  .topbar .sub{
    font-size:12.5px;
    color:#AEB9C4;
    font-family:'IBM Plex Mono', monospace;
  }
  .tabs{
    display:flex;
    gap:2px;
    background:var(--ink);
    padding:0 28px;
  }
  .tab{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:#AEB9C4;
    background:transparent;
    border:none;
    padding:11px 18px;
    cursor:pointer;
    border-bottom:3px solid transparent;
  }
  .tab.active{
    color:#fff;
    border-bottom:3px solid var(--amber);
  }
  .tab .count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    background:#2A3D4E;
    color:#CBD5DD;
    padding:1px 6px;
    border-radius:8px;
    margin-left:6px;
  }
  main{
    max-width:1080px;
    margin:0 auto;
    padding:26px 20px 0;
  }
  .panel-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:10px;
  }
  .panel-head h2{
    font-family:'Oswald', sans-serif;
    font-size:19px;
    margin:0 0 2px;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .panel-head p{
    margin:0;
    font-size:13px;
    color:var(--slate);
  }
  button.primary{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:13.5px;
    background:var(--ink);
    color:#fff;
    border:none;
    padding:9px 16px;
    border-radius:5px;
    cursor:pointer;
  }
  button.primary:hover{background:var(--steel);}
  button.ghost{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:500;
    font-size:13px;
    background:transparent;
    color:var(--steel);
    border:1px solid var(--line);
    padding:8px 14px;
    border-radius:5px;
    cursor:pointer;
  }
  button.ghost:hover{background:#fff;border-color:var(--steel);}
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:1px;
  }

  /* ticket card, used for requirement + followup rows */
  .ticket{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:10px;
    padding:14px 16px;
    position:relative;
    display:grid;
    grid-template-columns:64px 1fr auto;
    gap:14px;
    align-items:start;
  }
  .ticket .id-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:600;
    color:var(--slate);
    background:var(--paper);
    border:1px dashed var(--line);
    border-radius:6px;
    padding:5px 6px;
    text-align:center;
    line-height:1.3;
  }
  .ticket .body h3{
    margin:0 0 4px;
    font-size:15px;
    font-weight:600;
  }
  .ticket .meta{
    font-size:12px;
    color:var(--slate);
    margin-bottom:6px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .ticket .meta span.dept{
    font-weight:600;
    color:var(--ink);
    text-transform:uppercase;
    letter-spacing:0.02em;
    font-size:11px;
  }
  .ticket .field{font-size:13px;margin:3px 0;color:#334;}
  .ticket .field b{color:var(--ink);font-weight:600;}
  .ticket .actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
  .pill{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .pill.solved{background:var(--green-bg);color:var(--green);}
  .pill.pending{background:var(--amber-bg);color:var(--amber);}
  .pill.overdue{background:var(--red-bg);color:var(--red);}
  .pill.escalate{background:var(--red-bg);color:var(--red);}

  .steps{display:flex;align-items:center;gap:5px;margin-top:8px;}
  .steps .step{
    width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono', monospace;font-size:10.5px;font-weight:600;
    border:1.5px solid var(--line);color:var(--slate);background:#fff;
    cursor:default;
  }
  .steps .step.solved{background:var(--green);border-color:var(--green);color:#fff;}
  .steps .step.pending{background:var(--amber);border-color:var(--amber);color:#fff;}
  .steps .step.overdue{background:var(--red);border-color:var(--red);color:#fff;}
  .steps .step.empty{color:#C3CBD2;}
  .steps .step-label{font-size:11px;color:var(--slate);margin-left:4px;}
  .steps .more{font-family:'IBM Plex Mono', monospace;font-size:11px;color:var(--red);font-weight:600;margin-left:4px;}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    margin-bottom:22px;overflow:hidden;
  }
  .card-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 14px;background:#F7F8FA;border-bottom:1px solid var(--line);
  }
  .card-head .title{font-size:13.5px;color:var(--slate);}
  .card-head .title b{color:var(--ink);}
  table.register{
    width:100%;border-collapse:collapse;font-size:13px;
  }
  table.register th, table.register td{
    border:1px solid var(--line);
    padding:8px 10px;
    vertical-align:top;
    text-align:left;
  }
  table.register th{
    background:#EDEFF2;font-family:'Oswald', sans-serif;font-weight:600;
    text-transform:uppercase;font-size:11.5px;letter-spacing:0.02em;color:var(--slate);
  }
  table.register td.anchor{
    background:#F7F8FA;font-family:'IBM Plex Mono', monospace;font-weight:600;
    color:var(--ink);white-space:nowrap;
  }
  table.register td.action-label{
    font-size:11px;font-weight:600;color:var(--slate);text-transform:uppercase;
    letter-spacing:0.02em;width:90px;
  }
  table.register tr.action-row td{background:#FBFBFC;}
  table.register .row-actions{white-space:nowrap;text-align:right;}
  table.register .row-actions button{margin-left:6px;}
  .add-round{padding:10px 14px;border-top:1px dashed var(--line);}

  .backup-controls{display:flex;gap:8px;align-self:flex-start;margin-top:2px;}
  button.ghost.small, label.ghost.small{
    font-size:11.5px;padding:6px 10px;color:#CBD5DD;border-color:#3C5266;
    display:inline-flex;align-items:center;cursor:pointer;
  }
  button.ghost.small:hover, label.ghost.small:hover{background:#2A3D4E;}
  .storage-warning{
    background:var(--amber-bg);color:var(--amber);font-size:13px;
    padding:10px 20px;border-bottom:1px solid #E8D2B8;
  }
  .storage-ok{
    background:var(--green-bg);color:var(--green);font-size:12.5px;
    padding:7px 20px;border-bottom:1px solid #CFE7D9;
  }
  .save-status{
    font-family:'IBM Plex Mono', monospace;font-size:11px;color:#9BB0C0;
    margin-right:4px;align-self:center;
  }
  .steps-row{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;}

  .attachments{margin-top:8px;}
  .attach-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .attach-thumb{
    position:relative;width:74px;height:74px;border-radius:6px;overflow:hidden;
    border:1px solid var(--line);background:#F0F1F3;flex:0 0 auto;
  }
  .attach-thumb img, .attach-thumb video{width:100%;height:100%;object-fit:cover;display:block;}
  .attach-thumb .remove-x{
    position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;
    background:rgba(0,0,0,0.65);color:#fff;border:none;font-size:11px;line-height:18px;
    text-align:center;cursor:pointer;padding:0;
  }
  .attach-thumb .vid-badge{
    position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,0.6);color:#fff;
    font-size:9px;padding:1px 4px;border-radius:3px;font-family:'IBM Plex Mono', monospace;
  }
  .attach-add-label{
    display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--steel);
    border:1px dashed var(--line);border-radius:5px;padding:5px 10px;cursor:pointer;
  }
  .attach-add-label:hover{background:#F7F8FA;}
  .attach-lightbox{
    position:fixed;inset:0;background:rgba(20,28,36,0.85);z-index:60;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .attach-lightbox img, .attach-lightbox video{max-width:100%;max-height:100%;border-radius:6px;}
  .history-panel{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;}
  .next-due{
    font-family:'IBM Plex Mono', monospace;font-size:11px;font-weight:600;
    padding:3px 9px;border-radius:20px;white-space:nowrap;text-align:right;
  }
  .next-due.upcoming{background:#EAF0F6;color:var(--steel);}
  .next-due.today{background:var(--amber-bg);color:var(--amber);}
  .next-due.overdue{background:var(--red-bg);color:var(--red);}
  .next-due.unset{background:#F0F1F3;color:var(--slate);}

  .pager{
    display:flex;align-items:center;justify-content:center;gap:14px;
    margin:18px 0 8px;padding:12px;
  }
  .pager-count{font-size:12px;color:var(--slate);font-family:'IBM Plex Mono', monospace;}
  .pager-page{font-size:13px;color:var(--ink);font-weight:600;}
  .pager button:disabled{opacity:0.4;cursor:not-allowed;}
  .linklike{
    font-size:12px;
    color:var(--steel);
    background:none;
    border:none;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .type-tag{
    font-family:'IBM Plex Mono', monospace;font-size:10.5px;font-weight:600;
    background:#EAF0F6;color:var(--steel);padding:2px 8px;border-radius:10px;
  }
  .rca-btn{
    font-family:'IBM Plex Sans', sans-serif;font-size:12px;font-weight:600;
    background:#fff;color:var(--slate);border:1px solid var(--line);
    border-radius:5px;padding:5px 10px;cursor:pointer;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;
  }
  .rca-btn:hover{border-color:var(--steel);}
  .rca-btn .box{
    width:14px;height:14px;border:1.5px solid var(--slate);border-radius:3px;
    display:inline-flex;align-items:center;justify-content:center;font-size:11px;line-height:1;
  }
  .rca-btn.on{background:var(--red-bg);color:var(--red);border-color:var(--red);}
  .capa-btn{font-family:'IBM Plex Sans', sans-serif;font-size:12px;font-weight:600;background:#fff;color:#1f3a5f;border:1px solid #1f3a5f;border-radius:5px;padding:5px 10px;cursor:pointer;white-space:nowrap;}
  .capa-btn:hover{background:#1f3a5f;color:#fff;}
  .field.plan{background:#F4F7FB;border-left:3px solid #1f3a5f;padding:6px 10px;border-radius:0 5px 5px 0;}
  .rca-btn.on .box{background:var(--red);border-color:var(--red);color:#fff;}
  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--slate);
    border:1px dashed var(--line);
    border-radius:8px;
    font-size:14px;
  }

  /* modal form */
  .overlay{
    position:fixed;inset:0;background:rgba(20,28,36,0.5);
    display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .modal{
    background:#fff;border-radius:10px;max-width:560px;width:100%;
    max-height:88vh;overflow-y:auto;padding:22px 24px 24px;
  }
  .modal h3{
    font-family:'Oswald', sans-serif;text-transform:uppercase;font-size:17px;margin:0 0 14px;
  }
  .form-row{margin-bottom:12px;}
  .form-row label{
    display:block;font-size:12px;font-weight:600;color:var(--slate);
    text-transform:uppercase;letter-spacing:0.02em;margin-bottom:4px;
  }
  .form-row input, .form-row select, .form-row textarea{
    width:100%;font-family:'IBM Plex Sans', sans-serif;font-size:14px;
    padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:#fcfdfe;
  }
  .form-row textarea{resize:vertical;min-height:52px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

  /* agenda */
  .agenda-controls{
    display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:16px;margin-bottom:20px;
  }
  .agenda-controls .form-row{margin-bottom:0;flex:0 0 200px;}
  .section-title{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;font-size:15px;letter-spacing:0.03em;
    margin:22px 0 10px;color:var(--ink);
    display:flex;align-items:center;gap:8px;
  }
  .section-title .n{
    font-family:'IBM Plex Mono', monospace;font-size:11px;background:var(--ink);color:#fff;
    padding:2px 7px;border-radius:10px;
  }
  .print-btn{margin-left:auto;}
  @media print{
    .topbar,.tabs,.agenda-controls,.actions,button{display:none !important;}
    #app{background:#fff;}
    main{max-width:100%;padding:0;}
    .ticket{break-inside:avoid;border:1px solid #999;}
  }
  @media (max-width:640px){
    .ticket{grid-template-columns:1fr;}
    .ticket .id-tag{width:fit-content;}
    .ticket .actions{flex-direction:row;}
    .form-grid{grid-template-columns:1fr;}
  }
</style>

    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function nextIssueId(){
    const ids = state.requirements.map(r=>r.issueId||0);
    return (ids.length ? Math.max(...ids) : 0) + 1;
  }
  function nextFollowupId(){
    const n = state.followups.length + 1;
    return 'F/' + String(n).padStart(4,'0') + '26';
  }
  function nextProjectId(){
    const ids = state.projects.map(p=>p.id||0);
    return (ids.length ? Math.max(...ids) : 0) + 1;
  }

  // Storage: this file runs as a standalone page (opened directly in a browser),
  // not inside Claude's artifact sandbox, so we persist with localStorage —
  // it's tied to this exact file's location in the browser that opened it
  // (a fresh download to a new filename/location starts empty, since the
  // browser treats it as a different origin). A "Download backup" / "Load
  // backup" pair (in the UI) covers that, and browsers/situations where
  // localStorage isn't available at all.
  let storageOK = true;
  state.loadedFromStorage = false;
  state.lastSavedAt = null;

  // Upgrades projects saved in the old single-status format (before the
  // follow-up log existed) into the new followupLog[] shape, non-destructively.
  function migrateProjects(projects){
    return (projects || []).map(p=>{
      if(Array.isArray(p.followupLog)) return p;
      const log = [];
      if(p.followupStatus || p.nextFollowupDate){
        log.push({date: p.startDate || todayStr(), status: p.followupStatus || '', nextFollowupDate: p.nextFollowupDate || '', loggedAt: 'legacy-'+p.id});
      }
      const {followupStatus, nextFollowupDate, ...rest} = p;
      return {...rest, followupLog: log};
    });
  }

  async function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        state.requirements = parsed.requirements || SEED.requirements;
        state.followups = parsed.followups || SEED.followups;
        state.projects = migrateProjects(parsed.projects || SEED.projects || []);
        state.autoSeen = parsed.autoSeen || [];
        state.loadedFromStorage = true;
        return;
      }
    }catch(e){
      storageOK = false;
      console.error('localStorage unavailable', e);
    }
    state.requirements = JSON.parse(JSON.stringify(SEED.requirements));
    state.followups = JSON.parse(JSON.stringify(SEED.followups));
    state.projects = migrateProjects(JSON.parse(JSON.stringify(SEED.projects || [])));
  }

  async function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        requirements: state.requirements,
        followups: state.followups,
        projects: state.projects,
        autoSeen: state.autoSeen
      }));
      storageOK = true;
      state.lastSavedAt = new Date();
      publishRca();
      syncCapa();
      publishStatus();
    }catch(e){
      storageOK = false;
      console.error('save failed', e);
    }
  }

  function downloadBackup(){
    const blob = new Blob([JSON.stringify({requirements: state.requirements, followups: state.followups, projects: state.projects, autoSeen: state.autoSeen}, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `followup-backup-${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function loadBackupFile(file){
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const parsed = JSON.parse(e.target.result);
        if(!parsed.requirements || !parsed.followups) throw new Error('missing keys');
        state.requirements = parsed.requirements;
        state.followups = parsed.followups;
        state.projects = migrateProjects(parsed.projects || []);
        state.autoSeen = parsed.autoSeen || [];
        saveState();
        render();
      }catch(err){
        alert('That file doesn\'t look like a valid backup.');
      }
    };
    reader.readAsText(file);
  }

  function esc(s){
    if(s===null||s===undefined) return '';
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- photo/video attachments (requirements + follow-up steps) ----------
  const ATTACH_WARN_BYTES = 2 * 1024 * 1024; // 2MB — past this, warn it may not persist reliably

  function findOwnerRecord(ownerType, ownerId){
    if(ownerType==='requirement') return state.requirements.find(r=>String(r.issueId)===String(ownerId));
    if(ownerType==='followup') return state.followups.find(f=>String(f.followupId)===String(ownerId));
    if(ownerType==='project') return state.projects.find(p=>String(p.id)===String(ownerId));
    if(ownerType==='projectFollowup'){
      const sep = String(ownerId).indexOf('::');
      const pid = String(ownerId).slice(0, sep);
      const loggedAt = String(ownerId).slice(sep+2);
      const proj = state.projects.find(p=>String(p.id)===String(pid));
      return proj ? (proj.followupLog||[]).find(e=>e.loggedAt===loggedAt) : null;
    }
    return null;
  }

  function readFileAsDataURL(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function addAttachments(ownerType, ownerId, files){
    const rec = findOwnerRecord(ownerType, ownerId);
    if(!rec) return;
    const tooBig = files.filter(f=>f.size > ATTACH_WARN_BYTES);
    if(tooBig.length){
      const ok = confirm(`${tooBig.length} file(s) are over 2MB. Large photos/videos may not save reliably in browser storage. Add anyway?`);
      if(!ok) return;
    }
    const newItems = [];
    for(const file of files){
      try{
        const dataUrl = await readFileAsDataURL(file);
        newItems.push({
          id: 'A' + Date.now() + Math.random().toString(36).slice(2,7),
          name: file.name,
          type: file.type,
          dataUrl,
          addedAt: todayStr(),
        });
      }catch(e){ console.error('failed to read file', file.name, e); }
    }
    if(!newItems.length) return;
    rec.attachments = (rec.attachments || []).concat(newItems);
    saveState();
    render();
  }

  function removeAttachment(ownerType, ownerId, attachmentId){
    const rec = findOwnerRecord(ownerType, ownerId);
    if(!rec || !rec.attachments) return;
    rec.attachments = rec.attachments.filter(a=>a.id!==attachmentId);
    saveState();
    render();
  }

  function attachmentsSection(list, ownerType, ownerId){
    const items = list || [];
    const thumbs = items.map(a=>{
      const isVideo = (a.type||'').startsWith('video/');
      const media = isVideo
        ? `<video src="${a.dataUrl}" muted></video><span class="vid-badge">▶</span>`
        : `<img src="${a.dataUrl}" alt="${esc(a.name)}">`;
      return `
        <div class="attach-thumb" data-action="view-attachment" data-owner-type="${ownerType}" data-owner-id="${esc(ownerId)}" data-attachment-id="${a.id}">
          ${media}
          <button class="remove-x" data-action="remove-attachment" data-owner-type="${ownerType}" data-owner-id="${esc(ownerId)}" data-attachment-id="${a.id}" title="Remove">×</button>
        </div>
      `;
    }).join('');
    const inputId = `attach-${ownerType}-${ownerId}`;
    return `
      <div class="attachments">
        ${thumbs ? `<div class="attach-grid">${thumbs}</div>` : ''}
        <label class="attach-add-label" for="${inputId}">📎 Add photo/video</label>
        <input type="file" id="${inputId}" class="attach-input" data-owner-type="${ownerType}" data-owner-id="${esc(ownerId)}" accept="image/*,video/*" multiple hidden>
      </div>
    `;
  }

  function renderLightbox(){
    const item = state.lightbox;
    const isVideo = (item.type||'').startsWith('video/');
    const media = isVideo ? `<video src="${item.dataUrl}" controls autoplay></video>` : `<img src="${item.dataUrl}">`;
    return `<div class="attach-lightbox" data-action="close-lightbox">${media}</div>`;
  }

  const MAX_STEPS = 5;

  const ISSUE_TYPES = [
    '01. Machine Breakdown, Machine Maintenance or Repair',
    '02. Management Issue',
    '03. New Development Proposal',
    '04. New Management Decision, Policy or Suggestion',
    '05. Other',
  ];

  function toggleRCA(issueId){
    const r = state.requirements.find(x=>String(x.issueId)===String(issueId));
    if(!r) return;
    r.rcaRequired = !r.rcaRequired;
    saveState();
    render();
  }

  // All follow-up rounds logged for an issue, in the order they happened.
  // excludeId lets a form-in-progress exclude the row currently being edited.
  function stepsForIssue(issueId, excludeId){
    return state.followups
      .filter(f => String(f.issueId)===String(issueId) && f.followupId!==excludeId)
      .sort((a,b)=> (a.discussedDate||'').localeCompare(b.discussedDate||'') || String(a.followupId||'').localeCompare(String(b.followupId||'')));
  }

  function followupsFor(issueId){
    return state.followups.filter(f=>f.issueId===issueId);
  }

  // The step that currently represents the issue's state: the last one logged.
  function latestFollowup(issueId){
    const steps = stepsForIssue(issueId);
    return steps.length ? steps[steps.length-1] : null;
  }

  function stepClass(f){
    if(!f) return 'empty';
    if(f.status && f.status.toUpperCase()==='SOLVED') return 'solved';
    if(f.followUpDate && f.followUpDate < todayStr()) return 'overdue';
    return 'pending';
  }

  function isEscalated(issueId){
    const steps = stepsForIssue(issueId);
    if(steps.length < MAX_STEPS) return false;
    const last = steps[steps.length-1];
    return !(last.status && last.status.toUpperCase()==='SOLVED');
  }

  function isSolved(issueId){
    const f = latestFollowup(issueId);
    return !!(f && f.status && f.status.toUpperCase()==='SOLVED');
  }

  function openRequirements(){
    return state.requirements.filter(r=>!isSolved(r.issueId));
  }

  function solvedRequirements(){
    return state.requirements.filter(r=>isSolved(r.issueId));
  }

  function activeProjects(){
    return state.projects.filter(p=>p.status!=='FINISHED');
  }
  function finishedProjects(){
    return state.projects.filter(p=>p.status==='FINISHED');
  }
  // Every follow-up status entry logged for a project, oldest first.
  function projectFollowupLog(p){
    return (p.followupLog || []).slice().sort((a,b)=>
      (a.date||'').localeCompare(b.date||'') || (a.loggedAt||'').localeCompare(b.loggedAt||'')
    );
  }
  function latestProjectFollowup(p){
    const log = projectFollowupLog(p);
    return log.length ? log[log.length-1] : null;
  }
  function projectDueSortValue(p){
    const last = latestProjectFollowup(p);
    return (last && last.nextFollowupDate) || '9999-99-99';
  }
  function projectDueClass(p){
    const last = latestProjectFollowup(p);
    const due = last && last.nextFollowupDate;
    if(!due) return 'unset';
    const today = todayStr();
    if(due < today) return 'overdue';
    if(due === today) return 'today';
    return 'upcoming';
  }

  function statusPill(f, issueId){
    if(issueId!==undefined && isEscalated(issueId)) return '<span class="pill escalate">ESCALATE — 5 STEPS, UNRESOLVED</span>';
    if(!f) return '<span class="pill pending">NO FOLLOW-UP YET</span>';
    if(f.status && f.status.toUpperCase()==='SOLVED') return `<span class="pill solved">SOLVED</span>`;
    if(f.followUpDate && f.followUpDate < todayStr()) return `<span class="pill overdue">OVERDUE</span>`;
    return `<span class="pill pending">${esc(f.status||'PENDING')}</span>`;
  }

  // A small "next follow-up due" readout shown on each requirement ticket.
  function nextFollowupBadge(issueId){
    const f = latestFollowup(issueId);
    if(!f || (f.status && f.status.toUpperCase()==='SOLVED')) return '';
    const date = f.followUpDate;
    if(!date) return `<div class="next-due unset">Next follow-up: not scheduled</div>`;
    const today = todayStr();
    let cls = 'upcoming';
    let label = `Next follow-up: ${date}`;
    if(date < today){ cls = 'overdue'; label = `Next follow-up: ${date} (overdue)`; }
    else if(date === today){ cls = 'today'; label = `Next follow-up: today (${date})`; }
    return `<div class="next-due ${cls}">${esc(label)}</div>`;
  }

  // Renders the 1-5 step tracker used on requirement tickets.
  function renderStepTracker(issueId){
    const steps = stepsForIssue(issueId);
    const dots = [];
    for(let i=0;i<MAX_STEPS;i++){
      const f = steps[i];
      const cls = f ? stepClass(f) : 'empty';
      const title = f
        ? `Step ${i+1}: ${esc(f.discussedDate||'—')} — ${esc(f.status||'pending')}${f.followUpDate?` (next due ${esc(f.followUpDate)})`:''}`
        : `Step ${i+1}: not yet reached`;
      dots.push(`<span class="step ${cls}" title="${title}">${i+1}</span>`);
    }
    const overflow = steps.length > MAX_STEPS ? `<span class="more">+${steps.length-MAX_STEPS} over limit</span>` : '';
    return `<div class="steps">${dots.join('')}<span class="step-label">${steps.length}/${MAX_STEPS} steps</span>${overflow}</div>`;
  }

  // The full cascading follow-up history for one issue, matching the
  // Followup ID / Department / Issue / Status register format.
  function renderRegisterTable(issueId){
    const req = state.requirements.find(r=>String(r.issueId)===String(issueId));
    const steps = stepsForIssue(issueId);
    const anchorId = steps.length ? steps[0].followupId : '—';
    const current = steps.length ? steps[steps.length-1] : null;
    const anchorSpan = 1 + (steps.length ? steps.slice(0, MAX_STEPS).length * 4 : 1);

    const bodyRows = steps.slice(0, MAX_STEPS).map((s)=>`
      <tr>
        <td>${esc(s.discussedDate||'—')}</td>
        <td>${esc(s.status||'—')}</td>
        <td>${esc(s.followUpDate||'—')}</td>
        <td class="row-actions"><button class="linklike" data-action="edit-followup" data-id="${esc(s.followupId)}">Edit</button></td>
      </tr>
      <tr class="action-row">
        <td colspan="3"><span class="action-label">Update</span> ${esc(s.issue||'—')}</td>
        <td></td>
      </tr>
      <tr class="action-row">
        <td colspan="3"><span class="action-label">Action</span> ${esc(s.actionRequired||'—')}</td>
        <td></td>
      </tr>
      <tr class="action-row">
        <td colspan="3"><span class="action-label">Media</span> ${attachmentsSection(s.attachments, 'followup', s.followupId)}</td>
        <td></td>
      </tr>
    `).join('');

    return `
      <table class="register">
        <thead>
          <tr>
            <th>Followup ID</th><th>Department</th><th>Issue</th><th>Status</th><th></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="anchor" rowspan="${anchorSpan}">${esc(anchorId)}</td>
            <td>${esc((req&&req.department)||'—')}</td>
            <td>${esc((req&&req.issueDescription)||'—')}</td>
            <td>${statusPill(current, issueId)}</td>
            <td></td>
          </tr>
          ${bodyRows || `<tr><td colspan="4" style="color:var(--slate);">No follow-up rounds logged yet.</td></tr>`}
        </tbody>
      </table>
      <div class="add-round">
        <button class="linklike" data-action="add-followup-for" data-id="${esc(issueId)}">+ Log next round</button>
      </div>
    `;
  }

          <div>
          <h1>Weekly Management Meeting</h1>
          <div class="sub">requirement intake &amp; follow-up tracker &middot; ${esc(todayStr())}</div>
          </div>
        </div>
        <div class="backup-controls">
          <span class="save-status">${saveStatusLabel()}</span>
          <button class="ghost small" data-action="download-backup">⭳ Download backup</button>

      ${storageOK && state.loadedFromStorage ? `<div class="storage-ok">Showing your saved data from this browser — last change saved automatically.</div>` : ''}
      <div class="tabs">
        ${tabBtn('requirements','Requirements', openRequirements().length)}
        ${tabBtn('projects','Projects', activeProjects().length)}
        ${tabBtn('finishedProjects','Finished projects', finishedProjects().length)}
        ${tabBtn('solved','Solved', solvedRequirements().length)}
      </div>
      <main>${state.tab==='requirements'?renderRequirements():state.tab==='solved'?renderSolved():state.tab==='finishedProjects'?renderFinishedProjects():renderProjects()}</main>
      ${state.modal ? renderModal() : ''}
      ${state.lightbox ? renderLightbox() : ''}
    `;
    bindEvents();
  }

  function saveStatusLabel(){
    if(!storageOK) return '⚠ Not saving';
    if(!state.lastSavedAt) return 'Autosave on';
    const t = state.lastSavedAt;
    const hh = String(t.getHours()).padStart(2,'0');
    const mm = String(t.getMinutes()).padStart(2,'0');
    return `✓ Saved ${hh}:${mm}`;
  }

  function tabBtn(id,label,count){
    return `<button class="tab ${state.tab===id?'active':''}" data-tab="${id}">${label}${count!==undefined?`<span class="count">${count}</span>`:''}</button>`;
  }

  function nextDueSortValue(issueId){
    const f = latestFollowup(issueId);
    return (f && f.followUpDate) ? f.followUpDate : '9999-99-99';
  }

  function renderRequirements(){
    const rows = openRequirements().sort((a,b)=>
      nextDueSortValue(a.issueId).localeCompare(nextDueSortValue(b.issueId)) || ((b.issueId||0)-(a.issueId||0))
    );
    return `
      <div class="panel-head">
        <div>
          <h2>Requirements</h2>
          <p>Sorted by next follow-up due date — most urgent first. Marking the latest follow-up "Solved" moves an issue to the Solved tab.</p>
        </div>
        <button class="primary" data-action="new-requirement">+ New requirement</button>
      </div>
      ${rows.length===0 ? emptyState('Nothing open','Every requirement has been solved, or add a new one to get started.') : rows.map(renderRequirementTicket).join('')}
    `;
  }

  function renderSolved(){
    const rows = solvedRequirements().sort((a,b)=>(b.issueId||0)-(a.issueId||0));
    return `
      <div class="panel-head">
        <div>
          <h2>Solved</h2>
          <p>Requirements whose most recent follow-up was marked Solved.</p>
        </div>
      </div>
      ${rows.length===0 ? emptyState('Nothing here yet','Solved requirements will show up here automatically.') : rows.map(renderRequirementTicket).join('')}
    `;
  }

  function renderProjects(){
    const active = activeProjects().sort((a,b)=>projectDueSortValue(a).localeCompare(projectDueSortValue(b)) || ((b.id||0)-(a.id||0)));
    return `
      <div class="panel-head">
        <div>
          <h2>Projects</h2>
          <p>Sorted by next follow-up due date — most urgent first. Marking a project finished moves it to the Finished projects tab.</p>
        </div>
        <button class="primary" data-action="new-project">+ New project</button>
      </div>
      ${active.length===0 ? emptyState('No active projects','Add a new project to get started.') : active.map(renderProjectTicket).join('')}
    `;
  }

  function renderFinishedProjects(){
    const rows = finishedProjects().sort((a,b)=>(b.id||0)-(a.id||0));
    return `
      <div class="panel-head">
        <div>
          <h2>Finished projects</h2>
          <p>Projects marked finished. Reopen one to move it back to Projects.</p>
        </div>
      </div>
      ${rows.length===0 ? emptyState('Nothing here yet','Finished projects will show up here automatically.') : rows.map(renderProjectTicket).join('')}
    `;
  }

  function renderProjectTicket(p){
    const isFinished = p.status === 'FINISHED';
    const dueCls = projectDueClass(p);
    const last = latestProjectFollowup(p);
    const due = last && last.nextFollowupDate;
    const dueLabel = !due ? 'Next follow-up: not scheduled'
      : dueCls==='overdue' ? `Next follow-up: ${due} (overdue)`
      : dueCls==='today' ? `Next follow-up: today (${due})`
      : `Next follow-up: ${due}`;
    const log = projectFollowupLog(p);
    const expanded = state.expandedProjects.has(String(p.id));
    return `
      <div class="ticket">
        <div class="id-tag">PROJ<br>#${p.id}</div>
        <div class="body">
          <div class="meta"><span class="dept">${esc(p.department||'—')}</span>${p.owner?` · Owner: ${esc(p.owner)}`:''}${p.startDate?` · Started ${esc(p.startDate)}`:''}</div>
          <h3>${esc(p.name||'(untitled project)')}</h3>
          ${p.description?`<div class="field"><b>Description:</b> ${esc(p.description)}</div>`:''}
          ${last?`<div class="field"><b>Latest status</b> (${esc(last.date||'—')})<b>:</b> ${esc(last.status||'—')}</div>`:''}
          ${attachmentsSection(p.attachments, 'project', p.id)}
          ${log.length ? `<button class="linklike" data-action="toggle-project-history" data-id="${p.id}">${expanded?'Hide':'View'} follow-up history (${log.length})</button>` : ''}
          ${expanded ? `<div class="history-panel">${renderProjectHistoryTable(p)}</div>` : ''}
        </div>
        <div class="actions">
          ${isFinished ? '<span class="pill solved">FINISHED</span>' : `<div class="next-due ${dueCls}">${esc(dueLabel)}</div>`}
          <button class="linklike" data-action="edit-project" data-id="${p.id}">Edit</button>
          ${isFinished
            ? `<button class="linklike" data-action="reopen-project" data-id="${p.id}">Reopen</button>`
            : `<button class="linklike" data-action="log-project-followup" data-id="${p.id}">+ New follow-up status</button>
               <button class="linklike" data-action="mark-project-finished" data-id="${p.id}">Mark finished</button>`}
        </div>
      </div>
    `;
  }

  // Simple date / status / next-due table for a project's follow-up history.
  function renderProjectHistoryTable(p){
    const log = projectFollowupLog(p);
    const rows = log.map(entry => `
      <tr>
        <td>${esc(entry.date||'—')}</td>
        <td>${esc(entry.status||'—')}</td>
        <td>${esc(entry.nextFollowupDate||'—')}</td>
      </tr>
      <tr class="action-row">
        <td colspan="3"><span class="action-label">Media</span> ${attachmentsSection(entry.attachments, 'projectFollowup', `${p.id}::${entry.loggedAt}`)}</td>
      </tr>
    `).join('');
    return `
      <table class="register">
        <thead><tr><th>Follow-up date</th><th>Status</th><th>Next follow-up date</th></tr></thead>

  // ---------- events ----------
  function bindEvents(){
    document.querySelectorAll('[data-tab]').forEach(el=>{
      el.onclick = ()=>{ state.tab = el.dataset.tab; render(); };
    });

    const issueSelect = document.getElementById('f-issueId');
    const stepPreview = document.getElementById('step-preview');
    if(issueSelect && stepPreview){
      const editingId = state.modal && state.modal.editing ? state.modal.editing.followupId : null;
      const updatePreview = ()=>{
        const count = stepsForIssue(issueSelect.value, editingId).length;
        const stepNum = editingId ? Math.min(count+1, MAX_STEPS) : count+1;
        if(stepNum > MAX_STEPS){
          stepPreview.innerHTML = `<span style="color:var(--red);font-weight:600;">This issue already has ${count} follow-ups logged — beyond the ${MAX_STEPS}-step limit. Consider escalating instead.</span>`;
        } else {
          stepPreview.textContent = `This will be step ${stepNum} of ${MAX_STEPS} for this issue.`;
        }
      };
      issueSelect.onchange = updatePreview;
      updatePreview();
    }

    document.querySelectorAll('[data-action]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const action = el.dataset.action;
        const id = el.dataset.id;
        if(action==='new-requirement'){ state.modal = {type:'requirement', editing:null}; render(); }
        else if(action==='edit-requirement'){
          const r = state.requirements.find(x=>String(x.issueId)===String(id));
          state.modal = {type:'requirement', editing:r}; render();
        }
        else if(action==='toggle-rca'){ toggleRCA(id); }
        else if(action==='send-capa'){ sendCapaClick(id); }
        else if(action==='add-followup-for'){ state.modal = {type:'followup', editing:null, presetIssueId:id}; render(); }
        else if(action==='edit-followup'){
          const f = state.followups.find(x=>x.followupId===id);
          state.modal = {type:'followup', editing:f}; render();
        }
        else if(action==='close-modal'){ state.modal=null; render(); }
        else if(action==='save-requirement'){ saveRequirement(id); }
        else if(action==='save-followup'){ saveFollowup(); }
        else if(action==='new-project'){ state.modal = {type:'project', editing:null}; render(); }
        else if(action==='edit-project'){
          const p = state.projects.find(x=>String(x.id)===String(id));
          state.modal = {type:'project', editing:p}; render();
        }
        else if(action==='save-project'){ saveProject(id); }
        else if(action==='log-project-followup'){ state.modal = {type:'projectFollowup', projectId:id}; render(); }
        else if(action==='save-project-followup'){ saveProjectFollowup(id); }
        else if(action==='mark-project-finished'){ setProjectStatus(id, 'FINISHED'); }
        else if(action==='reopen-project'){ setProjectStatus(id, 'ACTIVE'); }
        else if(action==='toggle-history'){
          if(state.expandedIssues.has(id)) state.expandedIssues.delete(id);
          else state.expandedIssues.add(id);
          render();
        }
        else if(action==='toggle-project-history'){
          if(state.expandedProjects.has(id)) state.expandedProjects.delete(id);
          else state.expandedProjects.add(id);
          render();
        }
        else if(action==='download-backup'){ downloadBackup(); }
        else if(action==='view-attachment'){
          const rec = findOwnerRecord(el.dataset.ownerType, el.dataset.ownerId);
          const item = rec && (rec.attachments||[]).find(a=>a.id===el.dataset.attachmentId);
          if(item){ state.lightbox = item; render(); }
        }
        else if(action==='remove-attachment'){
          removeAttachment(el.dataset.ownerType, el.dataset.ownerId, el.dataset.attachmentId);
        }
        else if(action==='close-lightbox'){ state.lightbox = null; render(); }
      };
    });

    document.querySelectorAll('.attach-input').forEach(inp=>{
      inp.onchange = (e)=>{
        const files = Array.from(e.target.files || []);
        if(files.length) addAttachments(inp.dataset.ownerType, inp.dataset.ownerId, files);
      };
    });

    const backupFile = document.getElementById('backup-file');
    if(backupFile) backupFile.onchange = (e)=>{
      if(e.target.files && e.target.files[0]) loadBackupFile(e.target.files[0]);
    };
  }

  function val(id){ const el=document.getElementById(id); return el?el.value:''; }

  function saveRequirement(id){
    const data = {
      issueId: Number(id),
      department: val('f-department'),
      topicCategory: val('f-topicCategory'),
      issueType: val('f-issueType'),
      issueDescription: val('f-issueDescription'),
      impact: val('f-impact'),
      actionRequired: val('f-actionRequired'),
      actionPlan: val('f-actionPlan'),
      name: val('f-name'),
      responsibility: val('f-responsibility'),
      rcaRequired: !!(document.getElementById('f-rcaRequired') && document.getElementById('f-rcaRequired').checked),
    };
    const idx = state.requirements.findIndex(r=>r.issueId===data.issueId);
    // merge so existing photo/video attachments are kept when editing
    if(idx>=0) state.requirements[idx] = {...state.requirements[idx], ...data}; else state.requirements.push(data);
    state.modal = null;
    saveState();
    render();
  }

  function saveFollowup(){
    const issueIdRaw = val('f-issueId');
    const data = {
      followupId: state.modal.editing ? state.modal.editing.followupId : nextFollowupId(),
      issueId: issueIdRaw ? Number(issueIdRaw) : null,
      department: val('f-department'),
      issue: val('f-issue'),
      discussedDate: val('f-discussedDate'),
      status: val('f-status'),
      actionRequired: val('f-actionRequired'),
      followUpDate: val('f-followUpDate'),
    };
    const idx = state.followups.findIndex(f=>f.followupId===data.followupId);
    if(idx>=0) state.followups[idx] = data; else state.followups.push(data);
    state.modal = null;
    saveState();
    render();
  }

  function saveProject(id){
    const data = {
      id: Number(id),
      name: val('f-name'),
      description: val('f-description'),
      department: val('f-department'),
      owner: val('f-owner'),
      startDate: val('f-startDate'),
    };
    const idx = state.projects.findIndex(p=>p.id===data.id);
    if(idx>=0){
      state.projects[idx] = {...state.projects[idx], ...data};
    } else {
      state.projects.push({status:'ACTIVE', followupLog:[], ...data});
    }
    state.modal = null;
    saveState();
    render();
  }

  function saveProjectFollowup(id){
    const idx = state.projects.findIndex(p=>String(p.id)===String(id));
    if(idx>=0){
      const entry = {
        date: val('f-followupDate') || todayStr(),
        status: val('f-followupStatus'),
        nextFollowupDate: val('f-nextFollowupDate'),
        loggedAt: new Date().toISOString(),
      };
      const log = (state.projects[idx].followupLog || []).slice();
      log.push(entry);
      state.projects[idx] = { ...state.projects[idx], followupLog: log };
    }
    state.modal = null;
    saveState();
    render();
  }

  function setProjectStatus(id, status){
    const idx = state.projects.findIndex(p=>String(p.id)===String(id));
    if(idx>=0){
      state.projects[idx] = {...state.projects[idx], status};
      saveState();
      render();
    }
  }

  // Issues ticked "RCA required" are handed to the host page, which passes them to
  // the RCA Workbench so each one gets a case there.
  function publishRca(){
    try{
      if(window.parent === window) return;
      const items = state.requirements.filter(r=>r.rcaRequired).map(r=>{
        const desc = String(r.issueDescription||'').trim();
        const bits = [];
        bits.push('Raised in the weekly management meeting (issue #'+r.issueId+(r.department?', '+r.department:'')+(r.topicCategory?' / '+r.topicCategory:'')+').');
        if(desc) bits.push('Issue: '+desc);
        if(r.impact) bits.push('Impact: '+r.impact);
        if(r.actionRequired) bits.push('Action required: '+r.actionRequired);
        const owner = [r.name, r.responsibility].filter(Boolean).join(' / ');
        if(owner) bits.push('Owner: '+owner);
        return {
          key: 'agenda:'+r.issueId, source: 'agenda',
          name: 'Agenda #'+r.issueId+': '+(desc.length>60 ? desc.slice(0,57)+'...' : (desc||'Untitled issue')),
          defect: desc.length>90 ? desc.slice(0,87)+'...' : desc,
          statement: bits.join(' '), target: ''
        };
      });
      window.parent.postMessage({type:'fitl-rca-candidates', source:'agenda', items}, '*');
    }catch(e){}
  }


  // ---------- the CAPA step ----------
  // An issue goes to CAPA in two ways only, both decided here at the weekly meeting:
  //  1. the meeting presses "Send to CAPA" once it has reviewed the issue;
  //  2. the issue was marked "RCA required" - it goes to CAPA by itself when the RCA Workbench finishes the analysis,
  //     carrying the root causes found.
  // What goes: the issue (RG-QA-10), the action plan lines (RG-QA-11) and the follow-ups logged here (RG-QA-12).
  // After that, edits made here are passed on automatically.
  function capaPayload(r){
    const lines = String(r.actionPlan||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    const fus = state.followups.filter(f=>String(f.issueId)===String(r.issueId))
      .sort((x,y)=>(x.discussedDate||'').localeCompare(y.discussedDate||'') || String(x.followupId||'').localeCompare(String(y.followupId||'')))
      .map(f=>({ key:'agenda:'+r.issueId+':'+f.followupId, date:f.discussedDate||todayStr(),
        ref:'Weekly meeting issue #'+r.issueId+' — '+(f.status||'follow-up')+(f.actionRequired?' — '+f.actionRequired:'')+(f.followUpDate?' (next: '+f.followUpDate+')':'') }));
    return { key:'agenda:'+r.issueId, issueId:r.issueId, autoKey:r.autoKey||'', date:(r.capa&&r.capa.sentAt)||todayStr(),
      text:String(r.issueDescription||'').trim()+(r.impact?' Impact: '+String(r.impact).trim():''), department:r.department||'',
      actions:lines.map((t,i)=>({ key:'agenda:'+r.issueId+':a'+(i+1), text:t })), followups:fus,
      causes:(r.rcaResult&&r.rcaResult.causes)||[], rca:!!r.rcaRequired };
  }
  function postCapa(list){
    try{ if(window.parent !== window && list.length) window.parent.postMessage({ type:'fitl-meeting-to-capa', items:list }, '*'); }catch(e){}
  }
  // send what has changed since the last time (nothing is sent for issues that were never sent to CAPA)
  function syncCapa(){
    const out = [];
    state.requirements.forEach(r=>{
      if(!r.capa) return;
      const p = capaPayload(r), h = JSON.stringify(p);
      if(r.capa.hash !== h){ r.capa.hash = h; out.push(p); }
    });
    if(out.length){
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({ requirements: state.requirements, followups: state.followups, projects: state.projects, autoSeen: state.autoSeen })); }catch(e){}
      postCapa(out);
    }
  }
  // what the meeting has decided about flagged press risks, for the read-only "RCA" column in CAPA's Process Control Summary
  function publishStatus(){
    try{
      if(window.parent === window) return;
      const items = state.requirements.filter(r=>String(r.autoKey||'').indexOf('press:')===0)
        .map(r=>({ key:r.autoKey, issueId:r.issueId, rca:!!r.rcaRequired, code:(r.capa&&r.capa.code)||'' }));
      window.parent.postMessage({ type:'fitl-meeting-status', items }, '*');
    }catch(e){}
  }
  function capaBlock(r){
    if(r.capa && r.capa.code){
      const acts = (r.capa.actions||[]).map(x=>esc(x.code)).join(', ');
      return `<span class="pill solved" title="Sent to CAPA on ${esc(r.capa.sentAt||'')}">IN CAPA · ${esc(r.capa.code)}${acts?' · '+acts:''}</span>`;
    }
    if(r.capa) return `<span class="pill pending">SENT TO CAPA — WAITING FOR THE CODE</span>`;
    if(r.rcaRequired) return `<span class="pill pending" title="An issue marked for RCA goes to CAPA by itself when the RCA is finished">RCA IN PROGRESS · TO CAPA WHEN FINISHED</span>`;
    return `<button class="capa-btn" data-action="send-capa" data-id="${r.issueId}" title="Send to CAPA once the meeting has reviewed this issue">Send to CAPA</button>`;
  }
  function sendCapaClick(id){
    const r = state.requirements.find(x=>String(x.issueId)===String(id));
    if(!r || r.capa) return;
    const n = String(r.actionPlan||'').split(/\r?\n/).filter(s=>s.trim()).length;
    if(!confirm('Send issue #'+r.issueId+' to CAPA?\n\nIt becomes a new issue in CAPA (FIT/Q/RG-QA-10)'+(n?', its '+n+' action plan line'+(n===1?'':'s')+' go to the Action Plan (RG-QA-11)':'')+' and the follow-ups logged here go to the Follow-up table (RG-QA-12).\nSend it only after the meeting has reviewed it.')) return;
    r.capa = { sentAt: todayStr() };
    saveState(); render();
    notice('Issue #'+r.issueId+' sent to CAPA');
  }
  // CAPA answers with the issue code and the action plan codes
  function onCapaAck(items){
    let changed = false;
    items.forEach(it=>{
      const m = /^agenda:(\d+)$/.exec(it.key||''); if(!m) return;
      const r = state.requirements.find(x=>String(x.issueId)===m[1]); if(!r || !r.capa) return;
      const acts = (it.actions||[]).map(x=>({ key:x.key, code:x.code }));
      if(r.capa.code !== it.issueCode || JSON.stringify(r.capa.actions||[]) !== JSON.stringify(acts)){ r.capa.code = it.issueCode; r.capa.actions = acts; changed = true; }
    });
    if(changed){
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({ requirements: state.requirements, followups: state.followups, projects: state.projects, autoSeen: state.autoSeen })); }catch(e){}
      publishStatus(); render();
    }
  }
  // the RCA Workbench finished an analysis for an issue marked "RCA required": it goes to CAPA with its root causes
  function onRcaFinished(m){
    const k = /^agenda:(\d+)$/.exec(m.key||''); if(!k) return;
    const r = state.requirements.find(x=>String(x.issueId)===k[1]); if(!r) return;
    r.rcaResult = { at: todayStr(), causes: (m.causes||[]).map(c=>({ cause:c.cause||'', root:c.root||'' })) };
    if(!r.capa) r.capa = { sentAt: todayStr(), auto: true };
    saveState(); render();
    notice('RCA finished for issue #'+r.issueId+' — sent to CAPA with its root cause'+(r.rcaResult.causes.length===1?'':'s'));
  }

  // ---------- requirements raised automatically ----------
  // 1) a risk flagged in Press Monitoring, 2) the third repeated Not OK finding in the same area or item of the
  // Housekeeping check list. Each becomes a new requirement for the Weekly Management Meeting, once.
  const AUTO_WINDOW_DAYS = 30;   // older history is noted as seen but not raised
  function daysAgo(iso){ const t = new Date(iso + 'T00:00:00'); return (Date.now() - t.getTime()) / 864e5; }
  function riskReqs(shifts){
    const out = [];
    shifts.forEach(s => (s.risks || []).forEach(r => {
      const where = [r.stage, r.subStep].filter(Boolean).join(' › ');
      out.push({ key: 'press:' + s.key + ':' + [r.stage, r.subStep, r.failureMode, r.cause].join('|'), date: s.date, source: 'Press Monitoring',
        department: 'PRODUCTION', topicCategory: 'PRESS MONITORING', issueType: '05. Other',
        issueDescription: 'Press monitoring flagged: ' + (r.failureMode || where || 'a risk') + (r.cause ? ' — cause: ' + r.cause : '') + (where ? ' (' + where + ')' : ''),
        impact: 'Flagged unacceptable during press monitoring on ' + s.date + ', shift ' + (s.shiftCode || '') + (r.ap ? ', action priority ' + r.ap : '') + '.',
        actionRequired: '', name: s.controller || 'Press monitoring', responsibility: 'Production' });
    }));
    return out;
  }
  function notice(msg){
    let n = document.getElementById('autoNotice');
    if(!n){ n = document.createElement('div'); n.id = 'autoNotice'; n.style.cssText = 'position:fixed;right:18px;bottom:18px;background:#1d2127;color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;z-index:200;max-width:420px;box-shadow:0 6px 24px rgba(0,0,0,.25)'; document.body.appendChild(n); }
    n.textContent = msg; n.style.display = 'block'; clearTimeout(notice._t); notice._t = setTimeout(() => { n.style.display = 'none'; }, 6000);
  }
  let autoReady = false; const autoQueue = [];
  function importAuto(items){
    if(!autoReady){ autoQueue.push(items); return; }
    const seen = new Set(state.autoSeen), before = seen.size, by = {}; let added = 0;
    items.forEach(it => {
      if(!it || !it.key || seen.has(it.key)) return;
      seen.add(it.key);
      if(it.date && !it.manual && daysAgo(it.date) > AUTO_WINDOW_DAYS) return;   // old press shifts are skipped; anything a person sends on purpose is always raised
      state.requirements.push({ issueId: nextIssueId(), department: it.department || '', topicCategory: it.topicCategory || '', issueType: it.issueType || '', issueDescription: it.issueDescription || '', impact: it.impact || '', actionRequired: it.actionRequired || '', name: it.name || '', responsibility: it.responsibility || '', rcaRequired: false, autoKey: it.key, autoSource: it.source || '', autoDate: it.date || '' });
      added++; by[it.source || 'Other'] = (by[it.source || 'Other'] || 0) + 1;
    });
    if(seen.size !== before){ state.autoSeen = Array.from(seen); saveState(); }
    if(added){ render(); notice(added + ' new requirement' + (added === 1 ? '' : 's') + ' raised for the Weekly Management Meeting (' + Object.keys(by).map(k => by[k] + ' from ' + k).join(', ') + ')'); }
  }
  window.addEventListener('message', ev => {
    if(ev.source !== window.parent) return; const m = ev.data; if(!m) return;
    if(m.type === 'fitl-shifts' && Array.isArray(m.items)) importAuto(riskReqs(m.items));
    else if(m.type === 'fitl-wmm-requirements' && Array.isArray(m.items)) importAuto(m.items.map(i => Object.assign({ source: m.source || '' }, i)));
    else if(m.type === 'fitl-capa-ack' && Array.isArray(m.items)) onCapaAck(m.items);
    else if(m.type === 'fitl-rca-finished') onRcaFinished(m);
  });

  loadState().then(()=>{ render(); publishRca(); publishStatus(); syncCapa(); autoReady = true; autoQueue.splice(0).forEach(importAuto); try{ window.parent.postMessage({type:'fitl-agenda-ready'}, '*'); }catch(e){} });
})();
</script>
