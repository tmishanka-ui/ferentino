<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCA Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --canvas:#EEF0EA;
    --surface:#FFFFFF;
    --ink:#1B1D1B;
    --ink-soft:#5B5D57;
    --line:#DADCD3;
    --steel:#2E4057;
    --steel-dark:#1B2838;
    --amber:#D98E04;
    --amber-ink:#5C3B02;
    --amber-bg:#FBEBCB;
    --men:#B5502C;
    --men-bg:#F5E1D7;
    --men-ink:#6E2E15;
    --machine:#2E6E8E;
    --machine-bg:#DCEAF1;
    --machine-ink:#154356;
    --material:#4B7F52;
    --material-bg:#E1EDE0;
    --material-ink:#274A2B;
    --method:#6E5A9E;
    --method-bg:#E7E2F2;
    --method-ink:#3C305C;
    --good:#2F8F4E;
    --good-bg:#DEEEE2;
    --bad:#B23A34;
    --bad-bg:#F5DEDC;
    --pending:#C98A1D;
    --pending-bg:#F5E7CC;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--canvas);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    letter-spacing:0.01em;
    text-transform:uppercase;
    color:var(--steel-dark);
  }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  #app{ max-width:1180px; margin:0 auto; padding:28px 24px 80px; }

  /* ---- Top bar ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; margin-bottom:22px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:38px; height:38px; border-radius:8px; background:var(--steel-dark);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-mark svg{ width:22px; height:22px; }
  .brand h1{ font-size:24px; margin:0; line-height:1; }
  .brand p{ margin:2px 0 0; font-size:14px; color:var(--ink-soft); font-family:'Inter'; text-transform:none; letter-spacing:0; }

  .project-controls{ display:flex; align-items:center; gap:8px; }
  select, input[type=text], input[type=date], textarea{
    font-family:'Inter'; font-size:15px; color:var(--ink);
    border:1px solid var(--line); border-radius:7px; background:var(--surface);
    padding:8px 10px;
  }
  select:focus, input:focus, textarea:focus{ outline:2px solid var(--steel); outline-offset:1px; }
  button{
    font-family:'Inter'; font-size:15px; font-weight:500; cursor:pointer;
    border-radius:7px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); padding:8px 14px; transition:background .12s ease;
  }
  button:hover{ background:var(--canvas); }
  button.primary{ background:var(--steel); border-color:var(--steel); color:#fff; }
  button.primary:hover{ background:var(--steel-dark); }
  button.amber{ background:var(--amber); border-color:var(--amber); color:#3A2500; }
  button.amber:hover{ background:#C17F00; }
  button.ghost{ border-color:transparent; background:transparent; padding:6px 8px; }
  button.backup-btn{ background:var(--machine-bg); border-color:var(--machine); color:var(--machine-ink); padding:8px 10px; }
  button.backup-btn:hover{ background:var(--machine); color:#fff; }
  button.restore-btn{ background:var(--material-bg); border-color:var(--material); color:var(--material-ink); padding:8px 10px; }
  button.restore-btn:hover{ background:var(--material); color:#fff; }
  button.ghost:hover{ background:var(--canvas); }
  button.danger-ghost{ border-color:transparent; background:transparent; color:var(--bad); padding:6px 8px; }
  button.danger-ghost:hover{ background:var(--bad-bg); }
  button:disabled{ opacity:.45; cursor:not-allowed; }

  /* ---- Stepper ---- */
  .stepper{
    display:flex; gap:6px; margin-bottom:24px; border-bottom:2px solid var(--line);
    overflow-x:auto;
  }
  .step-btn{
    border:none; background:none; padding:10px 16px 12px; font-family:'Barlow Condensed';
    font-size:17px; font-weight:600; text-transform:uppercase; letter-spacing:.02em;
    color:var(--ink-soft); border-bottom:3px solid transparent; margin-bottom:-2px;
    white-space:nowrap; border-radius:0;
  }
  .step-btn:hover{ color:var(--ink); background:none; }
  .step-btn.active{ color:var(--steel-dark); border-bottom-color:var(--amber); }
  .step-num{
    display:inline-flex; align-items:center; justify-content:center;
    width:18px; height:18px; border-radius:50%; background:var(--line); color:var(--surface);
    font-size:13px; margin-right:6px; font-family:'Inter'; font-weight:600;
  }
  .step-btn.active .step-num{ background:var(--amber); color:#3A2500; }

  .panel{ display:none; }
  .panel.active{ display:block; }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 22px; margin-bottom:18px;
  }
  .card h2{ font-size:19px; margin:0 0 4px; }
  .card .hint{ font-size:14.5px; color:var(--ink-soft); margin:0 0 16px; font-family:'Inter'; }
  label.field-label{
    display:block; font-size:13.5px; font-weight:600; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.03em; margin-bottom:5px; font-family:'Inter';
  }
  .field{ margin-bottom:14px; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  textarea{ width:100%; resize:vertical; min-height:64px; font-size:16px; line-height:1.5; }
  input[type=text]{ width:100%; }

  /* ---- Fishbone visual ---- */
  .spine-wrap{ overflow-x:auto; margin-bottom:6px; }
  .spine-wrap svg{ display:block; min-width:640px; }

  /* ---- Category grid ---- */
  .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:720px){ .cat-grid{ grid-template-columns:1fr; } .grid-2{ grid-template-columns:1fr; } }
  .cat-card{ border-radius:var(--radius); padding:16px 16px 14px; border:1px solid var(--line); }
  .cat-card.men{ background:var(--men-bg); }
  .cat-card.machine{ background:var(--machine-bg); }
  .cat-card.material{ background:var(--material-bg); }
  .cat-card.method{ background:var(--method-bg); }
  .cat-title{
    font-family:'Barlow Condensed'; font-weight:700; font-size:18px; text-transform:uppercase;
    margin:0 0 10px; display:flex; align-items:center; gap:8px;
  }
  .cat-title .dot{ width:10px; height:10px; border-radius:50%; }
  .men .dot{ background:var(--men); } .men .cat-title{ color:var(--men-ink); }
  .machine .dot{ background:var(--machine); } .machine .cat-title{ color:var(--machine-ink); }
  .material .dot{ background:var(--material); } .material .cat-title{ color:var(--material-ink); }
  .method .dot{ background:var(--method); } .method .cat-title{ color:var(--method-ink); }

  .cause-item{
    background:var(--surface); border:1px solid rgba(0,0,0,0.08); border-radius:8px;
    padding:9px 11px; margin-bottom:8px; font-size:15.5px; line-height:1.4;
  }
  .cause-item .cause-top{ display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .cause-item .cause-text{ flex:1; }
  .cause-text-input{
    flex:1; border:1px solid transparent; background:transparent; padding:2px 4px;
    font-family:'Inter'; font-size:15.5px; line-height:1.4; color:var(--ink); border-radius:5px;
    min-width:0;
  }
  .cause-text-input:hover{ border-color:var(--line); }
  .cause-text-input:focus{ border-color:var(--steel); background:var(--surface); outline:none; }
  .cause-meta{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .badge{
    font-size:12.5px; font-weight:600; padding:2px 8px; border-radius:20px;
    text-transform:uppercase; letter-spacing:.02em; font-family:'Inter';
  }
  .badge.new{ background:var(--line); color:var(--ink-soft); }
  .badge.confirmed{ background:var(--good-bg); color:var(--good); }
  .badge.rejected{ background:var(--bad-bg); color:var(--bad); }
  .badge.pending{ background:var(--pending-bg); color:var(--pending); }
  .badge.analyzed{ background:var(--amber-bg); color:var(--amber-ink); }

  .add-row{ display:flex; gap:6px; margin-top:8px; }
  .add-row input{ flex:1; background:var(--surface); font-size:15px; }

  /* ---- Validation table ---- */
  table{ width:100%; border-collapse:collapse; font-size:15.5px; }
  th{
    text-align:left; font-family:'Inter'; font-size:13px; font-weight:600; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.03em; padding:8px 8px; border-bottom:1px solid var(--line);
  }
  td{ padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  td input[type=text], td input[type=number]{ width:100%; font-size:15px; padding:6px 8px; }
  select.status-select{ font-size:14.5px; padding:5px 8px; }
  .num-input{ width:64px !important; }

  .empty{
    text-align:center; padding:36px 20px; color:var(--ink-soft); font-size:15.5px;
  }
  .empty .ti{ font-size:28px; display:block; margin-bottom:8px; opacity:.5; }

  /* ---- Five whys ---- */
  .why-chain{ display:flex; flex-direction:column; gap:10px; }
  .why-row{ display:flex; gap:12px; align-items:flex-start; }
  .why-num{
    width:26px; height:26px; border-radius:50%; background:var(--steel); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600;
    flex-shrink:0; margin-top:4px; font-family:'Inter';
  }
  .why-row:last-child .why-num{ background:var(--amber); color:#3A2500; }
  .why-row textarea{ flex:1; min-height:44px; }
  .cause-picker{ display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }

  /* ---- Action plan ---- */
  .status-pill{ display:inline-block; padding:4px 10px; border-radius:20px; font-size:14px; font-weight:500; }

  /* ---- Summary ---- */
  .summary-block{ margin-bottom:22px; }
  .summary-block h3{ font-size:16px; margin:0 0 8px; }
  .kpi-row{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:6px; }
  .kpi{ background:var(--canvas); border-radius:8px; padding:12px 16px; min-width:120px; }
  .kpi .kpi-label{ font-size:13px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.02em; }
  .kpi .kpi-val{ font-family:'IBM Plex Mono'; font-size:22px; font-weight:500; margin-top:2px; }

  .toolbar{ display:flex; gap:8px; justify-content:flex-end; margin-bottom:14px; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
  .loading-msg{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:16px; }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--steel-dark); color:#fff; padding:9px 18px; border-radius:8px;
    font-size:15px; opacity:0; pointer-events:none; transition:opacity .25s ease;
    z-index:50;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div id="app">
  <div class="loading-msg" id="loading">Loading your RCA workspace…</div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // Outside Claude's artifact preview there is no window.storage, so cases would
  // never be saved. Fall back to the browser's localStorage with the same interface.
  if(!window.storage){
    try{
      window.storage = {
        get: function(k){ var v = localStorage.getItem("fitl-rca::" + k); return Promise.resolve(v === null ? null : { key:k, value:v }); },
        set: function(k, v){ localStorage.setItem("fitl-rca::" + k, v); return Promise.resolve({ key:k, value:v }); }
      };
    }catch(e){}
  }

  var STORAGE_KEY = "rca-workbench-data";
  var state = null;      // { activeId, projects: { id: project } }
  var version = null;
  var activeTab = "problem";

  var CATEGORIES = [
    { id:"men", label:"Men" },
    { id:"machine", label:"Machine" },
    { id:"material", label:"Material" },
    { id:"method", label:"Method" }
  ];

  var STEPS = [
    { id:"problem", label:"Problem" },
    { id:"fishbone", label:"Fishbone" },
    { id:"validate", label:"Validate" },
    { id:"whys", label:"5 Whys" },
    { id:"actions", label:"Actions" },
    { id:"summary", label:"Summary" }
  ];

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

  function defaultProject(name){
    return {
      id: uid(),
      name: name || "New RCA",
      createdAt: Date.now(),
      problem: { defect:"", statement:"", target:"" },
      causes: [],
      fiveWhys: {},
      actions: [],
      attachments: [],
      validationCriteria: ["Frequency","Scrap qty"]
    };
  }

  function normalizeState(){
    Object.keys(state.projects).forEach(function(id){
      var p = state.projects[id];
      if(!p.attachments) p.attachments = [];
      if(!p.fiveWhys) p.fiveWhys = {};
      if(!p.actions) p.actions = [];
      if(!p.causes) p.causes = [];
      if(!p.validationCriteria || !p.validationCriteria.length) p.validationCriteria = ["Frequency","Scrap qty"];
      p.causes.forEach(function(c){
        if(!c.scores){
          c.scores = {};
          if(c.frequency !== undefined){ c.scores["Frequency"] = c.frequency; delete c.frequency; }
          if(c.scrapCount !== undefined){ c.scores["Scrap qty"] = c.scrapCount; delete c.scrapCount; }
        }
      });
    });
  }

  function seedData(){
    var p = defaultProject("Pressure drop — July");
    p.problem = {
      defect: "Pressure drops (press defect)",
      statement: "Scrap tyre rate was about 0.6% in July, exceeding the 0.2% KPI target. Pressure drops accounted for 18 of the month's scrap tyres (15.5% of total scrap), tied for the largest single reason alongside deformed / under-filling tread.",
      target: "Reduce pressure-drop scrap to under 5% of total monthly scrap within one quarter."
    };
    var data = { activeId: p.id, projects: {} };
    data.projects[p.id] = p;
    return data;
  }

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._tm);
    toast._tm = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  function activeProject(){
    return state.projects[state.activeId];
  }

  var saveTimer = null;
  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 400);
  }

  function save(){
    if(!window.storage){ return; }
    window.storage.set(STORAGE_KEY, JSON.stringify(state), false).then(function(res){
      if(res && res.value !== undefined){
        // keep going, no version tracking needed for set-only flow
      }
    }).catch(function(err){
      console.error("Save failed", err);
      toast("Could not save — check connection");
    });
  }

  function load(){
    if(!window.storage){
      state = seedData();
      render();
      return;
    }
    window.storage.get(STORAGE_KEY, false).then(function(res){
      if(res && res.value){
        try{ state = JSON.parse(res.value); }
        catch(e){ state = seedData(); }
      } else {
        state = seedData();
      }
      normalizeState();
      render();
    }).catch(function(){
      state = seedData();
      normalizeState();
      render();
    });
  }

  /* ---------------- render root ---------------- */

  /* ---------------- imports from other tabs ---------------- */
  // Press Monitoring flagged risks and Management Agenda "RCA required" issues arrive
  // here (via the host page). Each becomes its own case, once — keyed so re-sends are ignored.
  var pendingImports = [];
  function mergeCandidates(items){
    if(!state.imported) state.imported = {};
    var added = 0, fromPress = 0, fromAgenda = 0, fromCapa = 0;
    items.forEach(function(it){
      if(!it || !it.key || state.imported[it.key]) return;
      var p = defaultProject(it.name);
      p.problem = { defect: it.defect || "", statement: it.statement || "", target: it.target || "" };
      p.source = { type: it.source, key: it.key };
      state.projects[p.id] = p;
      state.imported[it.key] = p.id;
      added++;
      if(it.source === "press") fromPress++; else if(it.source === "capa") fromCapa++; else fromAgenda++;
    });
    if(added){
      scheduleSave();
      var parts = [];
      if(fromPress) parts.push(fromPress + " from Press Monitoring");
      if(fromAgenda) parts.push(fromAgenda + " from Management Agenda");
      if(fromCapa) parts.push(fromCapa + " from CAPA");
      toast(added + " new RCA case" + (added === 1 ? "" : "s") + " added (" + parts.join(", ") + ")");
    }
    return added;
  }
  function importCandidates(items){
    if(!state){ pendingImports = pendingImports.concat(items); return; }
    if(mergeCandidates(items)) render();
  }
  window.addEventListener("message", function(ev){
    if(ev.source !== window.parent) return;
    var m = ev.data;
    if(m && (m.type === "fitl-rca-candidates" || m.type === "fitl-rca-import") && Array.isArray(m.items)) importCandidates(m.items);
  });


  /* ---------------- remove / manage cases ---------------- */
  var SOURCE_LABEL = { press:"Press Monitoring", agenda:"Management Agenda", capa:"CAPA" };
  function caseSource(p){ return p.source && SOURCE_LABEL[p.source.type] ? SOURCE_LABEL[p.source.type] : "Created here"; }
  // Removed cases stay recorded in state.imported, so an automatic feed never brings them back.
  function removeCases(ids){
    ids.forEach(function(id){ delete state.projects[id]; });
    var left = Object.keys(state.projects);
    if(!left.length){
      var blank = defaultProject("New RCA");
      state.projects[blank.id] = blank;
      left = [blank.id];
    }
    if(!state.projects[state.activeId]) state.activeId = left[0];
    scheduleSave();
    render();
    toast(ids.length + " case" + (ids.length === 1 ? "" : "s") + " removed");
  }
  function openManageCases(){
    var old = document.getElementById("manageVeil"); if(old) old.remove();
    var veil = document.createElement("div");
    veil.id = "manageVeil";
    veil.style.cssText = "position:fixed;inset:0;background:rgba(27,40,56,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;";
    var box = document.createElement("div");
    box.style.cssText = "background:#fff;border-radius:12px;width:min(720px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);";
    veil.appendChild(box);
    var filter = "all", picked = {};
    function visible(){
      return Object.keys(state.projects).filter(function(id){
        var p = state.projects[id];
        return filter === "all" || caseSource(p) === filter;
      });
    }
    function draw(){
      var ids = visible();
      var sources = ["all"].concat(Array.from(new Set(Object.keys(state.projects).map(function(id){ return caseSource(state.projects[id]); }))));
      var nPicked = Object.keys(picked).filter(function(id){ return picked[id] && state.projects[id]; }).length;
      var h = '<div style="padding:18px 22px 10px"><h2 style="margin:0 0 4px;font-size:24px">Manage cases</h2>' +
        '<div style="color:var(--ink-soft);font-size:13px">' + Object.keys(state.projects).length + ' cases. Tick the ones you do not need and remove them. Removed cases are not brought back by the automatic feeds.</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">' +
        sources.map(function(s){ return '<button data-f="' + s + '" style="' + (s === filter ? "background:var(--steel);color:#fff;border-color:var(--steel);" : "") + '">' + (s === "all" ? "All" : s) + '</button>'; }).join("") + '</div></div>' +
        '<div style="overflow:auto;padding:0 22px;flex:1;border-top:1px solid var(--line);border-bottom:1px solid var(--line)">' +
        (ids.length ? ids.map(function(id){
          var p = state.projects[id];
          return '<label style="display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer">' +
            '<input type="checkbox" data-id="' + id + '"' + (picked[id] ? " checked" : "") + ' style="width:17px;height:17px">' +
            '<span style="flex:1;min-width:0"><span style="display:block;font-weight:500">' + escapeHtmlSafe(p.name || "Untitled RCA") + '</span>' +
            '<span style="display:block;font-size:12px;color:var(--ink-soft)">' + caseSource(p) + (id === state.activeId ? " · open now" : "") + '</span></span>' +
            '<button data-open="' + id + '" style="font-size:12px;padding:3px 10px">Open</button></label>';
        }).join("") : '<div style="padding:30px 0;text-align:center;color:var(--ink-soft)">No cases here.</div>') + '</div>' +
        '<div style="padding:14px 22px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
        '<button data-all="1">Select all shown</button><button data-none="1">Clear</button><span style="flex:1"></span>' +
        '<button data-close="1">Close</button>' +
        '<button data-remove="1" style="background:var(--bad);border-color:var(--bad);color:#fff"' + (nPicked ? "" : " disabled") + '>Remove selected (' + nPicked + ')</button></div>';
      box.innerHTML = h;
      Array.prototype.forEach.call(box.querySelectorAll("[data-f]"), function(b){ b.onclick = function(){ filter = b.getAttribute("data-f"); draw(); }; });
      Array.prototype.forEach.call(box.querySelectorAll("input[data-id]"), function(c){ c.onchange = function(){ picked[c.getAttribute("data-id")] = c.checked; draw(); }; });
      Array.prototype.forEach.call(box.querySelectorAll("[data-open]"), function(b){ b.onclick = function(e){ e.preventDefault(); state.activeId = b.getAttribute("data-open"); scheduleSave(); veil.remove(); render(); }; });
      box.querySelector("[data-all]").onclick = function(){ visible().forEach(function(id){ picked[id] = true; }); draw(); };
      box.querySelector("[data-none]").onclick = function(){ picked = {}; draw(); };
      box.querySelector("[data-close]").onclick = function(){ veil.remove(); };
      box.querySelector("[data-remove]").onclick = function(){
        var ids2 = Object.keys(picked).filter(function(id){ return picked[id] && state.projects[id]; });
        if(!ids2.length) return;
        if(!confirm("Remove " + ids2.length + " case" + (ids2.length === 1 ? "" : "s") + "? This cannot be undone.")) return;
        removeCases(ids2); picked = {}; draw();
      };
    }
    veil.addEventListener("mousedown", function(e){ if(e.target === veil) veil.remove(); });
    document.body.appendChild(veil);
    draw();
  }

  function downloadBackup(){
    var blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "rca-workbench-backup_" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast("Backup downloaded");
  }

  function uploadBackup(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var parsed;
      try{ parsed = JSON.parse(e.target.result); }
      catch(err){ toast("Could not read that file"); return; }
      if(!parsed || typeof parsed.projects !== "object" || !parsed.projects){
        toast("That file doesn't look like a valid backup");
        return;
      }
      if(!confirm("Restoring this backup will replace everything currently in the app. Continue?")) return;
      state = parsed;
      if(!state.activeId || !state.projects[state.activeId]){
        var ids = Object.keys(state.projects);
        state.activeId = ids.length ? ids[0] : null;
      }
      if(!state.activeId){ state = seedData(); }
      normalizeState();
      scheduleSave();
      render();
      toast("Backup restored");
    };
    reader.onerror = function(){ toast("Could not read that file"); };
    reader.readAsText(file);
  }

  /* ---------------- stepper ---------------- */

  function renderStepper(){
    var wrap = document.createElement("div");
    wrap.className = "stepper";
    STEPS.forEach(function(s, i){
      var btn = document.createElement("button");
      btn.className = "step-btn" + (activeTab === s.id ? " active" : "");
      btn.innerHTML = '<span class="step-num">' + (i+1) + '</span>' + s.label;
      btn.addEventListener("click", function(){ setTab(s.id); });
      wrap.appendChild(btn);
    });
    return wrap;
  }

  /* ---------------- causes status pipeline ---------------- */

  function causeStatusBadge(c){
    if(c.validation === "confirmed"){
      if(c.actionAdded) return {cls:"analyzed", label:"Action planned"};
      if(fiveWhysComplete(c.id)) return {cls:"analyzed", label:"Root cause found"};
      return {cls:"confirmed", label:"Confirmed"};
    }
    if(c.validation === "rejected") return {cls:"rejected", label:"Rejected"};
    if(c.validation === "pending") return {cls:"pending", label:"Reviewing"};
    return {cls:"new", label:"New"};
  }

  function fiveWhysComplete(causeId){
    var p = activeProject();

  function readImageResized(file, callback){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxW = 900;
        var scale = Math.min(1, maxW / img.width);
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        callback(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = function(){ toast("Could not read that image"); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ toast("Could not read that file"); };
    reader.readAsDataURL(file);
  }

  function renderSpineSVG(p){
    var div = document.createElement("div");
    div.className = "spine-wrap";
    var counts = {};
    CATEGORIES.forEach(function(c){ counts[c.id] = p.causes.filter(function(x){return x.category===c.id;}).length; });
    var colors = { men:"var(--men)", machine:"var(--machine)", material:"var(--material)", method:"var(--method)" };
    div.innerHTML =
    '<svg viewBox="0 0 640 190" role="img" aria-label="Fishbone diagram with four cause categories feeding into the problem">' +
      '<title>Fishbone diagram</title>' +
      '<line x1="70" y1="95" x2="520" y2="95" stroke="var(--ink-soft)" stroke-width="2"/>' +
      '<polygon points="520,95 500,85 500,105" fill="var(--ink-soft)"/>' +
      branchSVG(120, 95, 60, -1, "men", "Men", counts.men, colors.men) +
      branchSVG(260, 95, 60, -1, "machine", "Machine", counts.machine, colors.machine) +
      branchSVG(120, 95, 60, 1, "material", "Material", counts.material, colors.material) +
      branchSVG(260, 95, 60, 1, "method", "Method", counts.method, colors.method) +
      '<rect x="525" y="70" width="105" height="50" rx="8" fill="var(--amber-bg)" stroke="var(--amber)"/>' +
      '<text x="577" y="91" text-anchor="middle" font-family="Barlow Condensed" font-size="14" font-weight="700" fill="var(--amber-ink)">PROBLEM</text>' +
      '<text x="577" y="107" text-anchor="middle" font-family="Inter" font-size="10" fill="var(--amber-ink)">' + escapeXML(truncate(p.problem.defect || "Not defined", 20)) + '</text>' +
    '</svg>';
    return div;
  }

  function branchSVG(x, y, len, dir, id, label, count, color){
    var y2 = y + dir * len * 0.55;
    var lx = x - 6;
    var ly = dir === -1 ? y2 - 10 : y2 + 22;
    return '<line x1="' + x + '" y1="' + y + '" x2="' + x + '" y2="' + y2 + '" stroke="' + color + '" stroke-width="2.5"/>' +
      '<circle cx="' + x + '" cy="' + y2 + '" r="4" fill="' + color + '"/>' +
      '<text x="' + lx + '" y="' + ly + '" text-anchor="middle" font-family="Barlow Condensed" font-size="14" font-weight="700" fill="' + color + '">' + label.toUpperCase() + '</text>' +
      '<text x="' + lx + '" y="' + (ly + (dir===-1?12:-12)) + '" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" fill="var(--ink-soft)">' + count + ' cause' + (count===1?'':'s') + '</text>';
  }

  function truncate(s, n){ return s.length > n ? s.slice(0,n-1) + "\u2026" : s; }
  function escapeXML(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

    var wrap = document.createElement("div");

        tdText.textContent = c.text;

        tdCat.textContent = catObj ? catObj.label : c.category;

        p.validationCriteria.forEach(function(crit){
          var td = document.createElement("td");
          var input = document.createElement("input");
          input.type = "number"; input.min = "0"; input.className = "num-input";
          input.value = c.scores[crit] || "";

          tr.appendChild(td);

        tr.appendChild(tdScore);

        var tdStatus = document.createElement("td");
        var sel = document.createElement("select");
        sel.className = "status-select";
        [["new","New"],["pending","Reviewing"],["confirmed","Confirmed"],["rejected","Rejected"]].forEach(function(o){
          var opt = document.createElement("option");
          opt.value = o[0]; opt.textContent = o[1];
          if(c.validation === o[0]) opt.selected = true;
          sel.appendChild(opt);
        });
        sel.addEventListener("change", function(){ c.validation = sel.value; scheduleSave(); render(); });
        tdStatus.appendChild(sel);
        tr.appendChild(tdStatus);

        var tdBadge = document.createElement("td");
        var b = causeStatusBadge(c);
        var badge = document.createElement("span");
        badge.className = "badge " + b.cls;
        badge.textContent = b.label;
        tdBadge.appendChild(badge);
        tr.appendChild(tdBadge);

        tbody.appendChild(tr);
      });

  function renderCriteriaEditor(p){
    var wrap = document.createElement("div");
    wrap.style.cssText = "background:var(--canvas);border-radius:8px;padding:10px 12px;margin-bottom:16px;";

    var label = document.createElement("div");
    label.className = "field-label";
    label.style.marginBottom = "8px";
    label.textContent = "Validation criteria for this RCA";
    wrap.appendChild(label);

    var chipRow = document.createElement("div");
    chipRow.style.cssText = "display:flex;flex-wrap:wrap;gap:8px;align-items:center;";

    p.validationCriteria.forEach(function(crit){
      var chip = document.createElement("span");
      chip.style.cssText = "display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px 6px 5px 12px;font-size:14.5px;";
      chip.textContent = crit;
      var x = document.createElement("button");
      x.className = "ghost";
      x.style.cssText = "padding:2px 6px;border-radius:50%;line-height:1;";
      x.innerHTML = '<i class="ti ti-x" style="font-size:14px;"></i>';
      x.title = "Remove criterion";
      x.addEventListener("click", function(){
        if(p.validationCriteria.length <= 1){ toast("Keep at least one criterion"); return; }
        p.validationCriteria = p.validationCriteria.filter(function(c){ return c !== crit; });
        p.causes.forEach(function(c){ if(c.scores) delete c.scores[crit]; });
        scheduleSave(); render();
      });
      chip.appendChild(x);
      chipRow.appendChild(chip);
    });

    var addWrap = document.createElement("span");
    addWrap.style.cssText = "display:inline-flex;gap:6px;";
    var input = document.createElement("input");
    input.type = "text";
    input.placeholder = "e.g. Severity, Cost impact";
    input.style.cssText = "width:170px;font-size:14.5px;padding:6px 10px;";
    var addBtn = document.createElement("button");
    addBtn.textContent = "+ Add criterion";
    function doAdd(){
      var v = input.value.trim();
      if(!v) return;
      var exists = p.validationCriteria.some(function(c){ return c.toLowerCase() === v.toLowerCase(); });
      if(exists){ toast("That criterion already exists"); return; }
      p.validationCriteria.push(v);
      input.value = "";
      scheduleSave(); render();
    }
    addBtn.addEventListener("click", doAdd);
    input.addEventListener("keydown", function(e){ if(e.key === "Enter") doAdd(); });
    addWrap.appendChild(input);
    addWrap.appendChild(addBtn);
    chipRow.appendChild(addWrap);

    wrap.appendChild(chipRow);

    var removeRow = document.createElement("div");
    removeRow.style.cssText = "display:flex;align-items:center;gap:8px;margin-top:10px;";
    var removeLabel = document.createElement("span");
    removeLabel.style.cssText = "font-size:12.5px;color:var(--ink-soft);";
    removeLabel.textContent = "Remove a criterion:";
    var removeSel = document.createElement("select");
    removeSel.style.fontSize = "14.5px";
    p.validationCriteria.forEach(function(crit){
      var opt = document.createElement("option");
      opt.value = crit; opt.textContent = crit;
      removeSel.appendChild(opt);
    });
    var removeBtn = document.createElement("button");
    removeBtn.textContent = "Remove criterion";
    removeBtn.addEventListener("click", function(){
      var crit = removeSel.value;
      if(!crit) return;
      if(p.validationCriteria.length <= 1){ toast("Keep at least one criterion"); return; }
      p.validationCriteria = p.validationCriteria.filter(function(c){ return c !== crit; });
      p.causes.forEach(function(c){ if(c.scores) delete c.scores[crit]; });
      scheduleSave(); render();
    });
    removeRow.appendChild(removeLabel);
    removeRow.appendChild(removeSel);
    removeRow.appendChild(removeBtn);
    wrap.appendChild(removeRow);

    return wrap;
  }

  /* ---------------- 4. FIVE WHYS PANEL ---------------- */

  function renderWhysPanel(){
    var wrap = document.createElement("div");
    var p = activeProject();
    var confirmed = p.causes.filter(function(c){ return c.validation === "confirmed"; });

    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML = '<h2>Five whys</h2><p class="hint">Pick a confirmed cause and drill down. Stop once the answer points to something the team can act on.</p>';

    if(confirmed.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.innerHTML = '<i class="ti ti-shield-check"></i>Confirm at least one cause in Validate before starting 5 Whys.';
      card.appendChild(empty);
      wrap.appendChild(card);
      return wrap;
    }

    var picker = document.createElement("div");
    picker.className = "cause-picker";
    var label = document.createElement("label");
    label.className = "field-label";
    label.style.marginBottom = "0";
    label.textContent = "Confirmed cause";
    var sel = document.createElement("select");
    confirmed.forEach(function(c){
      var opt = document.createElement("option");
      opt.value = c.id;
      opt.textContent = c.text;
      sel.appendChild(opt);
    });
    if(!renderWhysPanel._selected || confirmed.indexOf(causeById(renderWhysPanel._selected)) === -1){
      renderWhysPanel._selected = confirmed[0].id;
    }
    sel.value = renderWhysPanel._selected;
    sel.addEventListener("change", function(){
      renderWhysPanel._selected = sel.value;
      render();
    });
    picker.appendChild(label);
    picker.appendChild(sel);
    card.appendChild(picker);

    var causeId = renderWhysPanel._selected;
    if(!p.fiveWhys[causeId]) p.fiveWhys[causeId] = ["","","","",""];
    var chain = p.fiveWhys[causeId];

    var chainDiv = document.createElement("div");
    chainDiv.className = "why-chain";
    for(var i=0;i<5;i++){
      (function(idx){
        var row = document.createElement("div");
        row.className = "why-row";
        var num = document.createElement("div");
        num.className = "why-num";
        num.textContent = idx+1;
        row.appendChild(num);
        var ta = document.createElement("textarea");
        ta.placeholder = idx === 0 ? "Why did this happen?" : "Why did that happen?";
        ta.value = chain[idx] || "";
        ta.addEventListener("input", function(){
          chain[idx] = ta.value;
          scheduleSave();
        });
        row.appendChild(ta);
        chainDiv.appendChild(row);
      })(i);
    }
    card.appendChild(chainDiv);
    wrap.appendChild(card);

    var nextCard = document.createElement("div");
    nextCard.style.textAlign = "right";
    var nextBtn = document.createElement("button");
    nextBtn.className = "primary";
    nextBtn.innerHTML = "Continue to action plan &rarr;";
    nextBtn.addEventListener("click", function(){ setTab("actions"); });
    nextCard.appendChild(nextBtn);
    wrap.appendChild(nextCard);

    return wrap;
  }

  function causeById(id){
    var p = activeProject();
    return p.causes.filter(function(c){ return c.id === id; })[0];
  }

  /* ---------------- 5. ACTIONS PANEL ---------------- */

  var STATUS_STYLES = {
    "not-started": { bg:"var(--line)", fg:"var(--ink-soft)", label:"Not started" },
    "in-progress": { bg:"var(--pending-bg)", fg:"var(--pending)", label:"In progress" },
    "done": { bg:"var(--good-bg)", fg:"var(--good)", label:"Done" }
  };

  function renderActionsPanel(){
    var wrap = document.createElement("div");
    var p = activeProject();
    var confirmed = p.causes.filter(function(c){ return c.validation === "confirmed"; });

    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML = '<h2>Corrective action plan</h2><p class="hint">Turn each confirmed root cause into an owned action with a due date and a way to verify it worked.</p>';

    if(confirmed.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.innerHTML = '<i class="ti ti-clipboard-list"></i>Confirm a cause first, then plan the action here.';
      card.appendChild(empty);
      wrap.appendChild(card);
      return wrap;
    }

    var addWrap = document.createElement("div");
    addWrap.style.cssText = "display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;";
    var causeSel = document.createElement("select");
    confirmed.forEach(function(c){
      var opt = document.createElement("option");
      opt.value = c.id;
      opt.textContent = c.text;
      causeSel.appendChild(opt);
    });
    var addBtn = document.createElement("button");
    addBtn.className = "amber";
    addBtn.textContent = "+ Add action for selected cause";
    addBtn.addEventListener("click", function(){
      var cause = causeById(causeSel.value);
      var chain = p.fiveWhys[causeSel.value];
      var rootCauseText = (chain && chain[4]) ? chain[4] : "";
      p.actions.push({
        id: uid(), causeId: causeSel.value, rootCause: rootCauseText,
        action:"", owner:"", dueDate:"", verification:"", status:"not-started"
      });
      cause.actionAdded = true;
      scheduleSave();
      render();
    });
    addWrap.appendChild(causeSel);
    addWrap.appendChild(addBtn);
    card.appendChild(addWrap);

    if(p.actions.length === 0){
      var empty2 = document.createElement("div");
      empty2.className = "empty";
      empty2.innerHTML = '<i class="ti ti-checklist"></i>No actions yet — add one above.';
      card.appendChild(empty2);
    } else {
      p.actions.forEach(function(a){
        card.appendChild(renderActionCard(a));
      });
    }

    wrap.appendChild(card);

    var nextCard = document.createElement("div");
    nextCard.style.textAlign = "right";
    var nextBtn = document.createElement("button");
    nextBtn.className = "primary";
    nextBtn.innerHTML = "View summary &rarr;";
    nextBtn.addEventListener("click", function(){ setTab("summary"); });
    nextCard.appendChild(nextBtn);
    wrap.appendChild(nextCard);

    return wrap;
  }

  function renderActionCard(a){
    var p = activeProject();
    var cause = causeById(a.causeId);
    var div = document.createElement("div");
    div.style.cssText = "border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:12px;background:var(--canvas);";

    var head = document.createElement("div");
    head.style.cssText = "display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px;";
    var title = document.createElement("div");
    title.style.cssText = "font-size:15.5px;font-weight:500;";
    title.textContent = cause ? cause.text : "(cause removed)";
    head.appendChild(title);
    var del = document.createElement("button");
    del.className = "danger-ghost";
    del.style.cssText = "display:flex;align-items:center;gap:4px;flex-shrink:0;";
    del.innerHTML = '<i class="ti ti-x"></i> Remove';
    del.title = "Remove this action plan";
    del.addEventListener("click", function(){
      if(!confirm("Remove this action plan?")) return;
      p.actions = p.actions.filter(function(x){ return x.id !== a.id; });
      scheduleSave();
      render();
    });
    head.appendChild(del);
    div.appendChild(head);

    if(a.rootCause){
      var rc = document.createElement("div");
      rc.style.cssText = "font-size:14px;color:var(--ink-soft);margin-bottom:10px;font-style:italic;";
      rc.textContent = "Root cause: " + a.rootCause;
      div.appendChild(rc);
    }

    var grid = document.createElement("div");
    grid.className = "grid-2";
    grid.appendChild(smallField("Action", a.action, function(v){ a.action=v; scheduleSave(); }));
    grid.appendChild(smallField("Owner", a.owner, function(v){ a.owner=v; scheduleSave(); }));
    div.appendChild(grid);

    var grid2 = document.createElement("div");
    grid2.className = "grid-2";
    var dueDiv = document.createElement("div");
    dueDiv.className = "field";
    var dueLabel = document.createElement("label");
    dueLabel.className = "field-label"; dueLabel.textContent = "Due date";
    var dueInput = document.createElement("input");
    dueInput.type = "date"; dueInput.value = a.dueDate || "";
    dueInput.addEventListener("input", function(){ a.dueDate = dueInput.value; scheduleSave(); });
    dueDiv.appendChild(dueLabel); dueDiv.appendChild(dueInput);
    grid2.appendChild(dueDiv);
    grid2.appendChild(smallField("Verification method", a.verification, function(v){ a.verification=v; scheduleSave(); }));
    div.appendChild(grid2);

    var statusDiv = document.createElement("div");
    statusDiv.style.cssText = "display:flex;align-items:center;gap:8px;margin-top:4px;";
    var statusLabel = document.createElement("span");
    statusLabel.className = "field-label"; statusLabel.style.marginBottom = "0";
    statusLabel.textContent = "Status";
    var statusSel = document.createElement("select");
    statusSel.className = "status-select";
    Object.keys(STATUS_STYLES).forEach(function(k){
      var opt = document.createElement("option");
      opt.value = k; opt.textContent = STATUS_STYLES[k].label;
      if(a.status === k) opt.selected = true;
      statusSel.appendChild(opt);
    });
    statusSel.addEventListener("change", function(){ a.status = statusSel.value; scheduleSave(); render(); });
    statusDiv.appendChild(statusLabel);
    statusDiv.appendChild(statusSel);
    var pill = document.createElement("span");
    var st = STATUS_STYLES[a.status];
    pill.className = "status-pill";
    pill.style.background = st.bg; pill.style.color = st.fg;
    pill.textContent = st.label;
    statusDiv.appendChild(pill);
    div.appendChild(statusDiv);

  function smallField(label, value, onChange){
    var div = document.createElement("div");
    div.className = "field";
    div.style.marginBottom = "8px";
    var l = document.createElement("label");
    l.className = "field-label";
    l.textContent = label;
    div.appendChild(l);
    var input = document.createElement("input");
    input.type = "text";
    input.value = value || "";
    input.addEventListener("input", function(){ onChange(input.value); });
    div.appendChild(input);
    return div;
  }

  /* ---------------- 6. SUMMARY PANEL ---------------- */

  function renderSummaryPanel(){
    var wrap = document.createElement("div");
    var p = activeProject();

    var toolbar = document.createElement("div");
    toolbar.className = "toolbar";
    var copyBtn = document.createElement("button");
    copyBtn.innerHTML = '<i class="ti ti-copy"></i> Copy as text';
    copyBtn.addEventListener("click", function(){
      var text = buildReportText(p);
      if(navigator.clipboard){
        navigator.clipboard.writeText(text).then(function(){ toast("Report copied"); })
          .catch(function(){ toast("Copy failed"); });
      }
    });
    var printBtn = document.createElement("button");
    printBtn.innerHTML = '<i class="ti ti-printer"></i> Print';
    printBtn.addEventListener("click", function(){ window.print(); });
    var pdfBtn = document.createElement("button");
    pdfBtn.className = "primary";
    pdfBtn.innerHTML = '<i class="ti ti-file-download"></i> Download PDF';
    pdfBtn.addEventListener("click", function(){ downloadPDF(p); });
    toolbar.appendChild(copyBtn);
    toolbar.appendChild(printBtn);
    toolbar.appendChild(pdfBtn);
    wrap.appendChild(toolbar);

    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML = '<h2>' + escapeXML(p.name) + '</h2>';

    var confirmed = p.causes.filter(function(c){ return c.validation === "confirmed"; });
    var rejected = p.causes.filter(function(c){ return c.validation === "rejected"; });
    var withRoot = confirmed.filter(function(c){ return fiveWhysComplete(c.id); });

    var kpis = document.createElement("div");
    kpis.className = "kpi-row";
    kpis.appendChild(kpi("Causes logged", p.causes.length));
    kpis.appendChild(kpi("Confirmed", confirmed.length));
    kpis.appendChild(kpi("Root causes found", withRoot.length));
    kpis.appendChild(kpi("Actions planned", p.actions.length));
    card.appendChild(kpis);

    // a case that came from the weekly management meeting is finished here: the issue then goes to CAPA by itself
    var finKey = (p.source && p.source.type === "agenda") ? p.source.key : "";
    if(finKey){
      var fin = document.createElement("div");
      fin.className = "summary-block";
      var done = !!p.finishedAt;
      fin.innerHTML = '<h3>Finish the RCA</h3><p style="font-size:14.5px;line-height:1.55;margin:0 0 10px;">' +
        (done ? 'Finished on ' + new Date(p.finishedAt).toLocaleDateString() + ' — the issue and its root cause' + (withRoot.length === 1 ? '' : 's') + ' were sent to CAPA. If you change the root causes, send the update below.'
              : 'This case was raised at the Weekly Management Meeting. When the analysis is complete, finish it here: the issue then goes to CAPA by itself (Issues & Root Causes, FIT/Q/RG-QA-10) with the root causes found.') + '</p>';
      var fb = document.createElement("button");
      fb.className = "primary";
      fb.innerHTML = '<i class="ti ti-send"></i> ' + (done ? 'Send the updated root causes to CAPA' : 'Finish RCA and send to CAPA');
      fb.disabled = withRoot.length === 0;
      fb.addEventListener("click", function(){
        p.finishedAt = p.finishedAt || Date.now();
        scheduleSave();
        try{
          window.parent.postMessage({ type: "fitl-rca-finished", key: finKey, name: p.name,
            causes: withRoot.map(function(c){ var ch = p.fiveWhys[c.id] || []; return { cause: c.text, root: ch[4] || "", whys: ch.filter(Boolean) }; }) }, "*");
        }catch(e){}
        toast("RCA finished — sent to CAPA");
        render();
      });
      fin.appendChild(fb);
      if(withRoot.length === 0){
        var hint = document.createElement("p");
        hint.style.cssText = "font-size:13.5px;color:var(--ink-soft);margin:8px 0 0;";
        hint.textContent = "Needs at least one confirmed cause whose 5 Whys are complete (a root cause found).";
        fin.appendChild(hint);
      }
      card.appendChild(fin);
    }

    var pb = document.createElement("div");
    pb.className = "summary-block";
    pb.innerHTML = '<h3>Problem statement</h3><p style="font-size:15.5px;line-height:1.6;margin:0 0 6px;">' +
      (escapeXML(p.problem.statement) || '<span style="color:var(--ink-soft)">Not yet defined.</span>') + '</p>' +
      (p.problem.target ? '<p style="font-size:15px;color:var(--ink-soft);margin:0;"><strong>Target:</strong> ' + escapeXML(p.problem.target) + '</p>' : '');
    card.appendChild(pb);

    if(p.attachments.length){
      var atb = document.createElement("div");

      p.attachments.forEach(function(a){

          tName.style.cssText = "font-size:14.5px;font-weight:500;margin-bottom:6px;";
          tName.textContent = a.name;
          tWrap.appendChild(tName);
          var t = document.createElement("table");
          var thead = document.createElement("thead");

          a.headers.forEach(function(h){ var th=document.createElement("th"); th.textContent=h; htr.appendChild(th); });
          thead.appendChild(htr); t.appendChild(thead);
          var tbody = document.createElement("tbody");
          a.rows.forEach(function(row){
            var tr = document.createElement("tr");
            row.forEach(function(cell){ var td=document.createElement("td"); td.textContent=cell; tr.appendChild(td); });
            tbody.appendChild(tr);
          });
          t.appendChild(tbody);
          tWrap.appendChild(t);
          atb.appendChild(tWrap);
        } else {

          iWrap.style.marginBottom = "14px";
          var iName = document.createElement("div");
          iName.style.cssText = "font-size:14.5px;font-weight:500;margin-bottom:6px;";
          iName.textContent = a.name;
          iWrap.appendChild(iName);
          var img = document.createElement("img");
          img.src = a.dataUrl; img.alt = a.name;
          img.style.cssText = "max-width:100%;border-radius:6px;border:1px solid var(--line);";
          iWrap.appendChild(img);

    var cb = document.createElement("div");

        var root = chain && chain[4] ? chain[4] : null;
        var item = document.createElement("div");

        item.innerHTML = '<div style="font-size:15.5px;font-weight:500;">' + escapeXML(c.text) + '</div>' +
          (root ? '<div style="font-size:14.5px;color:var(--ink-soft);margin-top:2px;">Root cause: ' + escapeXML(root) + '</div>'
                : '<div style="font-size:14.5px;color:var(--pending);margin-top:2px;">5 Whys not yet completed</div>');
        cb.appendChild(item);
      });

    card.appendChild(cb);

    var ab = document.createElement("div");
    ab.className = "summary-block";

      ab.innerHTML += '<p style="font-size:15px;color:var(--ink-soft);">No actions added yet.</p>';
    } else {

      table.innerHTML = '<thead><tr><th>Action</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead>';
      var tbody = document.createElement("tbody");

        var tr = document.createElement("tr");

      });

    }
    card.appendChild(ab);

    if(rejected.length){

      rb.className = "summary-block";
      rb.innerHTML = '<h3>Rejected causes</h3><p style="font-size:14.5px;color:var(--ink-soft);">' +

      card.appendChild(rb);

    wrap.appendChild(card);
    return wrap;
  }

  function kpi(label, val){
    var div = document.createElement("div");
    div.className = "kpi";
    div.innerHTML = '<div class="kpi-label">' + label + '</div><div class="kpi-val">' + val + '</div>';
    return div;
  }

  function downloadPDF(p){
    if(!(window.jspdf && window.jspdf.jsPDF)){
      toast("PDF tools still loading \u2014 try again in a moment");
      return;
    }
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ unit:"pt", format:"a4" });
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var margin = 42;
    var maxW = pageW - margin*2;
    var y = 54;

    function ensureSpace(h){
      if(y + h > pageH - 44){ doc.addPage(); y = 54; }
    }
    function heading(text, size){
      ensureSpace(size + 14);
      doc.setFont("helvetica","bold"); doc.setFontSize(size); doc.setTextColor(27,40,56);
      doc.text(text, margin, y);
      y += size + 8;
    }
    function paragraph(text, size, color){
      size = size || 10;
      doc.setFont("helvetica","normal"); doc.setFontSize(size);
      doc.setTextColor((color&&color[0])||30, (color&&color[1])||30, (color&&color[2])||30);
      var lines = doc.splitTextToSize(text || "\u2014", maxW);
      lines.forEach(function(line){
        ensureSpace(size + 4);
        doc.text(line, margin, y);
        y += size + 4;
      });
      y += 4;
    }

    doc.setFont("helvetica","bold"); doc.setFontSize(20); doc.setTextColor(27,40,56);
    doc.text("Root cause analysis", margin, y); y += 24;
    doc.setFont("helvetica","normal"); doc.setFontSize(12); doc.setTextColor(95,95,95);
    doc.text(p.name || "Untitled RCA", margin, y); y += 26;

    heading("Problem statement", 13);
    paragraph(p.problem.statement || "Not yet defined.");
    if(p.problem.target){
      doc.setFont("helvetica","italic"); doc.setFontSize(10); doc.setTextColor(95,95,95);
      ensureSpace(16);
      doc.text(doc.splitTextToSize("Target: " + p.problem.target, maxW), margin, y);
      y += 20;
    }

    var tables = p.attachments.filter(function(a){ return a.type === "table"; });
    tables.forEach(function(t){
      heading(t.name || "Table", 12);
      doc.autoTable({
        startY: y, margin:{ left:margin, right:margin },
        head:[t.headers], body:t.rows,
        styles:{ fontSize:9, cellPadding:4 },
        headStyles:{ fillColor:[46,64,87] }
      });
      y = doc.lastAutoTable.finalY + 16;
    });

    heading("Fishbone \u2014 possible causes by category", 13);
    var CAT_LABELS = { men:"Men", machine:"Machine", material:"Material", method:"Method" };
    CATEGORIES.forEach(function(cat){
      var inCat = p.causes.filter(function(c){ return c.category === cat.id; });
      doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(46,64,87);
      ensureSpace(14);
      doc.text(cat.label, margin, y); y += 13;
      if(inCat.length === 0){
        paragraph("No causes logged.", 9.5, [130,130,130]);
      } else {
        inCat.forEach(function(c){
          doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(30,30,30);
          var statusLabel = causeStatusBadge(c).label;
          var lines = doc.splitTextToSize("\u2022 " + c.text + "  [" + statusLabel + "]", maxW - 10);
          lines.forEach(function(line){ ensureSpace(12); doc.text(line, margin + 10, y); y += 12; });
        });
      }
      y += 4;
    });

    if(p.causes.length){
      heading("Validation summary", 13);
      function causeScorePDF(c){
        return p.validationCriteria.reduce(function(sum, crit){ return sum + (Number((c.scores||{})[crit]) || 0); }, 0);
      }
      var vHead = ["Cause","Category"].concat(p.validationCriteria).concat(["Score","Status"]);
      var vBody = p.causes.slice().sort(function(a,b){ return causeScorePDF(b) - causeScorePDF(a); }).map(function(c){
        var row = [c.text, CAT_LABELS[c.category] || c.category];
        p.validationCriteria.forEach(function(crit){ row.push(String((c.scores||{})[crit] || "\u2014")); });
        row.push(String(causeScorePDF(c)));
        row.push(causeStatusBadge(c).label);
        return row;
      });
      doc.autoTable({
        startY: y, margin:{ left:margin, right:margin },
        head:[vHead], body: vBody,
        styles:{ fontSize:8.5, cellPadding:3.5 },
        headStyles:{ fillColor:[46,64,87] }
      });
      y = doc.lastAutoTable.finalY + 16;
    }

    var images = p.attachments.filter(function(a){ return a.type === "image"; });
    images.forEach(function(im){
      heading(im.name || "Chart", 12);
      var props;
      try{ props = doc.getImageProperties(im.dataUrl); } catch(e){ props = null; }
      if(props){
        var w = maxW;
        var h = (props.height / props.width) * w;
        if(h > 360){ h = 360; w = (props.width / props.height) * h; }
        ensureSpace(h + 10);
        doc.addImage(im.dataUrl, "JPEG", margin, y, w, h);
        y += h + 20;
      }
    });

    heading("Five whys \u2014 confirmed causes", 13);
    var confirmed = p.causes.filter(function(c){ return c.validation === "confirmed"; });
    if(confirmed.length === 0) paragraph("None confirmed yet.");
    confirmed.forEach(function(c){
      doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(20,20,20);
      ensureSpace(14);
      doc.text(doc.splitTextToSize("\u2022 " + c.text, maxW), margin, y);
      y += 14;
      var chain = p.fiveWhys[c.id];
      if(chain){
        chain.forEach(function(w, i){
          if(!w) return;
          doc.setFont("helvetica", i === 4 ? "bolditalic" : "italic");
          doc.setFontSize(9.5);
          doc.setTextColor(i === 4 ? 92 : 95, i === 4 ? 60 : 95, i === 4 ? 10 : 95);
          var lines = doc.splitTextToSize("Why " + (i+1) + ": " + w, maxW - 14);
          lines.forEach(function(line){ ensureSpace(13); doc.text(line, margin + 14, y); y += 13; });
        });
      } else {
        paragraph("5 Whys not started.", 9.5, [150,150,150]);
      }
      y += 4;
    });

    heading("Action plan", 13);
    if(p.actions.length === 0){
      paragraph("No actions added yet.");
    } else {
      var body = p.actions.map(function(a){
        return [a.action || "\u2014", a.owner || "\u2014", a.dueDate || "\u2014", STATUS_STYLES[a.status].label];
      });
      doc.autoTable({
        startY: y, margin:{ left:margin, right:margin },
        head:[["Action","Owner","Due","Status"]], body: body,
        styles:{ fontSize:9, cellPadding:4 },
        headStyles:{ fillColor:[46,64,87] }
      });
      y = doc.lastAutoTable.finalY + 16;
    }

    var rejected = p.causes.filter(function(c){ return c.validation === "rejected"; });
    if(rejected.length){
      heading("Rejected causes", 12);
      paragraph(rejected.map(function(c){ return c.text; }).join(", "));
    }

    var filename = (p.name || "RCA").replace(/[^a-z0-9]+/gi, "_") + "_report.pdf";
    doc.save(filename);
    toast("PDF downloaded");
  }

  function buildReportText(p){
    var lines = [];
    lines.push("ROOT CAUSE ANALYSIS: " + p.name);
    lines.push("");
    lines.push("PROBLEM STATEMENT");
    lines.push(p.problem.statement || "(not defined)");
    if(p.problem.target) lines.push("Target: " + p.problem.target);
    lines.push("");
    lines.push("CONFIRMED CAUSES");
    var confirmed = p.causes.filter(function(c){ return c.validation === "confirmed"; });
    if(confirmed.length === 0) lines.push("(none confirmed)");
    confirmed.forEach(function(c){
      lines.push("- " + c.text);
      var chain = p.fiveWhys[c.id];
      if(chain){
        chain.forEach(function(w, i){ if(w) lines.push("    Why " + (i+1) + ": " + w); });
      }
    });
    lines.push("");
    lines.push("ACTION PLAN");
    if(p.actions.length === 0) lines.push("(no actions yet)");
    p.actions.forEach(function(a){
      lines.push("- " + (a.action || "(no action text)") + " | Owner: " + (a.owner||"\u2014") + " | Due: " + (a.dueDate||"\u2014") + " | Status: " + STATUS_STYLES[a.status].label);
    });
    return lines.join("\n");
  }

  load();
  try{ window.parent.postMessage({ type: "fitl-rca-ready" }, "*"); }catch(e){}
})();
</script>
