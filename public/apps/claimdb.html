:root[data-theme="dark"]{--gr:#7bbf5a;--bg:#12161b;--surface:#1a2027;--ink:#eef1f4;--ink2:#b4bdc7;--ink3:#8893a0;--line:#2c353f;--accent:#5b9cf0;--accent-ink:#0c1218;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--grid:#252d36;--bad:#ef7b73;--ok:#4cc479;--warn:#e0a03a;--chip:#232b34;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--fb);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}

nav{display:flex;gap:2px}

main{max-width:1280px;margin:18px auto 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}

button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.dng{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sp{flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.tile .l{font:500 11px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.tile .v{font:600 34px/1.1 var(--fd);margin-top:2px;font-variant-numeric:tabular-nums}
.tile .d{font-size:12px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.card h2{font:600 17px var(--fd);letter-spacing:.03em;text-transform:uppercase;margin:0 0 2px}
.card p.s{margin:0 0 8px;color:var(--ink3);font-size:12px}
.lg{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin:0 0 6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font:11px var(--fb);fill:var(--ink2)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);font:500 11px var(--fb);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);cursor:pointer;user-select:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.w{white-space:normal;min-width:180px}
tr:hover td{background:var(--chip)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--chip);font-size:12px}
.mono{font-family:var(--fm);font-size:12px}
.warn{color:var(--warn)}
.hm td{text-align:center;font-variant-numeric:tabular-nums;padding:5px 8px}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:640px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:#0008}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.f label{display:flex;flex-direction:column;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);gap:3px}
.f label.full{grid-column:1/-1}
.f input,.f select{text-transform:none;letter-spacing:0;font-size:14px;width:100%}
dialog{overflow-x:hidden}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:4px;font-size:12px;display:none;max-width:260px;white-space:pre-line}
.note{font-size:12px;color:var(--ink3);margin:8px 0 0}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;z-index:60;font-size:13px}
.pin input{width:78px;text-align:right}
@media (prefers-reduced-motion:no-preference){.card,.tile{transition:border-color .15s}}
.sect{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px;margin:6px 0 8px}
.sect h3{font:600 20px var(--fd);letter-spacing:.03em;text-transform:uppercase;margin:0;text-decoration:underline}
.sect span{font-size:15px}
.kt td,.kt th{text-align:center;padding:6px 5px}.kt th{white-space:normal;min-width:44px;line-height:1.2}.kt td.l,.kt th.l{text-align:left;white-space:normal;min-width:190px}.kt td.kb,.kt td.kg,.kt td.ky{min-width:56px}
.kb{background:#00b0f0;color:#0b0b0b;font-weight:600}.kg{background:#00b050;color:#0b0b0b;font-weight:600}.ky{background:#ffff00;color:#0b0b0b;font-weight:600}
.kt tfoot td{font-weight:600;background:var(--chip)}
.over{text-decoration:underline dotted}
.f label.chk{flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)}
.f label.chk input{width:auto}

 const bt=sum(rows.map(k=>k.baseline||0)),tt=sum(rows.map(k=>k.target||0));

 return `<div class="bar"><label style="font-size:12px;color:var(--ink3)">Year <select id="ky">${ys.map(v=>`<option ${v==y?'selected':''}>${v}</option>`).join('')}</select></label><button class="b pri" id="kadd" type="button">+ Add KPI</button><span class="sp"></span><span class="note" style="margin:0">Monthly % = claimed pcs of the chosen defect groups ÷ total pcs produced × 100. Red = above target. Edit a KPI to type a month by hand.</span></div>
 <div class="card" style="padding:0"><div style="text-align:center;font:600 20px var(--fd);text-transform:uppercase;letter-spacing:.04em;padding:12px">R&amp;D KPI summary sheet · ${y}</div><div class="tw" style="border:0;border-top:1px solid var(--line);border-radius:0"><table class="kt"><thead><tr><th>SN</th><th class="l">Objectives</th><th>UOM</th><th>Baseline actual ${y-1}</th><th>Target ${y}</th>${MON.map(m=>`<th>${m}</th>`).join('')}<th>Average</th><th></th></tr></thead><tbody>${body}</tbody>
 <tfoot><tr><td></td><td class="l">Total</td><td></td><td>${k3(bt)}</td><td>${k3(tt)}</td>${mt.map(v=>`<td>${k3(v)}</td>`).join('')}<td>${k3(sum(avg.map(a=>a||0)))}</td><td></td></tr></tfoot></table></div></div>
 <div class="grid" style="margin-top:12px">${rows.map((k,ri)=>{const items=vals[ri].map((v,i)=>({name:MON[i].toUpperCase(),v,c:k.target!=null&&v!=null&&v>k.target?'var(--bad)':'var(--s1)',tip:`${MON[i]} ${y}\n${v==null?'no data':v.toFixed(3)+'%'}${k.target!=null?'\nTarget '+k.target.toFixed(3):''}`})).concat([{name:'AVG',v:avg[ri],c:'var(--avg)',tip:`Average ${y}\n${avg[ri]==null?'':avg[ri].toFixed(3)}`}]);
  return `<div class="card"><h2>${esc(k.name)}</h2><p class="s">Target ${k3(k.target)||'not set'} · Baseline ${y-1} ${k3(k.baseline)||'not set'} · Average ${k3(avg[ri])||'–'}</p><div class="lg"><span><i style="background:var(--s1)"></i>Within target</span><span><i style="background:var(--bad)"></i>Above target</span><span><i style="background:var(--avg)"></i>Average</span><span style="color:var(--ok);font-weight:600">- - Target ${k3(k.target)}</span></div>${mcol(items,{dec:3,line:k.target,lineColor:'var(--ok)',yTitle:'% of total production'})}</div>`}).join('')}</div>
 <div class="card" style="margin-top:12px"><h2>KPI trend by month · ${y}</h2><p class="s">% of total production</p>${legend(ser.map(s=>[s.c,s.name]))}${lineChart(ser,{w:1000,h:280,labels:false})}</div>`}
function bindKpi(){$('#ky').onchange=e=>{kYear=+e.target.value;render()};$('#kadd').onclick=()=>kEdit(null);document.querySelectorAll('[data-ke]').forEach(b=>b.onclick=()=>kEdit(b.dataset.ke))}
function kEdit(id){const y=kYear,rows=kRows(y);const k=id?rows.find(r=>r.id==id):{name:'',uom:'%',baseline:null,target:null,groups:[],vgroup:'Any',over:{}};const d=$('#dlg');const gs=[...new Set(Object.values(GROUP).concat('Other'))].sort();
 d.innerHTML=`<form method="dialog"><h2 style="font:600 22px var(--fd);margin:0 0 12px;text-transform:uppercase">${id?'Edit KPI':'New KPI'} · ${y}</h2><div class="f">
 <label class="full">Objective<input id="k-name" value="${esc(k.name)}"></label>
 <label>UOM<input id="k-uom" value="${esc(k.uom||'')}"></label>
 <label>Baseline actual ${y-1}<input id="k-base" type="number" step="0.001" value="${k.baseline??''}"></label>
 <label>Target ${y}<input id="k-tgt" type="number" step="0.001" value="${k.target??''}"></label>
 <label>Tyres counted<select id="k-vg">${['Any','Black','NM'].map(v=>`<option value="${v}" ${k.vgroup==v?'selected':''}>${v=='Any'?'Black + NM':v}</option>`).join('')}</select></label>
 <label class="full">Defect groups counted</label>${gs.map(g=>`<label class="chk"><input type="checkbox" data-kg="${esc(g)}" ${k.groups.includes(g)?'checked':''}>${esc(g)}</label>`).join('')}
 <label class="full" style="margin-top:6px">Type a month by hand to replace the calculated value (leave empty to calculate)</label>${MON.map((m,i)=>`<label>${m}<input id="kv-${i+1}" type="number" step="0.001" placeholder="auto" value="${k.over&&k.over[i+1]!=null&&k.over[i+1]!==''?k.over[i+1]:''}"></label>`).join('')}</div>
 <div class="bar" style="margin:14px 0 0"><button class="b pri" id="ks" type="button">Save</button><button class="b" id="kc" type="button">Cancel</button><span class="sp"></span>${id?'<button class="b dng" id="kd" type="button">Delete</button>':''}</div></form>`;
 d.showModal();$('#kc').onclick=()=>d.close();
 $('#ks').onclick=()=>{const name=$('#k-name').value.trim();if(!name){toast('Enter an objective name');return}const o=id?k:{id:'k'+Date.now()};const num=v=>v===''?null:+v;
  Object.assign(o,{name,uom:$('#k-uom').value.trim(),baseline:num($('#k-base').value),target:num($('#k-tgt').value),vgroup:$('#k-vg').value,groups:[...d.querySelectorAll('[data-kg]:checked')].map(c=>c.dataset.kg),over:{}});
  MON.forEach((m,i)=>{const v=$('#kv-'+(i+1)).value;if(v!=='')o.over[i+1]=+v});if(!id)rows.push(o);persistKpi(y);d.close();render();toast('Saved')};
 const del=$('#kd');if(del)del.onclick=()=>{del.textContent='Click again to delete';del.onclick=()=>{S.kpi[y]=rows.filter(r=>r.id!=id);persistKpi(y);d.close();render();toast('Deleted')}}}

const backupObj=()=>({app:'claim-record-db',version:1,exported:new Date().toISOString(),records:S.records,prod:S.prod,action:S.action||null,kpi:S.kpi||{}});
function stripInner(){const b=(S.backups||[])[0];let txt='No backup yet',cls='warn';if(b){const days=(Date.now()-new Date(b.created))/864e5;txt='Last backup: '+new Date(b.created).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' · '+b.claims+' claims';cls=days>7?'warn':''}
 return DB?`<span class="${cls}" style="font-weight:500">${esc(txt)}</span><button class="b pri" id="bn" type="button">Back up now</button><button class="b" id="bl" type="button">Backups…</button>`:'<span style="color:var(--ink3)">Data is saved in this browser only. Use Download backup file on the Records tab.</span>'}
function backupStrip(){return `<div class="bar" id="bstrip" style="margin:0 0 12px;font-size:13px">${stripInner()}</div>`}
function bindStrip(){const n=$('#bn');if(n)n.onclick=()=>backupNow('Manual backup');const l=$('#bl');if(l)l.onclick=showBackups}
function refreshStrip(){const e=$('#bstrip');if(e){e.innerHTML=stripInner();bindStrip()}if($('#dlg').open&&$('#dlg').dataset.k=='bk')showBackups()}
async function backupNow(label,silent){if(!DB){dlBackup();return}
 try{const txt=JSON.stringify(backupObj());const id='b'+Date.now();await dataC.doc(id).set({json:txt});
  const meta={id,created:new Date().toISOString(),label,claims:S.records.length,pcs:sum(S.records.map(r=>r.qty)),kb:Math.round(txt.length/1024)};await backC.doc(id).set(meta);
  S.backups=[meta].concat((S.backups||[]).filter(b=>b.id!=id));refreshStrip();
  for(const o of S.backups.slice(15)){await backC.doc(o.id).delete();await dataC.doc(o.id).delete()}
  if(!silent)toast('Backup saved: '+meta.claims+' claims')}catch(e){fail(e)}}
function showBackups(){const d=$('#dlg');d.dataset.k='bk';const bs=S.backups||[];
 d.innerHTML=`<form method="dialog"><h2 style="font:600 22px var(--fd);margin:0 0 6px;text-transform:uppercase">Backups</h2><p class="note" style="margin:0 0 10px">Each backup is a full copy of claims, production, KPIs and settings, kept inside this page's database. The latest 15 are kept. Restoring makes the data match the backup exactly and first saves a backup of what you have now.</p>
 <div class="tw" style="max-height:50vh;overflow:auto"><table><thead><tr><th>Saved</th><th>Note</th><th class="n">Claims</th><th class="n">Pcs</th><th></th></tr></thead><tbody>${bs.length?bs.map(b=>`<tr><td>${esc(new Date(b.created).toLocaleString([],{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}))}</td><td>${esc(b.label||'')}</td><td class="n">${b.claims}</td><td class="n">${b.pcs}</td><td style="white-space:nowrap"><button class="b" data-bt="restore" data-b="${b.id}" type="button">Restore</button> <button class="b" data-bt="copy" data-b="${b.id}" type="button">Copy text</button> <button class="b dng" data-bt="del" data-b="${b.id}" type="button">Delete</button></td></tr>`).join(''):'<tr><td colspan="5" class="w">No backups yet. Click Back up now.</td></tr>'}</tbody></table></div>
 <div class="bar" style="margin:12px 0 0"><button class="b pri" id="bnn" type="button">Back up now</button><button class="b" id="bcl" type="button">Close</button></div></form>`;
 if(!d.open)d.showModal();$('#bcl').onclick=()=>{delete d.dataset.k;d.close()};$('#bnn').onclick=()=>backupNow('Manual backup');
 d.querySelectorAll('[data-bt]').forEach(b=>b.onclick=async()=>{const id=b.dataset.b,k=b.dataset.bt;
  if(k=='del'){if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Sure?';return}try{await backC.doc(id).delete();await dataC.doc(id).delete();S.backups=S.backups.filter(x=>x.id!=id);showBackups()}catch(e){fail(e)}}
  else if(k=='copy'){try{const sn=await dataC.doc(id).get();delete d.dataset.k;showCopy('Claim_DB_backup.json',sn.data().json,'')}catch(e){fail(e)}}
  else{if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Click again to restore';return}b.disabled=true;b.textContent='Restoring…';await restoreSnapshot(id)}})}
async function restoreSnapshot(id){try{const sn=await dataC.doc(id).get();if(!sn.exists)throw new Error('Backup not found');const j=JSON.parse(sn.data().json);
  await backupNow('Before restore',true);
  const keep=new Set(j.records.map(r=>String(r.id)));for(const r of S.records.slice())if(!keep.has(String(r.id)))await claimsC.doc(String(r.id)).delete();
  for(let i=0;i<j.records.length;i+=20)await Promise.all(j.records.slice(i,i+20).map(r=>claimsC.doc(String(r.id)).set(clean(r))));
  for(const y of Object.keys(j.prod||{}))await prodC.doc(y).set({year:+y,black:j.prod[y].black,nm:j.prod[y].nm});
  if(j.action)await setC.doc('action').set(j.action);for(const y of Object.keys(j.kpi||{}))await kpiC.doc(y).set({year:+y,rows:j.kpi[y]});
  const d=$('#dlg');delete d.dataset.k;d.close();toast('Restored '+j.records.length+' claims')}catch(e){fail(e);showBackups()}}

function banner(){return DB&&DBREADY&&DBEMPTY?`<div class="card" style="margin-bottom:12px"><b>The database is empty.</b> Load the 363 claims and the production figures from your 2025 and 2026 files, then keep adding from here. <button class="b pri" id="seed" style="margin-left:8px">Load 2025–2026 history</button></div>`:''}
async function seed(){const b=$('#seed');b.disabled=true;b.textContent='Loading…';try{const rs=SRC.records;for(let i=0;i<rs.length;i+=20)await Promise.all(rs.slice(i,i+20).map(r=>claimsC.doc(String(r.id)).set(r)));
 for(const y of Object.keys(SRC.prod))await prodC.doc(y).set({year:+y,black:SRC.prod[y].black,nm:SRC.prod[y].nm});toast('History loaded')}catch(e){fail(e);b.disabled=false;b.textContent='Load 2025–2026 history'}}
const now=new Date();let E={customer:'M-ITALY',year:now.getFullYear(),recMonth:now.getMonth()+1,claimDate:now.toISOString().slice(0,10)};
function entryView(){const defs=[...new Set(SRC.defectMaster.concat(S.records.map(r=>r.defect)).filter(Boolean))].sort();const custs=[...new Set(['M-ITALY','Wenzel'].concat(uniq('customer')))];const grp=[...new Set(Object.values(GROUP).concat('Other'))].sort();
 const dl=(id,a)=>`<datalist id="${id}">${a.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`;
 return `<div class="grid"><div class="card"><h2>New claim</h2><p class="s">The header stays filled between lines, so one customer letter can be keyed in a few lines.</p>
 <form id="en" autocomplete="off"><div class="f">
 <label>Code<input id="n-code"></label>
 <label>Customer<select id="n-customer">${custs.map(c=>`<option ${E.customer==c?'selected':''}>${esc(c)}</option>`).join('')}<option value="__new">+ New customer…</option></select><input id="n-customerNew" placeholder="Customer name" hidden></label>
 <label>Year<input id="n-year" type="number" value="${E.year}"></label>
 <label class="full">Item<input id="n-item" list="n-dl-i" placeholder="Start typing, e.g. ELTOR 18X7-8 EVO"></label>
 <label>Type<input id="n-type" list="n-dl-t"></label>
 <label>Version<select id="n-version"><option>BLACK</option><option>NM</option><option>AS NM</option><option>NMW</option></select></label>
 <label>Received on<select id="n-recMonth">${MON.map((m,i)=>`<option value="${i+1}" ${E.recMonth==i+1?'selected':''}>${m}</option>`).join('')}</select></label>
 <label>Qty<input id="n-qty" type="number" min="1" value="1"></label>
 <label>Month (mfg)<input id="n-mfgMonth" type="number" min="1" max="12"></label>
 <label>Year (mfg)<input id="n-mfgYear" type="number" min="2015"></label>
 <label class="full">Defect sent by customer<input id="n-defectSent"></label>
 <label>Defect<input id="n-defect" list="n-dl-d"></label>
 <label>Defect group<select id="n-group">${grp.map(g=>`<option>${esc(g)}</option>`).join('')}</select></label>
 <label>Customer claim date<input id="n-claimDate" type="date" value="${E.claimDate}"></label>
 <label>Manufactured at<input id="n-madeAt" value="MADE IN SRI LANKA"></label>
 <label>Acceptable claim %<input id="n-acceptable" type="number" min="0" max="100" value="100"></label></div>
 ${dl('n-dl-c',uniq('customer'))}${dl('n-dl-i',uniq('item'))}${dl('n-dl-t',uniq('type'))}${dl('n-dl-d',defs)}
 <div class="bar" style="margin:14px 0 0"><button class="b pri" type="submit">Add claim line</button><span class="note" id="n-msg" style="margin:0" role="status"></span></div></form></div>
 <div class="card"><h2>Claim rate now</h2><div id="n-tiles"></div><h2 style="margin-top:16px">Recently entered</h2><div id="n-recent"></div></div></div>`}
function refreshEntry(){const t=$('#n-tiles');if(!t)return;const ms=monthStats(E.year)[E.recMonth-1],yt=yearTotals(E.year);
 t.innerHTML=`<div class="tiles" style="margin:8px 0 0"><div class="tile"><div class="l">${MON[E.recMonth-1]} ${E.year}</div><div class="v">${fmt(ms.q)}</div><div class="d">${ms.pct!=null?pct(ms.pct)+' of '+fmt(ms.pt)+' produced':'no production entered yet'}</div></div><div class="tile"><div class="l">${E.year} to date</div><div class="v">${fmt(yt.q)}</div><div class="d">${yt.pct!=null?pct(yt.pct)+' of '+fmt(yt.p)+' produced':'no production entered'}</div></div></div>`;
 const rc=S.records.filter(r=>r.source=='added').sort((a,b)=>b.id-a.id).slice(0,8);
 $('#n-recent').innerHTML=rc.length?`<div class="tw" style="margin-top:8px"><table><tbody>${rc.map(r=>`<tr><td class="n">${r.qty}×</td><td class="w">${esc(r.item)}<br><span style="color:var(--ink3);font-size:12px">${esc(r.customer)} · ${MON[(r.recMonth||1)-1]} ${r.year} · ${esc(r.defect)}</span></td><td style="white-space:nowrap"><button class="b" data-edit="${r.id}" type="button">Edit</button> <button class="b dng" data-del="${r.id}" type="button">Remove</button></td></tr>`).join('')}</tbody></table></div>`:`<p class="note">Nothing entered yet. New claim lines appear here.</p>`;
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(b.dataset.arm){removeRec(b.dataset.del);if(!DB)refreshEntry()}else{b.dataset.arm=1;b.textContent='Sure?'}})}
function bindEntry(){const g=k=>$('#n-'+k).value.trim(),msg=t=>{$('#n-msg').textContent=t};
 const cust=()=>$('#n-customer').value=='__new'?g('customerNew'):g('customer');
 ['customer','customerNew','claimDate','recMonth','year'].forEach(k=>$('#n-'+k).onchange=()=>{$('#n-customerNew').hidden=$('#n-customer').value!='__new';if(k=='customer'&&!$('#n-customerNew').hidden)$('#n-customerNew').focus();if(k=='customerNew'||k=='customer')E.customer=cust();else E[k]=['year','recMonth'].includes(k)?+$('#n-'+k).value:g(k);refreshEntry()});
 $('#n-item').onchange=()=>{const m=S.records.filter(r=>r.item==g('item')).sort((a,b)=>b.id-a.id)[0];if(m){$('#n-type').value=m.type||'';$('#n-code').value=m.code||'';const v=$('#n-version');if(![...v.options].some(o=>o.value==m.version)){v.add(new Option(m.version))}v.value=m.version||'BLACK'}};
 $('#n-defect').onchange=()=>{const gr=GROUP[g('defect')];if(gr)$('#n-group').value=gr};
 $('#en').onsubmit=e=>{e.preventDefault();
  const r={id:nextId(),year:+g('year'),recMonth:+g('recMonth'),customer:cust().replace('M.ITALY','M-ITALY').replace(/^(ven[sz]ell|wenzel)$/i,'Wenzel'),code:g('code'),item:g('item'),type:g('type'),version:g('version').toUpperCase(),qty:+g('qty'),mfgMonth:g('mfgMonth')?+g('mfgMonth'):null,mfgYear:g('mfgYear')?+g('mfgYear'):null,defect:g('defect'),defectSent:g('defectSent')||null,claimDate:g('claimDate')||null,madeAt:g('madeAt')||'MADE IN SRI LANKA',acceptable:g('acceptable')===''?100:+g('acceptable'),dateFlag:'',source:'added'};
  if(!r.customer||!r.item||!r.defect||!(r.qty>0)){msg('Customer, item, defect and a quantity of 1 or more are needed.');return}
  r.vgroup=r.version.includes('NM')?'NM':'Black';r.group=g('group')||'Other';if(!GROUP[r.defect])GROUP[r.defect]=r.group;
  Object.assign(E,{customer:r.customer,year:r.year,recMonth:r.recMonth,claimDate:r.claimDate});
  persist(r);msg('Added '+r.qty+' × '+r.item);
  ['item','type','code','defect','defectSent','mfgMonth','mfgYear'].forEach(k=>$('#n-'+k).value='');$('#n-qty').value=1;$('#n-item').focus();refreshEntry()};
 refreshEntry()}
function soft(){if($('#dlg').open)return;if(view=='entry'){refreshEntry();const b=$('#main .card');if(!$('#seed')&&DBREADY&&DBEMPTY||$('#seed')&&!(DBREADY&&DBEMPTY)){const k=document.activeElement;if(!k||k.tagName!='INPUT')render()}return}
 const k=document.activeElement;if(k&&k.tagName=='INPUT'&&k.id!='q')return;render()}
(async()=>{try{if(!window.claude)return;const db=await claude.use('db');if(!db)return;DB=db;claimsC=db.collection('claims');prodC=db.collection('production');setC=db.collection('settings');kpiC=db.collection('kpi');backC=db.collection('backups');dataC=db.collection('backupdata');S={backups:[],records:[],prod:{},annual:SRC.annual,kpi:{}};render();
 claimsC.onSnapshot(sn=>{S.records=sn.docs.map(d=>Object.assign({madeAt:'MADE IN SRI LANKA',acceptable:100},d.data()));DBREADY=true;DBEMPTY=sn.empty;soft()},e=>toast('Database error: '+(e.message||e.code)));
 backC.onSnapshot(sn=>{S.backups=sn.docs.map(d=>d.data()).filter(b=>b&&b.created).sort((a,b)=>a.created<b.created?1:-1);refreshStrip()},()=>{});
 kpiC.onSnapshot(sn=>{S.kpi={};sn.docs.forEach(d=>{S.kpi[d.id]=d.data().rows||[]});soft()},()=>{});
 setC.onSnapshot(sn=>{const d=sn.docs.find(x=>x.id=='action');S.action=d?d.data():null;soft()},()=>{});
 prodC.onSnapshot(sn=>{S.prod={};sn.docs.forEach(d=>{const v=d.data();S.prod[d.id]={black:v.black||Array(12).fill(null),nm:v.nm||Array(12).fill(null)}});soft()},()=>{})}catch(e){}})();
render();
</script>
