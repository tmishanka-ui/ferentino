<style>
  :root{--bg:#F2F0EB;--card:#fff;--ink:#1D2127;--soft:#5E6772;--line:#DDD8CF;--line2:#ECE8E0;--red:#DA1B22;--red-d:#B3151B;--red-bg:#FBE9EA;--navy:#1F3A5F;--green:#2C7A4B;--green-bg:#E1F0E7;--amber:#B97708;--amber-bg:#FBF0D8;--head:'Barlow Condensed','Arial Narrow',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box}[hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Inter',system-ui,sans-serif}
  button,input,select{font:inherit;color:inherit}h1,h2,h3{font-family:var(--head);font-weight:600;margin:0}
  header{background:var(--card);border-bottom:3px solid var(--red);padding:12px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header img{height:38px;width:auto;border-radius:4px}h1{font-size:26px;text-transform:uppercase;line-height:1}.sub{color:var(--soft);font-size:12.5px;margin-top:3px}.grow{flex:1;min-width:240px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap}.btn:hover{border-color:#B9B2A6}.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.red:hover{background:var(--red-d)}.btn.sm{padding:3px 10px;font-size:12.5px}.btn:disabled{opacity:.45;cursor:default}
  select,input[type=number]{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 10px}
  .yr{display:flex;align-items:center;gap:8px;background:#FBFAF7;border:1px solid var(--line);border-radius:9px;padding:6px 10px}.yr label{font-size:12px;font-weight:600;color:var(--soft)}.yr select{font-weight:700;font-size:15px}
  main{padding:16px 22px 60px;max-width:1550px;margin:0 auto}
  .status{font-size:12.5px;color:var(--soft);margin:0 0 12px}.status b{color:var(--ink)}.warn{color:#8A5A00;background:#FFF3D6;padding:1px 8px;border-radius:9px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px}.pn{padding:14px 16px;margin-bottom:14px}.pn h2{font-size:20px;text-transform:uppercase;margin-bottom:8px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}.t{padding:12px 14px;border-left:6px solid var(--line)}.t small{display:block;color:var(--soft);font-size:12px}.t b{font:600 32px/1.1 var(--head)}.t .n{font-size:12px;color:var(--soft)}.t.good{border-left-color:var(--green)}.t.bad{border-left-color:var(--red)}.t.mid{border-left-color:var(--amber)}.t.good b{color:var(--green)}.t.bad b{color:var(--red-d)}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:14px;margin-bottom:14px}.cb{padding:10px 12px;height:330px;position:relative}.full{grid-column:1/-1}.tall{height:430px}
  .tw{overflow:auto;border-radius:8px}table{border-collapse:collapse;width:100%;font-size:12.5px}

  td:first-child,th:first-child{text-align:left;white-space:normal;min-width:230px}td.l,th.l{text-align:left}td.c,th.c{text-align:center}

  .empty{padding:48px 20px;text-align:center;color:var(--soft);line-height:1.8}
  .veil{position:fixed;inset:0;background:rgba(29,33,39,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px;z-index:50;overflow:auto}.modal{background:#fff;border-radius:12px;width:min(760px,100%);padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}.modal h2{font-size:24px;text-transform:uppercase;margin-bottom:6px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

  .note{color:var(--soft);font-size:12.5px}details{margin-top:8px}summary{cursor:pointer;font-weight:600}

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),3200)}
const dv=(a,b,m)=>a==null||b==null||!(b>0)?null:a/b*(m||1);

/* ---------- the 15 KPIs of the workbook's Graphs sheet ---------- */
const KP=[
 {id:'se',t:'MITL Specific Energy',u:'MWh/Ton',dir:'low',dec:3,n:r=>r.toe,d:r=>r.prod,hs:/^total specific energy/,f:'(electrical kWh + thermal kWh of the steam) ÷ tyre production kg'},
 {id:'tbse',t:'Tyre Building Specific Energy',u:'MWh/Ton',dir:'low',dec:3,n:r=>r.tbe,d:r=>r.prod,hs:/^tyre building specific electrical energy/,f:'tyre building energy kWh ÷ tyre production kg'},
 {id:'boil',t:'Boiler Efficiency',u:'steam kg / wood kg',dir:'high',dec:2,n:r=>r.steam,d:r=>r.wood,hs:/^boiler efficiency/,f:'steam kg ÷ wood kg (higher is better)'},
 {id:'steam',t:'Specific Steam Consumption',u:'steam kg / tyre kg',dir:'low',dec:2,n:r=>r.steam,d:r=>r.prod,hs:/^steam usage for curing/,f:'steam kg ÷ tyre production kg'},
 {id:'maint',t:'Maintenance Cost',u:'LKR / tyre kg',dir:'low',dec:2,n:r=>r.maint,d:r=>r.prod,hs:/^maintenance cost \(lkr\/kg\)/,f:'maintenance cost LKR ÷ tyre production kg'},
 {id:'fcost',t:'Forklift Repair and Hire Cost',u:'LKR / tyre kg',dir:'low',dec:3,n:r=>r.fcost,d:r=>r.prod,hs:/^forklift cost/,f:'forklift repair + hire LKR ÷ tyre production kg'},
 {id:'fdown',t:'Forklift Downtime',u:'%',dir:'low',pct:1,dec:1,avg:1,v:r=>dv(r.fdown,r.dfd||(r.dim||31)*120),dk:'dfd',hs:/^forklift downtime/,f:'forklift down time minutes ÷ the available minutes of that month (taken from the workbook’s own formula for the month; 120 minutes × days of the month when the formula is missing)'},
 {id:'oil',t:'Oil Usage (HD68, engine, transmission, brake oil)',u:'ml / ton',dir:'low',dec:1,n:r=>r.oil,d:r=>r.prod,m:1000,hs:/^reduce hd68/,f:'oil used ÷ tyre production tons'},
 {id:'water',t:'Boiler and Cooling Tower Water Usage',u:'litres / tyre kg',dir:'low',dec:3,n:r=>r.water,d:r=>r.prod,hs:/^boiler and cooling tower water usage/,f:'water litres ÷ tyre production kg'},
 {id:'grease',t:'Grease Usage of Twin Mill and Banbury',u:'kg / ton',dir:'low',dec:3,n:r=>r.grease,d:r=>r.prod,m:1000,hs:/^grease usage/,f:'grease kg ÷ tyre production tons'},
 {id:'hyd',t:'Hydraulic Oil Consumption',u:'litres / ton',dir:'low',dec:2,n:r=>r.hyd,d:r=>r.prod,m:1000,hs:/^hydraulic oil consumption/,f:'hydraulic oil litres ÷ tyre production tons'},
 {id:'comp',t:'Compressor Specific Energy',u:'kWh / ton',dir:'low',dec:1,n:r=>r.comp,d:r=>r.prod,m:1000,hs:/^compressor specific energy/,f:'compressor kWh ÷ tyre production tons'},
 {id:'maxd',t:'Maximum Demand',u:'kVA',dir:'low',dec:0,avg:1,v:r=>r.maxd,th:/^max demand target/,f:'maximum demand of the month (year figure = average of the months)'},
 {id:'tbd',t:'Tyre Building Breakdown',u:'%',dir:'low',pct:1,dec:2,avg:1,v:r=>dv(r.tyrebd,r.dtb||3456000),dk:'dtb',hs:/^reduce tyre building department breakdown/,f:'tyre building breakdown minutes ÷ the available machine minutes of that month (taken from the workbook’s own formula; 3,456,000 when missing)'},
 {id:'mixbd',t:'Mixing Breakdown',u:'%',dir:'low',pct:1,dec:2,avg:1,v:r=>dv(r.mixbd,r.dmx||72000),dk:'dmx',hs:/^reduce mixing department breakdown/,f:'mixing breakdown minutes ÷ the available machine minutes of that month (taken from the workbook’s own formula; 72,000 when missing)'}];
const mval=(k,r)=>r?(k.avg?k.v(r):dv(k.n(r),k.d(r),k.m)):null;
const fmt=(k,v)=>v==null?'–':k.pct?(v*100).toFixed(k.dec)+' %':v.toLocaleString(undefined,{minimumFractionDigits:k.dec,maximumFractionDigits:k.dec});
const fmtT=(k,t)=>t==null?'not set':k.pct?+(t*100).toFixed(3)+' %':+t.toFixed(4);
const met=(k,v,t)=>v==null||t==null?null:k.dir==='low'?v<=t:v>=t;

/* ---------- reading the workbook ---------- */
const numv=v=>{if(typeof v==='number'&&isFinite(v))return v;if(typeof v==='string'){const s=v.trim().replace(/,/g,'');if(/^-?\d+(\.\d+)?$/.test(s))return parseFloat(s)}return null};
const RAW={prod:/^tyre production/,maxd:/^maximum demand/,elec:/^electrical unit/,tbe:/^tyre building energy usage/,wood:/^wood consumption/,steam:/^steam consumption/,therm:/^thermal energy/,maint:/^maintenace? cost \(lkr\)/,comp:/^compressor energy \(kwh\)/,fcost:/^forklift cost/,fdown:/^forklift downtime/,oil:/^hd68/,water:/^boiler and cooling tower water usage/,mixbd:/^mixing department breakdown/,grease:/^grease usage/,hyd:/^hydraulic oil consumption/,tyrebd:/^tyre department breakdown/};
function parseWorkbook(wb){
  const ws=wb.Sheets['Data']||wb.Sheets[wb.SheetNames[0]];if(!ws)throw new Error('no “Data” sheet');
  const A=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}),H=(A[0]||[]).map(h=>String(h==null?'':h).trim().toLowerCase().replace(/\s+/g,' '));
  const cols={};Object.keys(RAW).forEach(k=>{cols[k]=H.findIndex(h=>RAW[k].test(h))});
  const miss=Object.keys(cols).filter(k=>cols[k]<0&&['prod'].includes(k));if(miss.length)throw new Error('the “Tyre Production (kg)” column was not found — this does not look like the maintenance KPI workbook');
  const yr=(/20\d\d/.exec(String(A[0]&&A[0][0]||''))||[null])[0];
  const raw={};
  for(let i=1;i<A.length;i++){const a=String(A[i][0]==null?'':A[i][0]).trim().toLowerCase();if(a==='ytd')break;const m=MN.indexOf(a);if(m<0)continue;
    const r={};Object.keys(cols).forEach(k=>{if(cols[k]>=0){const v=numv(A[i][cols[k]]);if(v!=null)r[k]=v}});
    if(r.elec!=null&&(r.therm!=null||r.steam!=null))r.toe=r.elec+(r.therm!=null?r.therm:r.steam*2769.1/3600);
    if(Object.keys(r).length)raw[m+1]=r}
  const tg={};KP.forEach(k=>{let j;if(k.th)j=H.findIndex(h=>k.th.test(h));else{const c=H.findIndex((h,i)=>i>=24&&k.hs.test(h));j=c<0?-1:H.findIndex((h,i)=>i>c&&/target/.test(h))}
    if(j>=0)for(let i=1;i<=13&&i<A.length;i++){const v=numv(A[i][j]);if(v!=null){tg[k.id]=v;break}}});
  // the workbook's own KPI figures, kept to check my arithmetic against theirs
  const own={};KP.forEach(k=>{const c=k.th?H.findIndex(h=>RAW.maxd.test(h)):H.findIndex((h,i)=>i>=24&&k.hs.test(h));if(c>=0){own[k.id]={};for(let m=1;m<=12;m++){const row=A[m];if(row){const v=numv(row[c]);if(v!=null)own[k.id][m]=v}}}});
  // the "available minutes" behind the three percentage KPIs differ month by month in the workbook: read them from its formulas
  const rg=XLSX.utils.decode_range(ws['!ref']||'A1:A1');
  KP.filter(k=>k.dk).forEach(k=>{const c=H.findIndex((h,i)=>i>=24&&k.hs.test(h));if(c<0)return;
    for(let i=1;i<A.length;i++){const a=String(A[i][0]==null?'':A[i][0]).trim().toLowerCase(),m=MN.indexOf(a);if(m<0||!raw[m+1])continue;
      const cell=ws[XLSX.utils.encode_cell({r:rg.s.r+i,c:rg.s.c+c})],f=cell&&cell.f?String(cell.f):'',x=/\/\s*(\d+(?:\.\d+)?)\s*$/.exec(f);if(x)raw[m+1][k.dk]=parseFloat(x[1])}});
  Object.keys(raw).forEach(m=>{raw[m].dim=new Date(yr?+yr:NOW,+m,0).getDate()});
  if(!Object.keys(raw).length)throw new Error('no month rows with figures were found');
  return{year:yr?+yr:null,raw,tg,own};
}

/* ---------- numbers ---------- */
let YR=null,CMP='';
const yrs=()=>Object.keys(D.years).map(Number).sort((a,b)=>b-a);
const tgt=(y,id)=>{const o=(D.ov[y]||{})[id];return o!=null?o:(D.years[y]&&D.years[y].tg[id]!=null?D.years[y].tg[id]:null)};
function series(y,k){const Y=D.years[y];return Array.from({length:12},(_,i)=>Y?mval(k,Y.raw[i+1]):null)}
function ytd(y,k){const Y=D.years[y];if(!Y)return null;const rs=Object.values(Y.raw);
  if(k.avg){const v=rs.map(r=>k.v(r)).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
  let n=0,d=0,c=0;rs.forEach(r=>{const a=k.n(r),b=k.d(r);if(a!=null&&b!=null&&b>0){n+=a;d+=b;c++}});return c?n/d*(k.m||1):null}
function destroy(){(destroy.c||[]).forEach(c=>c.destroy());destroy.c=[]}
const mk=(id,cfg)=>{if(typeof Chart==='undefined'||!$(id))return;Chart.defaults.font.family="Inter,system-ui,sans-serif";destroy.c.push(new Chart($(id),cfg))};
const G='#2E9E6B',R='#DA1B22',N='#1F3A5F';

/* ---------- screen ---------- */
function yearBox(){const s=new Set(yrs());for(let y=NOW-3;y<=NOW+1;y++)s.add(y);if(YR)s.add(YR);const list=[...s].sort((a,b)=>b-a);
  $('yr').innerHTML=list.map(y=>'<option value="'+y+'"'+(y===YR?' selected':'')+'>'+y+(D.years[y]?' ✓':'')+'</option>').join('');$('uplab').firstChild.nodeValue='Upload Excel for '+YR+' ';$('xl').disabled=!D.years[YR]}
function render(){
  destroy();if(YR==null)YR=yrs()[0]||NOW;yearBox();const Y=D.years[YR];
  if(!Y){$('main').innerHTML='<div class="card empty"><b>No Maintenance KPI data for '+YR+' yet.</b><br>Choose the year of the data above, then press <b>Upload Excel for '+YR+'</b> and pick the KPI workbook (the one with the “Data” sheet).'+(yrs().length?'<br><span class="note">Years already uploaded: '+yrs().join(', ')+'.</span>':'')+'</div>';return}
  const months=Object.keys(Y.raw).map(Number).sort((a,b)=>a-b),last=months[months.length-1];
  const S=KP.map(k=>({k,v:series(YR,k),t:tgt(YR,k.id)}));S.forEach(x=>{x.y=ytd(YR,x.k);x.ys=met(x.k,x.y,x.t);x.ms=x.v.map(v=>met(x.k,v,x.t));x.nOk=x.ms.filter(z=>z===true).length;x.nAll=x.ms.filter(z=>z!=null).length;x.ls=x.ms[last-1]});
  const withY=S.filter(x=>x.ys!=null),okY=withY.filter(x=>x.ys).length,withL=S.filter(x=>x.ls!=null),okL=withL.filter(x=>x.ls).length;
  const mpct=MONS.map((_,i)=>{const a=S.filter(x=>x.ms[i]!=null);return a.length?a.filter(x=>x.ms[i]).length/a.length*100:null});
  let h='<p class="status"><b>'+YR+'</b> · file <b>'+esc(Y.file)+'</b> · uploaded '+esc(String(Y.at).slice(0,10))+' · figures for <b>'+months.map(m=>MONS[m-1]).join(', ')+'</b>'+(Y.diff&&Y.diff.length?' · <span class="warn" title="'+esc(Y.diff.join('; '))+'">'+Y.diff.length+' value(s) differ from the workbook’s own KPI columns</span>':' · <span class="chip ok">matches the workbook’s own KPI columns</span>')+'</p>';
  h+='<div class="tiles"><div class="card t '+(withL.length?okL===withL.length?'good':okL>=withL.length/2?'mid':'bad':'')+'"><small>KPIs on target — '+MONS[last-1]+'</small><b>'+okL+' of '+withL.length+'</b><div class="n">latest month with figures</div></div>'+
   '<div class="card t '+(withY.length?okY===withY.length?'good':okY>=withY.length/2?'mid':'bad':'')+'"><small>KPIs on target — year to date</small><b>'+okY+' of '+withY.length+'</b><div class="n">'+MONS[months[0]-1]+' to '+MONS[last-1]+' '+YR+'</div></div>'+
   '<div class="card t bad"><small>Not on target, year to date</small><b>'+withY.filter(x=>!x.ys).length+'</b><div class="n">'+esc(withY.filter(x=>!x.ys).map(x=>x.k.t).slice(0,3).join(' · '))+(withY.filter(x=>!x.ys).length>3?' …':'')+'</div></div>'+
   '<div class="card t"><small>Months with figures</small><b>'+months.length+'</b><div class="n">of 12</div></div></div>';
  h+='<div class="card pn" style="padding:10px 14px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="note">Compare with the same KPIs of <select id="cmp"><option value="">— no comparison —</option>'+yrs().filter(y=>y!==YR).map(y=>'<option value="'+y+'"'+(String(y)===CMP?' selected':'')+'>'+y+'</option>').join('')+'</select></label><span style="flex:1"></span><button class="btn sm" data-act="targets">Edit targets</button><button class="btn sm" data-act="defs">KPI definitions</button></div></div>';
  h+='<div class="grid2"><div class="card cb tall"><canvas id="c0"></canvas></div><div class="card cb tall"><canvas id="c00"></canvas></div></div>';
  h+='<div class="card pn"><h2>Maintenance KPI scorecard — '+YR+'</h2><p class="note" style="margin:0 0 8px">Green: target met · red: target not met · grey: no figure yet. Lower is better, except Boiler Efficiency (higher is better). Year to date uses only the months that have both figures.</p><div class="tw"><table><thead><tr><th>KPI</th><th class="l">Target</th>'+MONS.map(m=>'<th>'+m+'</th>').join('')+'<th>Year to date</th><th class="c">Months on target</th></tr></thead><tbody>'+
   S.map(x=>'<tr><td><b>'+esc(x.k.t)+'</b><div class="note">'+esc(x.k.u)+'</div></td><td class="l">'+(x.k.dir==='low'?'≤ ':'≥ ')+fmtT(x.k,x.t)+'</td>'+x.v.map((v,i)=>'<td class="'+(x.ms[i]==null?'nd':x.ms[i]?'ok':'no')+'">'+fmt(x.k,v)+'</td>').join('')+'<td class="ytd '+(x.ys==null?'nd':x.ys?'ok':'no')+'">'+fmt(x.k,x.y)+'</td><td class="c">'+(x.nAll?x.nOk+' of '+x.nAll:'–')+'</td></tr>').join('')+'</tbody></table></div></div>';
  h+='<div class="grid2">'+KP.map((k,i)=>'<div class="card cb"><canvas id="k'+i+'"></canvas></div>').join('')+'</div>';
  $('main').innerHTML=h;
  /* ----- charts ----- */
  const ws=S.filter(x=>x.y!=null&&x.t);
  mk('c0',{type:'bar',data:{labels:ws.map(x=>x.k.t),datasets:[{label:'Year to date ÷ target (%)',data:ws.map(x=>Math.round(x.y/x.t*1000)/10),backgroundColor:ws.map(x=>x.ys?G:R)},{type:'line',label:'Target = 100 %',data:ws.map(()=>100),borderColor:'#1D2127',borderDash:[7,5],borderWidth:2,pointRadius:0}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:'Every KPI against its target, '+YR+' year to date (% of target)',font:{size:15}},subtitle:{display:true,text:'Left of the 100 % line is better for all KPIs except Boiler Efficiency, where right of it is better',font:{size:11}},legend:{position:'bottom'}},scales:{x:{beginAtZero:true,title:{display:true,text:'% of target'}},y:{ticks:{font:{size:10}}}}}});
  mk('c00',{type:'bar',data:{labels:MONS,datasets:[{label:'KPIs on target (%)',data:mpct.map(v=>v==null?null:Math.round(v)),backgroundColor:mpct.map(v=>v==null?'#ccc':v>=100?G:v>=60?'#E0A526':R)},{type:'line',label:'Target = every KPI on target (100 %)',data:MONS.map(()=>100),borderColor:'#1D2127',borderDash:[7,5],borderWidth:2,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:'Share of the KPIs that met their target, by month — '+YR,font:{size:15}},legend:{position:'bottom'}},scales:{y:{min:0,max:110,title:{display:true,text:'% of the KPIs with a figure'}}}}});
  const cmpSer=CMP&&D.years[CMP]?KP.map(k=>series(+CMP,k).concat([ytd(+CMP,k)])):null;
  S.forEach((x,i)=>{const k=x.k,sc=k.pct?100:1,lab=MONS.concat(['YTD']),vals=x.v.concat([x.y]).map(v=>v==null?null:v*sc),t=x.t==null?null:x.t*sc;
    const ds=[{label:YR+' actual',data:vals,backgroundColor:vals.map((v,j)=>v==null?'#ccc':j===12?N:met(k,v/sc,x.t)===false?R:G),order:2},{type:'line',label:'Target '+(t==null?'(not set)':(k.dir==='low'?'≤ ':'≥ ')+(+t.toFixed(4))),data:lab.map(()=>t),borderColor:'#1D2127',borderDash:[7,5],borderWidth:2,pointRadius:0,order:1}];
    if(cmpSer)ds.push({type:'line',label:CMP+' actual',data:cmpSer[i].map(v=>v==null?null:v*sc),borderColor:'#8A94A3',borderDash:[2,3],borderWidth:2,pointRadius:3,pointBackgroundColor:'#8A94A3',order:0,spanGaps:true});
    mk('k'+i,{type:'bar',data:{labels:lab,datasets:ds},options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:k.t+' ('+k.u+') — YTD '+fmt(k,x.y)+(x.ys==null?'':x.ys?' ✓ on target':' ✗ off target'),font:{size:13}},legend:{position:'bottom',labels:{boxWidth:14,font:{size:11}}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+(c.parsed.y==null?'–':(+c.parsed.y.toFixed(k.dec+1)).toLocaleString())}}},scales:{y:{beginAtZero:true,title:{display:true,text:k.u}}}}})});
}

/* ---------- actions ---------- */
function openModal(h){$('host').innerHTML='<div class="veil"><div class="modal">'+h+'</div></div>'}
const closeW=()=>{$('host').innerHTML=''};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='close')closeW();
  else if(act==='defs')openModal('<h2>KPI definitions</h2><p class="note" style="margin:0 0 8px">How each KPI is worked out from the monthly figures of the “Data” sheet (the same formulas as the workbook’s KPI columns).</p><div class="tw" style="max-height:60vh"><table><thead><tr><th>KPI</th><th class="l">Unit</th><th class="l">Formula</th><th class="l">Better when</th></tr></thead><tbody>'+KP.map(k=>'<tr><td><b>'+esc(k.t)+'</b></td><td class="l">'+esc(k.u)+'</td><td class="l" style="white-space:normal">'+esc(k.f)+'</td><td class="l">'+(k.dir==='low'?'lower':'higher')+'</td></tr>').join('')+'</tbody></table></div><div class="foot"><button class="btn red" data-act="close">Close</button></div>');
  else if(act==='targets'){const Y=D.years[YR];openModal('<h2>Targets — '+YR+'</h2><p class="note" style="margin:0 0 8px">The targets come from the “Target” columns of the uploaded workbook. Type a different value to override one (leave it empty to use the workbook’s). Percent KPIs are typed as numbers, e.g. 5 for 5 %.</p><div class="tw" style="max-height:60vh"><table><thead><tr><th>KPI</th><th>Workbook target</th><th>Your target</th></tr></thead><tbody>'+KP.map(k=>{const o=(D.ov[YR]||{})[k.id],f=Y.tg[k.id],sc=k.pct?100:1;return'<tr><td><b>'+esc(k.t)+'</b><div class="note">'+(k.dir==='low'?'≤':'≥')+' · '+esc(k.u)+'</div></td><td>'+(f==null?'—':+(f*sc).toFixed(4)+(k.pct?' %':''))+'</td><td><input type="number" step="any" data-tg="'+k.id+'" style="width:110px" value="'+(o==null?'':+(o*sc).toFixed(4))+'"></td></tr>'}).join('')+'</tbody></table></div><div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn red" data-act="savetg">Save targets</button></div>')}
  else if(act==='savetg'){const o={};document.querySelectorAll('[data-tg]').forEach(i=>{const k=KP.find(x=>x.id===i.dataset.tg),v=parseFloat(i.value);if(isFinite(v))o[k.id]=k.pct?v/100:v});D.ov[YR]=o;save();closeW();render();toast('Targets saved')}
});
document.addEventListener('change',e=>{if(e.target.id==='yr'){YR=+e.target.value;CMP='';render()}else if(e.target.id==='cmp'){CMP=e.target.value;render()}});
$('f').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{if(typeof XLSX==='undefined')throw new Error('the Excel library did not load — check the internet connection');
    const wb=XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:'array'}),p=parseWorkbook(wb);
    if(p.year&&p.year!==YR&&!confirm('The “Data” sheet of this file says '+p.year+', but the year chosen above is '+YR+'.\n\nStore these figures as '+YR+'?\n\n(Cancel, then choose '+p.year+' in the year box if the file really is '+p.year+'.)'))return;
    if(D.years[YR]&&!confirm('Replace the '+YR+' figures uploaded on '+String(D.years[YR].at).slice(0,10)+' ('+D.years[YR].file+')?'))return;
    const diff=[];KP.forEach(k=>{const own=p.own[k.id]||{};Object.keys(own).forEach(m=>{const mine=mval(k,p.raw[m]);if(mine!=null&&Math.abs(mine-own[m])>Math.max(1e-9,Math.abs(own[m])*0.005))diff.push(k.t+' '+MONS[m-1]+': mine '+fmt(k,mine)+' vs sheet '+fmt(k,own[m]))})});
    D.years[YR]={file:f.name,at:new Date().toISOString(),raw:p.raw,tg:p.tg,diff:diff.slice(0,20)};save();render();toast(YR+' figures loaded: '+Object.keys(p.raw).length+' months')}
  catch(err){toast('That file could not be read: '+err.message)}};
$('xl').onclick=()=>{const Y=D.years[YR];if(!Y)return;const S=KP.map(k=>({k,v:series(YR,k),t:tgt(YR,k.id),y:ytd(YR,k)}));
  const a=[['KPI','Unit','Better when','Target'].concat(MONS).concat(['Year to date','Year to date vs target','Months on target'])].concat(S.map(x=>{const ms=x.v.map(v=>met(x.k,v,x.t)),sc=x.k.pct?100:1,r=v=>v==null?'':+(v*sc).toFixed(4);return[x.k.t,x.k.u,x.k.dir==='low'?'lower':'higher',x.t==null?'':+(x.t*sc).toFixed(4)].concat(x.v.map(r)).concat([r(x.y),x.t==null||x.y==null?'':(met(x.k,x.y,x.t)?'on target':'off target'),ms.filter(z=>z!=null).length?ms.filter(z=>z===true).length+' of '+ms.filter(z=>z!=null).length:''])}));
