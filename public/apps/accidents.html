<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accident Registry — FIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--bg:#F2F0EB;--card:#fff;--ink:#1D2127;--soft:#5E6772;--line:#DDD8CF;--line2:#ECE8E0;--red:#DA1B22;--red-d:#B3151B;--red-bg:#FBE9EA;--amber:#B97708;--amber-bg:#FBF0D8;--green:#2C7A4B;--green-bg:#E1F0E7;--blue:#2B5A8C;--head:'Barlow Condensed','Arial Narrow',sans-serif}
  *{box-sizing:border-box}[hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Inter',system-ui,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  h1,h2,h3{font-family:var(--head);font-weight:600;margin:0}
  header{background:var(--card);border-bottom:3px solid var(--red);padding:12px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header img{height:38px;width:auto;border-radius:4px}
  h1{font-size:26px;text-transform:uppercase;line-height:1}.sub{color:var(--soft);font-size:12.5px;margin-top:3px}.grow{flex:1;min-width:240px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:500}.btn:hover{border-color:#B9B2A6}
  .btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.red:hover{background:var(--red-d)}.btn.sm{padding:3px 9px;font-size:12px}.btn.ghost{border-color:transparent;color:var(--soft)}.btn.ghost:hover{color:var(--red);background:var(--red-bg)}
  main{padding:16px 22px 50px;max-width:1450px;margin:0 auto}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px}
  .t{padding:12px 14px}.t small{display:block;color:var(--soft);font-size:12px}.t b{font:600 32px/1.1 var(--head)}.t b.red{color:var(--red)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .bar select,.bar input,.f input,.f select,.f textarea{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 9px;width:auto}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:14px;margin-bottom:14px}
  .cb{padding:12px 14px;height:320px;position:relative}.cb h3{font-size:17px;text-transform:uppercase;margin-bottom:6px}
  .tw{max-height:560px;overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
  th{position:sticky;top:0;background:#F7F4EE;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);z-index:1}
  .chip{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11.5px;font-weight:500;white-space:nowrap}
  .chip.fa{background:#E3ECF6;color:var(--blue)}.chip.mt{background:var(--amber-bg);color:#7A4F05}.chip.lt{background:var(--red-bg);color:var(--red-d)}.chip.fat{background:#2B1B1B;color:#fff}
  .chip.op{background:var(--amber-bg);color:#7A4F05}.chip.cl{background:var(--green-bg);color:var(--green)}
  .empty{padding:40px 20px;text-align:center;color:var(--soft);line-height:1.7}
  .veil{position:fixed;inset:0;background:rgba(29,33,39,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px;z-index:50;overflow:auto}
  .modal{background:#fff;border-radius:12px;width:min(760px,100%);padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
  .modal h2{font-size:24px;text-transform:uppercase;margin-bottom:12px}
  .f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.f label{display:block;font-size:12px;font-weight:600;color:var(--soft);margin-bottom:3px}
  .f input,.f select,.f textarea{width:100%}.f textarea{min-height:64px;resize:vertical}.f .w2{grid-column:1/-1}
  .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  #toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;z-index:60;pointer-events:none}#toast.show{opacity:1}
  .note{color:var(--soft);font-size:12.5px}
</style>
</head>
<body>
<header><img id="logo" alt="Ferentino"><div class="grow"><h1>Accident Registry</h1><div class="sub">Every workplace accident — recorded once, counted automatically in KPI 4.4 (Production KPI Dashboard)</div></div>

<div class="tiles" id="tiles"></div>
<div class="bar"><select id="fy"></select><select id="fm"></select><select id="fd"></select><select id="fs"></select><input id="fq" placeholder="Search name, EPF, description" style="min-width:240px"><span class="note" id="cnt"></span></div>
<div class="grid2"><div class="card cb"><h3>Accidents per month <span class="note" style="text-transform:none;font-family:Inter">· KPI 4.4 (production) with its target</span></h3><canvas id="c1"></canvas></div><div class="card cb"><h3>Causes</h3><canvas id="c2"></canvas></div></div>
<div class="card tw" id="tbl"></div>
</main>

const NATURE=['Cut / laceration','Burn / scald','Bruise','Fracture','Sprain / strain','Crush','Foreign body','Electric shock','Other'];
const CAUSE=['Hot surface / steam','Machine / moving part','Material handling','Slip, trip or fall','Struck by object','Falling object','Electrical','Chemical','Fire','Vehicle / forklift','Unsafe act','Other'];
const MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dot=s=>s?String(s).replace(/-/g,'.'):'';
const isProd=d=>/^production/i.test(d||'');
let A=[],TARGET=0,CH=[];const F={y:'',m:'',d:'',s:'',q:''};
try{A=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(_){A=[]}
try{const t=parseFloat(localStorage.getItem(TKEY));TARGET=isFinite(t)&&t>=0?t:0}catch(_){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(A))}catch(_){toast('Could not save — browser storage is full or blocked. Download a backup.')}publish()};
function publish(){try{if(parent!==window)parent.postMessage({type:'fitl-accidents',items:A.map(a=>({id:a.id,date:a.date,dept:a.dept,sev:a.sev,lost:+a.lost||0,status:a.status}))},'*')}catch(_){}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),3000)}
const sevOf=k=>SEV.find(s=>s[0]===k)||SEV[0];

/* ---------- screen ---------- */
function years(){const s=new Set(A.map(a=>a.date.slice(0,4)));s.add(String(new Date().getFullYear()));return[...s].sort().reverse()}
function filtered(){const q=F.q.trim().toLowerCase();return A.filter(a=>(!F.y||a.date.startsWith(F.y))&&(!F.m||a.date.slice(5,7)===F.m)&&(!F.d||a.dept===F.d)&&(!F.s||a.sev===F.s)&&(!q||[a.name,a.epf,a.desc,a.area,a.job].join(' ').toLowerCase().includes(q))).sort((x,y)=>(y.date+(y.time||''))<(x.date+(x.time||''))?-1:1)}
function fillFilters(){
  const opt=(v,t,sel)=>`<option value="${v}"${sel?' selected':''}>${t}</option>`;
  $('fy').innerHTML=opt('','All years',!F.y)+years().map(y=>opt(y,y,F.y===y)).join('');
  $('fm').innerHTML=opt('','All months',!F.m)+MONS.map((m,i)=>opt(pad(i+1),m,F.m===pad(i+1))).join('');
  $('fd').innerHTML=opt('','All departments',!F.d)+DEPTS.map(d=>opt(d,d,F.d===d)).join('');
  $('fs').innerHTML=opt('','All severities',!F.s)+SEV.map(s=>opt(s[0],s[1],F.s===s[0])).join('');
}
function render(){
  const yr=F.y||String(new Date().getFullYear()),mo=today().slice(0,7);
  const ytd=A.filter(a=>a.date.startsWith(yr)),prodY=ytd.filter(a=>isProd(a.dept));
  $('tiles').innerHTML=[['Production, this month',A.filter(a=>isProd(a.dept)&&a.date.startsWith(mo)).length,1],['Production, '+yr+' (KPI 4.4)',prodY.length,1],['All departments, '+yr,ytd.length,0],['Lost-time injuries, '+yr,ytd.filter(a=>a.sev==='lt'||a.sev==='fat').length,0],['Lost days, '+yr,ytd.reduce((s,a)=>s+(+a.lost||0),0),0],['Open cases',A.filter(a=>a.status!=='Closed').length,0]]
    .map(t=>`<div class="card t"><small>${t[0]}</small><b class="${t[2]&&t[1]>0?'red':''}">${t[1]}</b></div>`).join('');
  const rows=filtered();$('cnt').textContent=rows.length+' of '+A.length+' accident'+(A.length===1?'':'s');
  $('tbl').innerHTML=rows.length?`<table><thead><tr><th>Date</th><th>Shift</th><th>Department / area</th><th>Injured person</th><th>Injury</th><th>Cause</th><th>Severity</th><th>Lost days</th><th>Status</th><th></th></tr></thead><tbody>`+
   rows.map(a=>{const s=sevOf(a.sev);return`<tr><td style="white-space:nowrap"><b>${dot(a.date)}</b><div class="note">${esc(a.time||'')}</div></td><td>${esc(a.shift||'')}</td><td>${esc(a.dept)}<div class="note">${esc(a.area||'')}</div></td><td><b>${esc(a.name)}</b><div class="note">${a.epf?'EPF '+esc(a.epf):''}${a.job?' · '+esc(a.job):''}</div></td><td>${esc([a.body,a.nature].filter(Boolean).join(' · '))}<div class="note">${esc((a.desc||'').slice(0,110))}${(a.desc||'').length>110?'…':''}</div></td><td>${esc(a.cause||'')}</td><td><span class="${s[2]}">${s[1]}</span></td><td>${+a.lost||0}</td><td><span class="chip ${a.status==='Closed'?'cl':'op'}">${esc(a.status||'Open')}</span></td><td style="white-space:nowrap"><button class="btn sm" data-edit="${a.id}">Edit</button> <button class="btn sm ghost" data-del="${a.id}">Delete</button></td></tr>`}).join('')+'</tbody></table>'
   :'<div class="empty"><b>No accidents recorded'+(A.length?' for these filters':' yet')+'.</b><br>Use “Record an accident” to add one — production accidents are counted in KPI 4.4 automatically.</div>';
  charts(rows,yr);
}
function charts(rows,yr){
  CH.forEach(c=>c.destroy());CH=[];if(typeof Chart==='undefined')return;
  Chart.defaults.font.family="Inter,system-ui,sans-serif";
  const per=MONS.map((_,i)=>{const k=yr+'-'+pad(i+1),m=A.filter(a=>a.date.startsWith(k));return{p:m.filter(a=>isProd(a.dept)).length,o:m.filter(a=>!isProd(a.dept)).length}});
  CH.push(new Chart($('c1'),{data:{labels:MONS,datasets:[{type:'bar',label:'Production',data:per.map(x=>x.p),backgroundColor:'#DA1B22',stack:'a'},{type:'bar',label:'Other departments',data:per.map(x=>x.o),backgroundColor:'#B9B2A6',stack:'a'},{type:'line',label:'KPI 4.4 target ('+TARGET+')',data:MONS.map(()=>TARGET),borderColor:'#1F3A5F',borderDash:[6,4],pointRadius:0,backgroundColor:'#1F3A5F'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true,ticks:{precision:0},title:{display:true,text:'accidents · '+yr}}}}}));
  const cs={};rows.forEach(a=>{const k=a.cause||'Not stated';cs[k]=(cs[k]||0)+1});const top=Object.entries(cs).sort((a,b)=>b[1]-a[1]).slice(0,10);
  CH.push(new Chart($('c2'),{type:'bar',data:{labels:top.map(x=>x[0]),datasets:[{data:top.map(x=>x[1]),backgroundColor:'#9CB4D6'}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{precision:0}}}}}));
}

/* ---------- form ---------- */
const sel=(id,list,v,blank)=>`<select id="${id}">${blank?'<option value=""></option>':''}${list.map(x=>{const val=Array.isArray(x)?x[0]:x,t=Array.isArray(x)?x[1]:x;return`<option value="${esc(val)}"${val===v?' selected':''}>${esc(t)}</option>`}).join('')}</select>`;
function openForm(id){
  const a=id?A.find(x=>x.id===id):{date:today(),time:'',shift:'Day',dept:DEPTS[0],area:'',name:'',epf:'',job:'',sev:'fa',lost:0,body:'',nature:'',cause:'',desc:'',action:'',ref:'',by:'',status:'Open'};
  $('host').innerHTML=`<div class="veil"><div class="modal"><h2>${id?'Edit accident':'Record an accident'}</h2><div class="f">
  <div><label>Date *</label><input type="date" id="g_date" value="${esc(a.date)}"></div><div><label>Time</label><input type="time" id="g_time" value="${esc(a.time)}"></div>
  <div><label>Shift</label>${sel('g_shift',['Day','Night'],a.shift)}</div><div><label>Department *</label>${sel('g_dept',DEPTS,a.dept)}</div>
  <div><label>Area / press / location</label><input id="g_area" value="${esc(a.area)}" placeholder="e.g. 3M press bank"></div>
  <div><label>Injured person *</label><input id="g_name" value="${esc(a.name)}"></div><div><label>EPF no</label><input id="g_epf" value="${esc(a.epf)}"></div><div><label>Job title</label><input id="g_job" value="${esc(a.job)}"></div>
  <div><label>Severity *</label>${sel('g_sev',SEV.map(s=>[s[0],s[1]]),a.sev)}</div><div><label>Days lost</label><input type="number" min="0" id="g_lost" value="${+a.lost||0}"></div>
  <div><label>Body part</label>${sel('g_body',BODY,a.body,1)}</div><div><label>Nature of injury</label>${sel('g_nature',NATURE,a.nature,1)}</div><div><label>Cause</label>${sel('g_cause',CAUSE,a.cause,1)}</div>
  <div class="w2"><label>What happened *</label><textarea id="g_desc">${esc(a.desc)}</textarea></div>
  <div class="w2"><label>Immediate action taken</label><textarea id="g_action">${esc(a.action)}</textarea></div>
  <div><label>Corrective action / CAPA reference</label><input id="g_ref" value="${esc(a.ref)}" placeholder="e.g. I/0526"></div><div><label>Reported by</label><input id="g_by" value="${esc(a.by)}"></div><div><label>Status</label>${sel('g_status',['Open','Closed'],a.status)}</div></div>
  <div class="foot"><button class="btn" id="g_no">Cancel</button><button class="btn red" id="g_ok">${id?'Save changes':'Add to registry'}</button></div></div></div>`;
  $('g_no').onclick=()=>$('host').innerHTML='';
  $('g_ok').onclick=()=>{
    const g=k=>$('g_'+k).value.trim();if(!g('date')||!g('name')||!g('desc')){toast('Date, injured person and “What happened” are needed');return}
    const rec={id:id||('a'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)),date:g('date'),time:g('time'),shift:g('shift'),dept:g('dept'),area:g('area'),name:g('name'),epf:g('epf'),job:g('job'),sev:g('sev'),lost:Math.max(0,parseInt(g('lost'),10)||0),body:g('body'),nature:g('nature'),cause:g('cause'),desc:g('desc'),action:g('action'),ref:g('ref'),by:g('by'),status:g('status')};
    if(id)A[A.findIndex(x=>x.id===id)]=rec;else A.push(rec);save();$('host').innerHTML='';fillFilters();render();toast(id?'Saved':'Accident recorded')};
}
document.addEventListener('click',e=>{
  const ed=e.target.closest('[data-edit]');if(ed){openForm(ed.dataset.edit);return}
  const dl=e.target.closest('[data-del]');if(dl){const a=A.find(x=>x.id===dl.dataset.del);if(a&&confirm('Delete the accident of '+a.name+' on '+dot(a.date)+'?\nThis cannot be undone.')){A=A.filter(x=>x!==a);save();fillFilters();render()}}
});
$('add').onclick=()=>openForm();
['fy','fm','fd','fs'].forEach(id=>$(id).onchange=e=>{F[id.slice(1)]=e.target.value;render()});
$('fq').oninput=e=>{F.q=e.target.value;render()};
$('xl').onclick=()=>{const rows=filtered().slice().reverse().map(a=>({Date:a.date,Time:a.time,Shift:a.shift,Department:a.dept,'Area / location':a.area,'Injured person':a.name,'EPF no':a.epf,'Job title':a.job,Severity:sevOf(a.sev)[1],'Days lost':+a.lost||0,'Body part':a.body,'Nature of injury':a.nature,Cause:a.cause,'What happened':a.desc,'Immediate action':a.action,'CAPA reference':a.ref,'Reported by':a.by,Status:a.status,'Counts in KPI 4.4':isProd(a.dept)?'Yes':'No'}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Accident registry');XLSX.writeFile(wb,'Accident_Registry_'+today()+'.xlsx')};
$('bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(A,null,1)],{type:'application/json'}));a.download='Accident_Registry_backup_'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)};
$('rs').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j)||j.some(x=>!x.date))throw 0;if(!confirm('Restoring replaces the '+A.length+' accidents currently in the registry with '+j.length+' from the backup. Continue?'))return;A=j;save();fillFilters();render();toast('Backup restored')}catch(_){toast('That is not an accident registry backup')}};r.readAsText(f);e.target.value=''};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('host').innerHTML=''});
// the KPI 4.4 target for the chart
const tl=document.createElement('label');tl.className='note';tl.innerHTML='KPI 4.4 target <input type="number" id="tg" min="0" step="1" style="width:70px;border:1px solid var(--line);border-radius:6px;padding:5px 8px"> per month';$('cnt').after(tl);
$('tg').value=TARGET;$('tg').onchange=e=>{const v=parseFloat(e.target.value);TARGET=isFinite(v)&&v>=0?v:0;try{localStorage.setItem(TKEY,String(TARGET))}catch(_){}render()};
fillFilters();render();publish();
try{parent.postMessage({type:'fitl-accidents-ready'},'*')}catch(_){}
})();
</script>
</body>
</html>
