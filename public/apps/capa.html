<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAPA Control Platform — FITL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F2F0EB; --card:#FFFFFF; --ink:#1D2127; --soft:#5E6772; --line:#DDD8CF; --line2:#ECE8E0;
    --red:#DA1B22; --red-d:#B3151B; --red-bg:#FBE9EA;
    --amber:#B97708; --amber-bg:#FBF0D8;
    --green:#2C7A4B; --green-bg:#E1F0E7;
    --blue:#2B5A8C; --blue-bg:#E3ECF6;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    --head:'Barlow Condensed','Arial Narrow',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
  button,input,select,textarea{font:inherit;color:inherit;}
  h1,h2,h3{font-family:var(--head);font-weight:600;letter-spacing:.01em;margin:0;}
  .mono{font-family:var(--mono);font-size:12.5px;}
  .muted{color:var(--soft);}
  [hidden]{display:none !important;}

  /* header */
  .top{background:var(--card);border-bottom:3px solid var(--red);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand img{height:38px;width:auto;border-radius:4px;display:block;}
  .brand h1{font-size:25px;text-transform:uppercase;line-height:1;}
  .brand p{margin:3px 0 0;font-size:12px;color:var(--soft);}
  .top-note{font-size:12px;color:var(--soft);text-align:right;line-height:1.45;}
  .top-note b{color:var(--ink);font-weight:600;}

  /* nav */
  .tabs{background:var(--card);border-bottom:1px solid var(--line);padding:0 22px;display:flex;gap:2px;overflow-x:auto;}
  .tab{background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-1px;padding:11px 14px 9px;cursor:pointer;white-space:nowrap;color:var(--soft);text-align:left;}
  .tab:hover{color:var(--ink);}
  .tab.on{color:var(--ink);border-bottom-color:var(--red);}
  .tab .t1{display:block;font-weight:600;font-size:13.5px;}
  .tab .t2{display:block;font-family:var(--mono);font-size:10.5px;opacity:.75;margin-top:1px;}
  .badge{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;line-height:18px;text-align:center;vertical-align:1px;}
  .badge.grey{background:#8A929B;}

  main{padding:20px 22px 60px;max-width:1500px;margin:0 auto;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
  .page-head h2{font-size:26px;text-transform:uppercase;}
  .page-head .docno{font-family:var(--mono);font-size:12px;color:var(--soft);margin-left:10px;text-transform:none;letter-spacing:0;}
  .page-head p{margin:4px 0 0;color:var(--soft);max-width:78ch;line-height:1.5;}

  /* controls */
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .btn{border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:7px;cursor:pointer;font-weight:500;font-size:13px;}
  .btn:hover{border-color:#B9B2A6;background:#FBFAF8;}
  .btn.red{background:var(--red);border-color:var(--red);color:#fff;}
  .btn.red:hover{background:var(--red-d);border-color:var(--red-d);}
  .btn.sm{padding:4px 9px;font-size:12px;}
  .btn.ghost{background:none;border-color:transparent;color:var(--soft);}
  .btn.ghost:hover{color:var(--red);background:var(--red-bg);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  select,input[type=text],input[type=date],input[type=number],textarea{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 9px;width:100%;}
  textarea{resize:vertical;min-height:54px;line-height:1.45;}
  .bar select,.bar input[type=text]{width:auto;}
  input:focus,select:focus,textarea:focus{outline:2px solid #E8A0A3;outline-offset:0;border-color:var(--red);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;}
  .empty{padding:36px 20px;text-align:center;color:var(--soft);line-height:1.6;}
  .empty b{color:var(--ink);}

  /* register tables */
  .tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:calc(100vh - 250px);}
  table.reg{border-collapse:separate;border-spacing:0;width:100%;min-width:880px;}
  table.reg th{position:sticky;top:0;z-index:2;background:#F7F4EE;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);padding:9px 10px;border-bottom:1px solid var(--line);font-weight:600;}
  table.reg th.c,table.reg td.c{text-align:center;}
  table.reg thead tr:nth-child(2) th{top:34px;}
  table.reg td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top;}
  table.reg tr.shift-first td{border-top:2px solid var(--line);}
  table.reg tr.need td:first-child{box-shadow:inset 3px 0 0 var(--amber);}
  table.reg tr.noissue td.detail{color:var(--soft);font-style:italic;}
  .code{font-family:var(--mono);font-size:12.5px;font-weight:500;white-space:nowrap;}
  .chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:500;white-space:nowrap;}
  .chip.amber{background:var(--amber-bg);color:#7A4F05;}
  .chip.green{background:var(--green-bg);color:var(--green);}
  .chip.blue{background:var(--blue-bg);color:var(--blue);}
  .chip.red{background:var(--red-bg);color:var(--red-d);}
  .chip.grey{background:#ECE9E3;color:var(--soft);}
  .meta{font-size:12px;color:var(--soft);margin-top:3px;}
  .tick{width:18px;height:18px;accent-color:var(--red);cursor:pointer;}
  .tick:disabled{cursor:not-allowed;opacity:.35;}
  .none-btn{border:1px dashed #BDB6A9;background:none;border-radius:6px;padding:2px 8px;font-size:11.5px;color:var(--soft);cursor:pointer;}
  .none-btn.on{border-style:solid;border-color:var(--green);background:var(--green-bg);color:var(--green);}

  /* overview */
  .chain{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:22px;}
  .step{padding:15px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;position:relative;text-align:left;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;}
  .step:hover{border-color:#B9B2A6;}
  .step .n{font-family:var(--head);font-size:13px;font-weight:600;color:var(--red);letter-spacing:.06em;text-transform:uppercase;}
  .step h3{font-size:19px;margin:3px 0 1px;}
  .step .doc{font-family:var(--mono);font-size:11px;color:var(--soft);}
  .step .big{font-family:var(--head);font-size:36px;font-weight:600;line-height:1;margin:12px 0 2px;}
  .step .big.alert{color:var(--red);}
  .step .sub{font-size:12.5px;color:var(--soft);line-height:1.45;}
  .two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;}
  @media (max-width:980px){.two{grid-template-columns:1fr;}}
  .panel{padding:16px 18px;}
  .panel h3{font-size:19px;text-transform:uppercase;margin-bottom:10px;}
  .qrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line2);}
  .qrow:first-of-type{border-top:none;}
  .qrow .grow{flex:1;min-width:0;}
  .flow{font-size:13px;line-height:1.7;color:var(--soft);}
  .flow b{color:var(--ink);}

  /* issue cards */
  .icard{margin-bottom:14px;overflow:hidden;}
  .ihead{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap;}
  .ihead .code{font-size:16px;font-weight:600;}
  .ihead .grow{flex:1;min-width:260px;}
  .ibody{padding:4px 16px 14px;}
  table.sub{width:100%;border-collapse:collapse;margin-top:8px;}
  table.sub th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);}
  table.sub td{padding:5px 6px;vertical-align:top;border-bottom:1px solid var(--line2);}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
  label.f{display:block;font-size:12px;font-weight:600;color:var(--soft);margin-bottom:4px;}
  .checks{display:flex;flex-wrap:wrap;gap:6px 16px;}
  .checks label{display:flex;gap:7px;align-items:center;cursor:pointer;}
  .rchips{display:flex;gap:6px;flex-wrap:wrap;}
  .rchips label{display:flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:2px 10px 2px 7px;cursor:pointer;background:#fff;}

  /* follow-up slots */
  .slot{width:100%;min-height:46px;border:1px dashed #CFC8BB;background:none;border-radius:6px;padding:4px 6px;cursor:pointer;text-align:left;font-size:12px;color:var(--soft);}
  .slot:hover{border-color:var(--red);color:var(--red);}
  .slot.has{border:1px solid var(--line);background:#FBFAF7;color:var(--ink);}
  .slot .d{font-family:var(--mono);font-size:12px;font-weight:500;display:block;}

  /* modal + toast */
  .veil{position:fixed;inset:0;background:rgba(29,33,39,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:#fff;border-radius:12px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal h3{font-size:22px;text-transform:uppercase;margin-bottom:12px;}
  .modal .row{margin-bottom:12px;}
  .modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  #toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transform:translateY(8px);transition:.2s;z-index:60;pointer-events:none;max-width:420px;}
  #toast.show{opacity:1;transform:none;}

  /* print */
  #printArea{display:none;}
  .dh{width:100%;border-collapse:collapse;margin-bottom:10px;font-family:Calibri,Arial,sans-serif;}
  .dh td,.dh th{border:1px solid #444;padding:4px 7px;font-size:11px;vertical-align:middle;}
  .dh .l{width:26%;text-align:center;} .dh .l img{height:30px;display:block;margin:0 auto 4px;}
  .dh .m{text-align:center;} .dh .sys{font-weight:700;letter-spacing:.06em;font-size:12px;} .dh .ttl{font-weight:700;font-size:15px;margin-top:3px;}
  .dh .r{padding:0;width:34%;} .dh .r table{width:100%;border-collapse:collapse;} .dh .r th{text-align:left;background:#eee;width:26%;}
  .pt{width:100%;border-collapse:collapse;font-family:Calibri,Arial,sans-serif;}
  .pt th{background:#E9E9E9;border:1px solid #444;padding:5px 6px;font-size:11px;}
  .pt td{border:1px solid #444;padding:5px 6px;font-size:11px;vertical-align:top;}
  .pt td.cc{text-align:center;}
  @media print{
    body{background:#fff;}
    body > *:not(#printArea){display:none !important;}
    #printArea{display:block;}
  }
</style>
</head>

<div id="app"></div>
<div id="modalHost"></div>
<div id="toast"></div>
<div id="printArea"></div>

function ingestShifts(items){

    else if(sh.controller!==(it.controller||'')||sh.shiftLabel!==(it.shiftLabel||'')){sh.controller=it.controller||'';sh.shiftLabel=it.shiftLabel||'';changed=true;shDirty=true;}
    const seen={};
    (it.risks||[]).forEach(r=>{
      const k=riskKey(r);seen[k]=1;
      if(!sh.risks.some(x=>x.k===k)){
        sh.risks.push({id:uid(),k,round:r.round==null?null:r.round,recordedAt:r.recordedAt||'',stage:r.stage||'',subStep:r.subStep||'',failureMode:r.failureMode||'',cause:r.cause||'',ap:r.ap||'',
          rca:false,training:false,instruction:false,none:false,issueCode:''});changed=true;shDirty=true;
      }

    sh.risks=sh.risks.filter(x=>seen[x.k]||decided(x)||x.issueCode);   // drop vanished risks only if nothing was decided on them

function flushFU(iss,fus){

      const ex=a.followups.find(x=>x.meetKey===f.key);
      if(ex){if(ex.date!==f.date||ex.ref!==f.ref||ex.note!==(f.note||'')){ex.date=f.date;ex.ref=f.ref;ex.note=f.note||'';changed=true;}}

    });
    // the form has five slots: keep the latest meeting follow-ups if there are more than fit
    while(a.followups.length>5){const ix=a.followups.findIndex(x=>x.meetKey);if(ix<0)break;a.followups.splice(ix,1);changed=true;}

    (it.causes||[]).forEach((cz,i)=>{
      const k='rca:'+i,ex=iss.causes.find(x=>x.rcaKey===k);
      if(ex){if(ex.cause!==cz.cause||ex.root!==cz.root){ex.cause=cz.cause;ex.root=cz.root;changed=true;}}

/* ---- RG-QA-09 ---- */
function p09Filter(){
  const months=Array.from(new Set(S.shifts.map(s=>s.date.slice(0,7)))).sort().reverse();
  if(V.month===null)V.month=months[0]||'all';
  let list=S.shifts.slice();
  if(V.month!=='all')list=list.filter(s=>s.date.slice(0,7)===V.month);
  const q=V.q.trim().toLowerCase();
  if(q)list=list.filter(s=>[s.controller,s.shiftCode,s.date,dot(s.date)].concat(s.risks.map(r=>[r.stage,riskDetail(r),r.issueCode].join(' '))).join(' ').toLowerCase().includes(q));
  if(V.status==='need')list=list.filter(s=>s.risks.some(r=>!decided(r)));
  else if(V.status==='done')list=list.filter(s=>s.risks.length&&s.risks.every(decided));
  else if(V.status==='clear')list=list.filter(s=>!s.risks.length);
  list.sort((a,b)=>b.date.localeCompare(a.date)||a.shiftCode.localeCompare(b.shiftCode));
  return{months,list};
}

        '<td>'+esc(r.stage||'—')+'</td><td class="detail">'+esc(riskDetail(r))+(riskMeta(r)?'<div class="meta">'+esc(riskMeta(r))+'</div>':'')+'</td>'+

    years.map(y=>'<tr><td class="code">20'+y+'</td><td><input type="number" min="0" data-act="maxI" data-y="'+y+'" value="'+(S.max.I[y]||0)+'" style="width:90px"></td><td><input type="number" min="0" data-act="maxA" data-y="'+y+'" value="'+(S.max.A[y]||0)+'" style="width:90px"></td></tr>').join('')+'</tbody></table></div>'+
    '<div class="card panel"><h3>Backup &amp; reset</h3><div class="bar" style="flex-direction:column;align-items:stretch;gap:10px"><button class="btn" data-act="backup">Download backup (.json)</button>'+
    '<label class="btn" style="text-align:center">Restore backup…<input type="file" accept=".json,application/json" data-act="restore" style="display:none"></label>'+
    '<button class="btn" data-act="reseed">Reset to the existing registers</button><button class="btn ghost" data-act="wipe">Delete everything</button></div>'+
    '<p class="muted" style="margin-bottom:0">“Reset to the existing registers” goes back to the issues, action plans and follow-ups from the Word registers. Shifts and the decisions made here are removed; shifts arrive again from Press Monitoring.</p></div></div>';
  return h;
}

/* ---- render ---- */
function render(){
  const c=counts();
  const y0=window.scrollY;const w=$('.tbl-wrap');const wy=w?w.scrollTop:0;
  const body={overview:()=>viewOverview(c),p09:viewP09,p10:viewP10,p11:viewP11,p12:viewP12,p26:viewP26,set:viewSet}[tab]();

    '<div class="top-note"><b>Quality Management System</b><br>FIT/Q/QSP-QA-01 · RG-QA-09 · 10 · 11 · 12 · FO-QA-26</div></header><nav class="tabs">'+renderNav(c)+'</nav><main>'+body+'</main>';
  const w2=$('.tbl-wrap');if(w2)w2.scrollTop=wy;window.scrollTo(0,y0);
}

/* ================= EXPORT / PRINT MODELS ================= */
const H=(t,o)=>Object.assign({t},o||{});
function model(m,opt){
  if(m==='p09'){
    const {list}=p09Filter();const rows=[];
    list.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.shiftCode.localeCompare(b.shiftCode)).forEach(s=>{
      if(!s.risks.length)rows.push([dot(s.date),shiftText(s),s.controller||'','—',NO_ISSUE,'','','','']);
      else s.risks.forEach(r=>rows.push([dot(s.date),shiftText(s),s.controller||'',r.stage||'',[riskDetail(r),riskMeta(r)].filter(Boolean).join('\n'),r.issueCode||'',r.rca?'✓':'',r.training?'✓':'',r.instruction?'✓':'']));
    });
    return{widths:[11,22,16,18,56,11,12,10,11],center:[6,7,8],
      header:[[H('Date',{rs:2}),H('Shift',{rs:2}),H('Process Controller',{rs:2}),H('Risk Stage',{rs:2}),H('Risk Detail',{rs:2}),H('Issue Code',{rs:2}),H('Action Required',{cs:3})],[H('Root Cause Analysis'),H('Training'),H('Instruction')]],rows};
  }
  if(m==='p10'){
    const rows=[];S.issues.slice().sort((a,b)=>a.date.localeCompare(b.date)||codeNum(a.code)-codeNum(b.code)).forEach(i=>{
      if(!i.causes.length)rows.push([dot(i.date),i.issue,i.code,'','','']);
      else i.causes.forEach(c=>rows.push([dot(i.date),i.issue,i.code,c.cause,c.root,c.r?rootCode(i.code,c.r):'']));
    });
    return{widths:[11,40,10,34,44,13],center:[],header:[['Date','Issue','Issue Code','Cause','Root Cause','Root Cause Code'].map(t=>H(t))],rows};
  }
  if(m==='p11'){
    const rows=S.actions.slice().sort((a,b)=>codeNum(a.issueCode)-codeNum(b.issueCode)||codeNum(a.code)-codeNum(b.code)).map(a=>[a.issueCode,a.roots.map(n=>rootCode(a.issueCode,n)).join('\n'),a.plan,a.code]);
    return{widths:[11,16,80,13],center:[],header:[['Issue Code','Root cause code','Action Plan','Action Plan Code'].map(t=>H(t))],rows};
  }
  if(m==='p12'){
    const rows=S.actions.slice().sort((a,b)=>codeNum(a.issueCode)-codeNum(b.issueCode)||codeNum(a.code)-codeNum(b.code)).map(a=>[a.issueCode,a.code].concat([0,1,2,3,4].map(k=>a.followups[k]?(dot(a.followups[k].date)+(a.followups[k].ref?'\n'+a.followups[k].ref:'')+(a.followups[k].note?'\n'+a.followups[k].note:'')):'')));
    return{widths:[11,11,24,24,24,24,24],center:[],header:[['Issue Code','Action Plan code'].concat(ORD.map(o=>o+' discussed date / reference / note')).map(t=>H(t))],rows};
  }
  if(m==='p26'){
    const p=S.prevent.find(x=>x.id===opt);if(!p)return null;
    const trig=TRIGGERS.map(t=>(p.triggers.includes(t)?'☑ ':'☐ ')+t).join('  ')+'  '+(p.triggerOther?'☑ Other: '+p.triggerOther:'☐ Other: ________');
    const sub=SUBMIT_TO.map(t=>(p.submittedTo.includes(t)?'☑ ':'☐ ')+t).join('  ');
    return{widths:[30,100],center:[],title:FORMS.p26.title+' – (Issue ID '+(p.issueCode||'')+')',
      header:[[H('Field'),H('Details')]],
      rows:[['Date of Issue',dot(p.dateIssue)],['Date Observed',dot(p.dateObserved)],['Observed By',p.observedBy],['Department / Area',p.dept],['Observation/ Issue',p.observation],
        ['What triggered this observation?',trig],['Responsibility',p.responsibility],['Immediate Containment (if any taken)',p.containment],['Suggested Action',p.suggested],['Submitted To',sub]]};
  }
}
function docHeadRows(m,mod){
  const f=FORMS[m];const title=mod.title||f.title;
  return[['QUALITY MANAGEMENT SYSTEM','','Doc No',f.no],['FERENTINO INDUSTRIAL TIRE (PVT) LTD / SRI LANKA',title,'Issue No',ISSUE_NO,'Revision No',REV_NO],['','','Issue Date',ISSUE_DATE,'Revision Date','']];
}
function downloadBlob(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
}
function exportXlsx(m,opt){
  if(typeof XLSX==='undefined'){toast('Excel export needs the internet connection the first time (library not loaded)');return;}
  const mod=model(m,opt);if(!mod)return;
  const aoa=docHeadRows(m,mod);const merges=[];
  const top=aoa.length+1;aoa.push([]);
  // header rows with spans
  const grid=mod.header.map(()=>[]);const occupied={};
  mod.header.forEach((row,ri)=>{let ci=0;row.forEach(cell=>{
    while(occupied[ri+','+ci])ci++;
    grid[ri][ci]=cell.t;
    const rs=cell.rs||1,cs=cell.cs||1;
    for(let a=0;a<rs;a++)for(let b=0;b<cs;b++){if(a||b)occupied[(ri+a)+','+(ci+b)]=1;}
    if(rs>1||cs>1)merges.push({s:{r:top+ri,c:ci},e:{r:top+ri+rs-1,c:ci+cs-1}});
    ci+=cs;});});
  grid.forEach(r=>aoa.push(r));
  mod.rows.forEach(r=>aoa.push(r.map(v=>v==null?'':String(v).replace(/\n/g,' / '))));
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges']=merges;ws['!cols']=mod.widths.map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,FORMS[m].no.split('/').pop());
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  downloadBlob(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),FORMS[m].file+'.xlsx');
  toast('Excel file downloaded');
}
function printReg(m,opt){
  const mod=model(m,opt);if(!mod)return;const f=FORMS[m];
  const head='<table class="dh"><tr><td class="l"><img src="'+LOGO+'" alt="">FERENTINO INDUSTRIAL TIRE (PVT) LTD<br>SRI LANKA</td><td class="m"><div class="sys">QUALITY MANAGEMENT SYSTEM</div><div class="ttl">'+esc(mod.title||f.title)+'</div></td>'+
    '<td class="r"><table><tr><th>Doc No</th><td colspan="3">'+f.no+'</td></tr><tr><th>Issue No</th><td>'+ISSUE_NO+'</td><th>Revision No</th><td>'+REV_NO+'</td></tr><tr><th>Issue Date</th><td>'+ISSUE_DATE+'</td><th>Revision Date</th><td></td></tr></table></td></tr></table>';
  const thead=mod.header.map(r=>'<tr>'+r.map(c=>'<th'+(c.rs?' rowspan="'+c.rs+'"':'')+(c.cs?' colspan="'+c.cs+'"':'')+'>'+esc(c.t)+'</th>').join('')+'</tr>').join('');
  const tbody=mod.rows.map(r=>'<tr>'+r.map((v,i)=>'<td'+(mod.center.includes(i)?' class="cc"':'')+'>'+nl(v)+'</td>').join('')+'</tr>').join('');
  $('#printArea').innerHTML=head+'<table class="pt"><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table>';
  let st=$('#pageStyle');if(!st){st=document.createElement('style');st.id='pageStyle';document.head.appendChild(st);}
  st.textContent='@page{size:A4 '+f.orient+';margin:12mm;}';
  setTimeout(()=>window.print(),60);
}

/* ================= MODALS ================= */
function modal(html,bind){
  const host=$('#modalHost');host.innerHTML='<div class="veil"><div class="modal">'+html+'</div></div>';
  host.querySelector('.veil').addEventListener('mousedown',e=>{if(e.target.classList.contains('veil'))closeModal();});
  if(bind)bind(host);
}
function closeModal(){$('#modalHost').innerHTML='';}

/* ================= ACTIONS ================= */
const byId=(arr,id)=>arr.find(x=>x.id===id);
function onClick(e){
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='tab'){e.preventDefault();tab=el.dataset.t;render();window.scrollTo(0,0);return;}
  if(a==='goRisk'){tab='p09';V.month='all';V.status='all';V.q='';render();const t=document.getElementById('sh-'+el.dataset.sk);if(t)t.scrollIntoView({block:'center'});return;}
  if(a==='none'){setNone(el.dataset.sk,el.dataset.rid);return;}
  if(a==='xlsx'){exportXlsx(el.dataset.m,el.dataset.id);return;}
  if(a==='print'){printReg(el.dataset.m,el.dataset.id);return;}
  if(a==='addIssue'){
    modal('<h3>Add issue</h3><div class="row"><label class="f">Date</label><input type="date" id="mDate" value="'+todayISO()+'"></div><div class="row"><label class="f">Issue</label><textarea id="mText" style="min-height:90px" placeholder="What went wrong, and how it was noticed"></textarea></div><div class="foot"><button class="btn" id="mNo">Cancel</button><button class="btn red" id="mYes">Add issue</button></div>',h=>{
      $('#mNo',h).onclick=closeModal;$('#mText',h).focus();
      $('#mYes',h).onclick=()=>{const t=$('#mText',h).value.trim();if(!t){toast('Describe the issue first');return;}
        const it=newIssue({date:$('#mDate',h).value||todayISO(),issue:t,source:'manual',rca:false});closeModal();save();render();toast(it.code+' added');};});return;}
  if(a==='delIssue'){
    const i=byId(S.issues,el.dataset.id);if(!i)return;const n=S.actions.filter(x=>x.issueCode===i.code).length;
    if(!confirm('Delete issue '+i.code+(n?' and its '+n+' action plan'+(n===1?'':'s')+' (with their follow-ups)':'')+'?\nThis cannot be undone. A case already in the RCA Workbench is not removed.'))return;
    S.actions=S.actions.filter(x=>x.issueCode!==i.code);
    S.shifts.forEach(s=>s.risks.forEach(r=>{if(r.issueCode===i.code){r.issueCode='';r.rca=false;markShiftDirty(s.key);}}));
    S.prevent.forEach(p=>{if(p.issueCode===i.code)p.issueCode='';});
    S.issues=S.issues.filter(x=>x!==i);save();render();return;}
  if(a==='addCause'){const i=byId(S.issues,el.dataset.id);if(i){i.causes.push({id:uid(),cause:'',root:'',r:null});save();render();}return;}
  if(a==='delCause'){const i=byId(S.issues,el.dataset.id);if(i){i.causes=i.causes.filter(c=>c.id!==el.dataset.cid);save();render();}return;}
  if(a==='addAction'){
    const na=V.newAct;if(!na.issue){toast('Choose the issue first');return;}if(!na.plan.trim()){toast('Describe the action plan');return;}
    const iss=findIssue(na.issue);const ac={id:uid(),code:nextCode('A',iss?iss.date:todayISO()),issueCode:na.issue,roots:na.roots.slice().sort((x,y)=>x-y),plan:na.plan.trim(),closed:false,followups:[]};
    S.actions.push(ac);if(iss)flushFU(iss);V.newAct={issue:na.issue,roots:[],plan:''};save();render();toast(ac.code+' added');return;}
  if(a==='delAction'){const x=byId(S.actions,el.dataset.id);if(x&&confirm('Delete action plan '+x.code+' and its follow-ups?')){S.actions=S.actions.filter(y=>y!==x);save();render();}return;}
  if(a==='slot'){
    const x=byId(S.actions,el.dataset.id);const k=+el.dataset.k;if(!x)return;const cur=x.followups[k]||{date:todayISO(),ref:'',note:''};
    modal('<h3>'+ORD[k]+' follow-up — '+esc(x.code)+'</h3><div class="row"><label class="f">Discussed date</label><input type="date" id="mDate" value="'+esc(cur.date)+'"></div><div class="row"><label class="f">Reference</label><input type="text" id="mRef" value="'+esc(cur.ref)+'" placeholder="e.g. WMM-Issue 18"></div><div class="row"><label class="f">Update / Discussion Note</label><textarea id="mNote" placeholder="What was discussed or updated at this follow-up">'+esc(cur.note||'')+'</textarea></div><div class="foot">'+(x.followups[k]?'<button class="btn ghost" id="mDel" style="margin-right:auto">Remove</button>':'')+'<button class="btn" id="mNo">Cancel</button><button class="btn red" id="mYes">Save</button></div>',h=>{
      $('#mNo',h).onclick=closeModal;
      if($('#mDel',h))$('#mDel',h).onclick=()=>{x.followups.splice(k,1);closeModal();save();render();};
      $('#mYes',h).onclick=()=>{const d=$('#mDate',h).value;if(!d){toast('Pick the discussed date');return;}x.followups[k]={date:d,ref:$('#mRef',h).value.trim(),note:$('#mNote',h).value.trim()};closeModal();save();render();};});return;}
  if(a==='addPrev'){const p={id:uid(),issueCode:'',dateIssue:todayISO(),dateObserved:todayISO(),observedBy:'',dept:'',observation:'',triggers:[],triggerOther:'',responsibility:'',containment:'',suggested:'',submittedTo:[]};S.prevent.push(p);V.pv=p.id;save();render();return;}
  if(a==='openPrev'){V.pv=el.dataset.id;render();setTimeout(()=>{const c=$('.card.panel');if(c)c.scrollIntoView({block:'start'});},0);return;}
  if(a==='delPrev'){const p=byId(S.prevent,el.dataset.id);if(p&&confirm('Delete this observation form?')){S.prevent=S.prevent.filter(x=>x!==p);V.pv=null;save();render();}return;}
  if(a==='logPrev'){
    const p=byId(S.prevent,el.dataset.id);if(!p)return;
    if(!(p.observation||'').trim()){toast('Fill in the observation first');return;}
    const first=(p.observation.split(/\n/)[0]||'').trim();
    modal('<h3>Log as issue</h3><p class="muted" style="margin-top:0">Creates an issue in RG-QA-10 with its own issue code, exactly as an actual nonconformity would be logged.</p><div class="row"><label class="f">Issue statement</label><textarea id="mText" style="min-height:90px">'+esc(first.length>300?first.slice(0,297)+'…':first)+'</textarea></div><div class="foot"><button class="btn" id="mNo">Cancel</button><button class="btn red" id="mYes">Log issue</button></div>',h=>{
      $('#mNo',h).onclick=closeModal;
      $('#mYes',h).onclick=()=>{const t=$('#mText',h).value.trim();if(!t){toast('Write the issue statement');return;}
        const it=newIssue({date:p.dateObserved||todayISO(),issue:t,source:'preventive',rca:false});p.issueCode=it.code;closeModal();save();render();toast('Logged as '+it.code);};});return;}
  if(a==='backup'){downloadBlob(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),'CAPA_backup_'+todayISO()+'.json');return;}
  if(a==='reseed'){if(confirm('Reset to the existing registers?\nShifts received and every decision made here will be removed.')){S=seedState();shiftsReplaceAll=true;save();render();toast('Reset');}return;}
  if(a==='wipe'){if(confirm('Delete ALL CAPA data, including the existing registers?\nThis cannot be undone.')){S=shape({max:{I:{},A:{}}});shiftsReplaceAll=true;save();render();toast('All data deleted');}return;}
}
function onChange(e){
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='tick'){setTick(el.dataset.sk,el.dataset.rid,el.dataset.f,el.checked);return;}
  if(a==='fMonth'){V.month=el.value;render();return;}
  if(a==='fStatus'){V.status=el.value;render();return;}
  if(a==='iSt'){V.ist=el.value;render();return;}
  if(a==='fOpen'){V.fopen=el.checked;render();return;}
  if(a==='iDate'){const i=byId(S.issues,el.dataset.id);if(i&&el.value){i.date=el.value;save();}return;}
  if(a==='iText'){const i=byId(S.issues,el.dataset.id);if(i){i.issue=el.value.trim();save();}return;}
  if(a==='iRca'){const i=byId(S.issues,el.dataset.id);if(i){i.rca=el.checked;save();render();toast(el.checked?i.code+' sent to the RCA Workbench':i.code+' will no longer be sent');}return;}
  if(a==='cCause'||a==='cRoot'||a==='cR'){
    const i=byId(S.issues,el.dataset.id);const c=i&&i.causes.find(x=>x.id===el.dataset.cid);if(!c)return;
    if(a==='cCause')c.cause=el.value.trim();
    else if(a==='cRoot'){c.root=el.value.trim();if(c.root&&!c.r){c.r=Math.max(0,...i.causes.map(x=>x.r||0))+1;}}
    else{const n=parseInt(el.value,10);c.r=n>0?n:null;}
    save();render();return;}
  if(a==='naIssue'){V.newAct={issue:el.value,roots:[],plan:V.newAct.plan};render();return;}
  if(a==='naRoot'){const n=+el.dataset.n;const r=V.newAct.roots;if(el.checked&&!r.includes(n))r.push(n);if(!el.checked)V.newAct.roots=r.filter(x=>x!==n);return;}
  if(a==='aRoot'){const x=byId(S.actions,el.dataset.id);if(x){const n=+el.dataset.n;x.roots=el.checked?Array.from(new Set(x.roots.concat(n))).sort((p,q)=>p-q):x.roots.filter(v=>v!==n);save();}return;}
  if(a==='aPlan'){const x=byId(S.actions,el.dataset.id);if(x){x.plan=el.value.trim();save();}return;}
  if(a==='aClosed'){const x=byId(S.actions,el.dataset.id);if(x){x.closed=el.checked;save();render();}return;}
  if(a==='pv'){const p=byId(S.prevent,el.dataset.id);if(p){p[el.dataset.f]=el.value;save();}return;}
  if(a==='pvTrig'||a==='pvSub'){const p=byId(S.prevent,el.dataset.id);if(p){const k=a==='pvTrig'?'triggers':'submittedTo';const t=el.dataset.t;p[k]=el.checked?Array.from(new Set(p[k].concat(t))):p[k].filter(v=>v!==t);save();}return;}
  if(a==='maxI'||a==='maxA'){const k=a==='maxI'?'I':'A';S.max[k][el.dataset.y]=Math.max(0,parseInt(el.value,10)||0);save();toast('Numbering updated');return;}
  if(a==='restore'){
    const f=el.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const s=JSON.parse(rd.result);if(!s||!Array.isArray(s.issues)||!Array.isArray(s.actions))throw 0;
      if(!confirm('Restoring replaces everything currently in CAPA. Continue?'))return;S=shape(s);shiftsReplaceAll=true;save();render();toast('Backup restored');}catch(err){toast('That file is not a CAPA backup');}};
    rd.readAsText(f);el.value='';return;}
}
function onInput(e){
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  // search boxes re-render the page, so keep the caret where it was
  const map={fQ:'q',iQ:'iq',aQ:'aq',fQ2:'fq'};
  if(map[a]){V[map[a]]=el.value;const pos=el.selectionStart;render();const n=$('[data-act="'+a+'"]');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}return;}
  if(a==='naPlan'){V.newAct.plan=el.value;}
}

/* ================= MESSAGES + START ================= */
window.addEventListener('message',ev=>{
  if(ev.source!==window.parent)return;
  const m=ev.data;
  if(m&&m.type==='fitl-shifts'&&Array.isArray(m.items))ingestShifts(m.items);
  if(m&&m.type==='fitl-capa-requests'&&Array.isArray(m.items))ingestRequests(m.items);
  if(m&&m.type==='fitl-meeting-to-capa'&&Array.isArray(m.items))ingestMeeting(m.items);
  if(m&&m.type==='fitl-meeting-status'&&Array.isArray(m.items))onMeetingStatus(m.items);
});
document.addEventListener('click',onClick);
document.addEventListener('change',onChange);
document.addEventListener('input',onInput);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
$('#app').innerHTML='<div style="padding:60px;text-align:center;color:#8a8f98">Loading CAPA data…</div>';
load().then(s=>{
  S=s;render();publishRca();
  try{window.parent.postMessage({type:'fitl-capa-ready'},'*');}catch(e){}
});
})();
</script>
