<style>
  :root{--bg:#F2F0EB;--card:#fff;--ink:#1D2127;--soft:#5E6772;--line:#DDD8CF;--line2:#ECE8E0;--red:#DA1B22;--red-d:#B3151B;--red-bg:#FBE9EA;--navy:#1F3A5F;--green:#2C7A4B;--green-bg:#E1F0E7;--amber:#B97708;--amber-bg:#FBF0D8;--head:'Barlow Condensed','Arial Narrow',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box}[hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Inter',system-ui,sans-serif}
  button,input,select{font:inherit;color:inherit}h1,h2,h3{font-family:var(--head);font-weight:600;margin:0}
  header{background:var(--card);border-bottom:3px solid var(--red);padding:12px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header img{height:38px;width:auto;border-radius:4px}h1{font-size:26px;text-transform:uppercase;line-height:1}.sub{color:var(--soft);font-size:12.5px;margin-top:3px}.grow{flex:1;min-width:240px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap}.btn:hover{border-color:#B9B2A6}.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.red:hover{background:var(--red-d)}.btn.sm{padding:3px 10px;font-size:12.5px}.btn:disabled{opacity:.45;cursor:default}
  select,input[type=number]{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 10px}
  .yr{display:flex;align-items:center;gap:8px;background:#FBFAF7;border:1px solid var(--line);border-radius:9px;padding:6px 10px}.yr label{font-size:12px;font-weight:600;color:var(--soft)}.yr select{font-weight:700;font-size:15px}
  main{padding:16px 22px 60px;max-width:1550px;margin:0 auto}
  .status{font-size:12.5px;color:var(--soft);margin:0 0 12px}.status b{color:var(--ink)}.warn{color:#8A5A00;background:#FFF3D6;padding:1px 8px;border-radius:9px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px}.pn{padding:14px 16px;margin-bottom:14px}.pn h2{font-size:20px;text-transform:uppercase;margin-bottom:8px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}.t{padding:12px 14px;border-left:6px solid var(--line)}.t small{display:block;color:var(--soft);font-size:12px}.t b{font:600 32px/1.1 var(--head)}.t .n{font-size:12px;color:var(--soft)}.t.good{border-left-color:var(--green)}.t.bad{border-left-color:var(--red)}.t.mid{border-left-color:var(--amber)}.t.good b{color:var(--green)}.t.bad b{color:var(--red-d)}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:14px;margin-bottom:14px}.cb{padding:10px 12px;height:330px;position:relative}.full{grid-column:1/-1}.tall{height:430px}
  .tw{overflow:auto;border-radius:8px;max-height:520px}table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}th{background:#F7F4EE;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);position:sticky;top:0;z-index:1}
  td:first-child,th:first-child{text-align:left;white-space:normal;min-width:230px}td.l,th.l{text-align:left}td.c,th.c{text-align:center}
  td.ok{background:#DDEFE4}td.no{background:#F6D2D4}td.nd{color:#B5B0A6}td.ytd{font-weight:700;border-left:2px solid var(--line)}
  .chip{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap;background:#ECE9E3;color:var(--soft)}.chip.ok{background:var(--green-bg);color:var(--green)}.chip.no{background:var(--red-bg);color:var(--red-d)}
  .empty{padding:48px 20px;text-align:center;color:var(--soft);line-height:1.8}
  .veil{position:fixed;inset:0;background:rgba(29,33,39,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px;z-index:50;overflow:auto}.modal{background:#fff;border-radius:12px;width:min(760px,100%);padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}.modal h2{font-size:24px;text-transform:uppercase;margin-bottom:6px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  #toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:440px}#toast.show{opacity:1}
  .note{color:var(--soft);font-size:12.5px}details{margin-top:8px}summary{cursor:pointer;font-weight:600}
</style>

/* ---------- the production summary report (the slim copy the Production Summary page hands over) ----------
   KPI 6.0 total scrap % = scrap kg (Daily Quality, classification SCRAP) ÷ tyre production kg (Daily Tyres Production), by month.

  mk('c5',{type:'bar',data:{labels:D.map(x=>x[0].length>34?x[0].slice(0,33)+'…':x[0]),datasets:[{label:'Scrap kg',data:D.map(x=>Math.round(x[1].kg*10)/10),backgroundColor:N}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:'Scrap weight by reason (top 10) — '+MONS[+MO.slice(5)-1]+' '+MO.slice(0,4),font:{size:14}},legend:{display:false}},scales:{x:{title:{display:true,text:'kg'}},y:{ticks:{font:{size:10}}}}}});
  const GR=Object.entries(S.groups[MO]||{}).sort();
  mk('c6',{type:'bar',data:{labels:GR.map(x=>'Group '+x[0]),datasets:[{label:'Scrap kg',data:GR.map(x=>Math.round(x[1])),backgroundColor:['#1F3A5F','#E0A526','#2E9E6B','#8A94A3']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:'Scrap weight by production group — '+MONS[+MO.slice(5)-1]+' '+MO.slice(0,4),font:{size:14}},legend:{display:false}},scales:{y:{beginAtZero:true,title:{display:true,text:'kg'}}}}});
  K7.forEach((k,j)=>{const id=k[0].replace('.',''),t=TG[k[3]];
    mk('c'+(7+j),{type:'bar',data:{labels:lab,datasets:[{label:'KPI '+k[0]+' % (report)',data:rows.map(r=>r['u'+id]==null?null:+r['u'+id].toFixed(3)),backgroundColor:rows.map(r=>r['u'+id]==null?'#ccc':r['u'+id]<=t?G:R),order:2},tline('Target at most '+t+' %',t,rows.length,'#1D2127'),{type:'line',label:'KPI summary (recorded)',data:rows.map(r=>r['c'+id]!=null?r['r'+id]:null),showLine:false,pointStyle:'rectRot',pointRadius:6,pointBorderColor:'#1D2127',pointBackgroundColor:'#fff',order:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:'KPI '+k[0]+' '+k[2]+', % of production weight, by month — '+YR,font:{size:14}},legend:{position:'bottom'}},scales:{y:{beginAtZero:true,title:{display:true,text:'% by kg'}}}}})});
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='close'){$('host').innerHTML='';return}
  if(a.dataset.act==='reasons'){const all={};Object.keys(S.defects).filter(k=>k.slice(0,4)==YR).forEach(ym=>Object.entries(S.defects[ym]).forEach(([r,v])=>{all[r]=(all[r]||0)+v.kg}));const names=Object.keys(all).sort((x,y)=>all[y]-all[x]);
    $('host').innerHTML='<div class="veil"><div class="modal"><h2>Reasons counted</h2><p class="note" style="margin:0 0 8px">Tick the scrap defect reasons (Daily Quality) that belong to each KPI. Weight is for '+YR+'.</p><div class="tw" style="max-height:55vh"><table><thead><tr><th>Defect reason</th><th>Scrap kg</th>'+K7.map(k=>'<th>'+k[0]+'</th>').join('')+'</tr></thead><tbody>'+names.map(r=>'<tr><td>'+esc(r)+'</td><td>'+n0(all[r])+'</td>'+K7.map(k=>'<td><input type="checkbox" data-rs="'+k[0]+'" data-r="'+esc(r)+'"'+(RS[k[0]].includes(r)?' checked':'')+'></td>').join('')+'</tr>').join('')+'</tbody></table></div><div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn red" data-act="savers">Save</button></div></div></div>';return}
  if(a.dataset.act==='savers'){const o={'7.1':[],'7.2':[],'7.4':[]};document.querySelectorAll('[data-rs]').forEach(c=>{if(c.checked)o[c.dataset.rs].push(c.dataset.r)});RS=o;try{localStorage.setItem(RSKEY,JSON.stringify(RS))}catch(_){}$('host').innerHTML='';render();toast('Reasons saved')}});
document.addEventListener('change',e=>{const i=e.target.id;
  if(i==='yr'){YR=+e.target.value;MO=null;render()}else if(i==='mo'){MO=e.target.value;render()}
  else if(i==='t6'||i==='t73'||i==='t71'||i==='t72'||i==='t74'){const v=parseFloat(e.target.value);if(isFinite(v)&&v>=0){TG[i]=v;try{localStorage.setItem(TKEY,JSON.stringify(TG))}catch(_){}}render()}});
function ingest(m){
  if(!m||m.type!=='fitl-workbook'||!Array.isArray(m.files))return;let ok=false;
  for(const f of m.files){try{const r=readReport(f.buffer);if(!Object.keys(r.prodKg).length&&!r.waste&&!Object.keys(r.scrapKg).length)continue;
    keepWaste(r.waste);S={file:f.name,at:new Date().toISOString(),scrapKg:r.scrapKg,prodKg:r.prodKg,dayScrap:r.dayScrap,dayProd:r.dayProd,defects:r.defects,groups:r.groups};ok=true}catch(x){toast('Could not read '+f.name+': '+x.message)}}
  if(ok){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){toast('Saved only for this visit — the browser storage is full.')}YR=null;MO=null;render();toast('KPI dashboard updated from '+S.file)}}
addEventListener('message',ev=>{if(ev.source!==parent)return;ingest(ev.data)});
$('xl').onclick=()=>{if(!S)return;const rows=rowsFor(YR);const a=[['Month','Production kg','Scrap kg','KPI 6.0 % (report)','KPI 6.0 % (KPI summary)','Target 6.0 %','Spew kg','KPI 7.3 % (report)','KPI 7.3 % (KPI summary)','Target 7.3 %','KPI 7.1 % (report)','KPI 7.1 % (KPI summary)','KPI 7.2 % (report)','KPI 7.2 % (KPI summary)','KPI 7.4 % (report)','KPI 7.4 % (KPI summary)']].concat(rows.map(r=>[r.ym,r.prod==null?'':Math.round(r.prod),r.sk==null?'':Math.round(r.sk),r.c6==null?'':+r.c6.toFixed(3),r.r6==null?'':r.r6,TG.t6,r.w?Math.round(r.w.spew):'',r.c73==null?'':+r.c73.toFixed(3),r.r73==null?'':r.r73,TG.t73,r.c71==null?'':+r.c71.toFixed(3),r.r71==null?'':r.r71,r.c72==null?'':+r.c72.toFixed(3),r.r72==null?'':r.r72,r.c74==null?'':+r.c74.toFixed(3),r.r74==null?'':r.r74]));
  const w=XLSX.utils.aoa_to_sheet(a);w['!cols']=Array(16).fill({wch:20});const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,w,'QC KPI '+YR);XLSX.writeFile(wb,'QC_KPI_'+YR+'.xlsx')};
render();
try{parent.postMessage({type:'fitl-qckpi-ready'},'*')}catch(_){}
})();
</script>
