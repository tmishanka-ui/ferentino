<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Context &amp; Risk Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#EEF1EC; --surface:#fff; --ink:#1E2A22; --soft:#5B695F; --border:#D8DED2;
    --low:#2F6B3C; --lowbg:#E3EFE5; --med:#7A4E00; --medbg:#FBEFD2; --high:#8C1F1F; --highbg:#F7DADA;
    --d:'Fraunces',Georgia,serif; --b:'IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--b);font-size:14px}
  .wrap{max-width:1120px;margin:0 auto;padding:24px 16px 64px}
  header.top{display:flex;flex-wrap:wrap;align-items:center;gap:16px;justify-content:space-between;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{height:30px;display:block}
  h1{font-family:var(--d);font-size:1.5rem;font-weight:600;margin:0}
  .sub{font-size:.8rem;color:var(--soft);margin:2px 0 0}
  .stats{display:flex;gap:8px;flex-wrap:wrap}
  .stat{background:var(--surface);border:1px solid var(--border);padding:6px 12px;font-size:.78rem;color:var(--soft)}
  .stat b{display:block;font-family:var(--d);font-size:1.15rem;color:var(--ink)}
  nav.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--ink);margin-bottom:20px}
  nav.tabs button{font-family:var(--b);font-size:.85rem;font-weight:500;padding:9px 14px;border:1px solid transparent;border-bottom:none;background:none;cursor:pointer;color:var(--soft)}
  nav.tabs button small{display:block;font-size:.68rem;font-weight:400;opacity:.8}
  nav.tabs button.on{background:var(--ink);color:#fff}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
  .bar h2{font-family:var(--d);font-size:1.2rem;margin:0}
  .bar p{margin:2px 0 0;font-size:.8rem;color:var(--soft);max-width:70ch}
  .btn{font-family:var(--b);font-size:.8rem;padding:7px 12px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer}
  .btn:hover{background:var(--ink);color:#fff}
  .btn.pri{background:var(--ink);color:#fff}
  .btn.pri:hover{background:#34473a}
  .btn.quiet{border-color:var(--border);color:var(--soft)}
  .btn.sm{padding:4px 9px;font-size:.75rem}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .sec{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--c,#999);padding:14px 16px;margin-bottom:16px}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .sec-head .ab{font-family:var(--d);font-size:1.7rem;font-weight:600;color:var(--c)}
  .sec-head h3{font-family:var(--d);font-size:1.05rem;margin:0}
  .sec-head .s{font-size:.75rem;color:var(--soft)}
  .hint{font-size:.8rem;color:var(--soft);margin:0 0 10px}
  .entry{border:1px solid var(--border);border-left:4px solid var(--soft);padding:10px;margin-bottom:10px;background:#FAFBF9}
  .entry.lvl-low{border-left-color:var(--low)} .entry.lvl-medium{border-left-color:#C9962B} .entry.lvl-high{border-left-color:#B33A3A}
  .entry-top{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
  .num{font-family:var(--d);font-weight:600;min-width:34px;color:var(--soft);padding-top:6px;font-size:.85rem}
  textarea,input[type=text],input[type=date],select{font-family:var(--b);font-size:.82rem;color:var(--ink);border:1px solid var(--border);background:#fff;padding:6px 7px;width:100%;outline:none}
  textarea{resize:vertical;min-height:34px;overflow:hidden}
  textarea:focus,input:focus,select:focus{box-shadow:0 0 0 1px var(--ink)}
  .x{border:none;background:none;font-size:1.2rem;line-height:1;color:var(--soft);cursor:pointer;padding:4px 6px}
  .x:hover{color:var(--high)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
  .fld{display:flex;flex-direction:column;gap:3px;font-size:.7rem;color:var(--soft)}
  .fld>span{font-weight:500}
  .score{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:8px;align-items:end;padding-top:8px;border-top:1px dashed var(--border)}
  .result{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.78rem;min-height:32px}
  .lvl{font-weight:600;padding:3px 9px;font-size:.75rem}
  .lvl.low{background:var(--lowbg);color:var(--low)} .lvl.medium{background:var(--medbg);color:var(--med)} .lvl.high{background:var(--highbg);color:var(--high)}
  .calc{color:var(--soft)}
  .flag{font-size:.75rem;padding:5px 8px;margin-top:8px;background:var(--medbg);color:var(--med);border-left:3px solid #C9962B}
  .flag.high{background:var(--highbg);color:var(--high);border-left-color:#B33A3A}
  .flag.ok{background:var(--lowbg);color:var(--low);border-left-color:var(--low)}
  .chk{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ink);padding-top:16px}
  .chk input{width:auto}
  .quads{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:900px){.quads{grid-template-columns:1fr 1fr}}
  .rank{font-size:.75rem;color:var(--soft)}
  .ro{font-size:.88rem;padding:6px 0}
  table.ref{border-collapse:collapse;width:100%;font-size:.8rem;margin:8px 0 14px}
  table.ref th,table.ref td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top;background:#fff}
  table.ref th{background:#F3F5F1;font-weight:600}
  .scroll{overflow-x:auto}
  .formula{font-family:var(--d);background:#fff;border:1px solid var(--border);padding:10px 14px;margin:8px 0;font-size:.95rem}
  .doccard{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--border);padding:12px 14px;margin-bottom:10px}
  .doccard h4{margin:0;font-family:var(--d);font-size:1rem}
  .doccard p{margin:2px 0 0;font-size:.78rem;color:var(--soft)}
  .checks{background:#fff;border:1px solid var(--border);padding:10px 14px;margin:14px 0}
  .checks li{font-size:.8rem;margin:3px 0}
  .checks .w{color:var(--med)} .checks .h{color:var(--high)}
  .empty{font-style:italic;color:var(--soft);font-size:.82rem;padding:6px 0}
  details{margin-bottom:14px;background:#fff;border:1px solid var(--border);padding:8px 12px}
  summary{cursor:pointer;font-weight:500;font-size:.85rem}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;font-size:.82rem;display:none;z-index:9}
</style>
</head>

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function fmtDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s||'')?s.replace(/-/g,'.'):(s||'');}

function calc(it){
  var sig=(it.P+it.F)*(it.L+it.S);
  var m10=SITS[it.sit]||10;
  var rating=Math.round(sig*m10)/10;
  var level=rating>=24?'High':(rating>=16?'Medium':'Low');
  return {sig:sig,m:m10/10,rating:rating,level:level,significant:rating>=16};
}

function newItem(type,cat){
  return {id:uid(),type:type,cat:cat||'',text:'',date:todayISO(),L:1,P:1,F:1,S:1,sit:'Normal',
    pol:'',timeframe:'',source:'',pestelRef:'',
    inIssues:(type==='pestel'||cat==='weaknesses'),
    ie:'External',party:'',desc:'',riskRef:'',status:'Open',
    oppSource:'',oppRef:'',
    opp:{benefit:'',action:'',resp:'',target:'',status:'Open'}};
}
function defaultState(){
  return {tab:'pestel',settings:{issueNo:'02',issueDate:'2026.04.20',revNo:'00',revDate:'',
    reviewed:'Asst. Manager-Quality and Process',approved:'General Manager',scoringTable:true},items:[]};
}
function valid(it){return (it.text||'').trim().length>0;}

function derive(S){
  var items=S.items, D={pRows:[],pNo:{},sQ:{},sNo:{},sRank:{},opps:[],oppNo:{},issues:[]};
  var n=0;
  PESTEL_CATS.forEach(function(c){
    var list=items.filter(function(i){return i.type==='pestel'&&i.cat===c.id&&valid(i);});
    if(!list.length)D.pRows.push({cat:c,blank:true});
    list.forEach(function(it){n++;D.pNo[it.id]=n;D.pRows.push({cat:c,item:it,no:n});});
  });
  SWOT_QUADS.forEach(function(q){
    var list=items.filter(function(i){return i.type==='swot'&&i.cat===q.id&&valid(i);}).map(function(it,idx){return {it:it,idx:idx,c:calc(it)};});
    list.sort(function(a,b){return b.c.rating-a.c.rating||a.idx-b.idx;});
    var prev=null,rank=0;
    D.sQ[q.id]=list.map(function(x,pos){
      if(prev===null||x.c.rating!==prev){rank=pos+1;prev=x.c.rating;}
      D.sNo[x.it.id]=pos+1;D.sRank[x.it.id]=rank;
      return {item:x.it,no:pos+1,rank:rank,c:x.c,code:q.code+(pos+1)};
    });
  });
  // opportunities
  var used={};
  D.pRows.forEach(function(r){
    if(!r.item||r.item.pol!=='Opportunity')return;
    var it=r.item;
    var linked=items.filter(function(s){return s.type==='swot'&&s.cat==='opportunities'&&s.pestelRef===it.id&&valid(s);});
    var refs=['FIT/Q/RG-GEN-27, No.'+r.no];
    linked.forEach(function(s){used[s.id]=1;refs.push('FIT/Q/RG-GEN-28 (Opportunities), No.'+D.sNo[s.id]);});
    D.opps.push({primary:it,kind:'pestel',source:linked.length?'PESTEL / SWOT':'PESTEL',text:it.text,ref:refs.join('; '),date:it.date,c:calc(it),linkedIds:linked.map(function(s){return s.id;})});
  });
  items.forEach(function(s){
    if(s.type==='swot'&&s.cat==='opportunities'&&valid(s)&&!used[s.id])
      D.opps.push({primary:s,kind:'swot',source:'SWOT',text:s.text,ref:'FIT/Q/RG-GEN-28 (Opportunities), No.'+D.sNo[s.id],date:s.date,c:calc(s),linkedIds:[]});
  });
  items.forEach(function(m){
    if(m.type==='opp'&&valid(m))
      D.opps.push({primary:m,kind:'manual',source:m.oppSource||'',text:m.text,ref:m.oppRef||'',date:m.date,c:calc(m),linkedIds:[]});
  });
  D.opps.forEach(function(o,i){o.no=i+1;D.oppNo[o.primary.id]=i+1;o.linkedIds.forEach(function(id){D.oppNo[id]=i+1;});});
  // issues
  D.pRows.forEach(function(r){
    if(r.item&&r.item.inIssues!==false)D.issues.push({item:r.item,ie:'External',origin:'PESTEL No.'+r.no});
  });
  items.forEach(function(s){
    if(s.type==='swot'&&(s.cat==='strengths'||s.cat==='weaknesses')&&s.inIssues&&valid(s))
      D.issues.push({item:s,ie:'Internal',origin:'SWOT '+(s.cat==='strengths'?'S':'W')+D.sNo[s.id]});
  });
  items.forEach(function(s){
    if(s.type==='swot'&&(s.cat==='opportunities'||s.cat==='threats')&&s.inIssues&&valid(s))
      D.issues.push({item:s,ie:'External',origin:'SWOT '+(s.cat==='opportunities'?'O':'T')+D.sNo[s.id]});
  });
  items.forEach(function(m){
    if(m.type==='issue'&&valid(m))D.issues.push({item:m,ie:m.ie||'External',origin:'Manual'});
  });
  D.issues.forEach(function(r,i){
    r.no=i+1;r.c=calc(r.item);
    var it=r.item;
    var oppNo=D.oppNo[it.id];
    if(oppNo)r.ref='RG-GEN-24, No.'+oppNo;
    else if(it.riskRef)r.ref=it.riskRef;
    else r.ref=r.c.significant?'To be added to RG-GEN-23':'';
    r.auto=!!oppNo;
    r.party=it.party||(r.item.type==='pestel'?'Macro Environment':'');
  });
  return D;
}

        (old[t].items[cat]||[]).forEach(function(o){var n=newItem(t,cat);n.text=o.text||'';st.items.push(n);});
      });
    });
  }catch(e){}
  return st;
}

function sel(id,f,val,opts){return '<select data-id="'+id+'" data-f="'+f+'">'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(val)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select>';}

function fld(label,html){return '<label class="fld"><span>'+label+'</span>'+html+'</label>';}
function chip(it){var c=calc(it);return '<span class="lvl '+c.level.toLowerCase()+'">'+c.level+'</span><span class="calc">Significance '+c.sig+' × M '+c.m+' = <b>'+c.rating+'</b></span>';}
function scoreBlock(it){

function render(){
  document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button data-act="tab" data-tab="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+'<small>'+t[2]+'</small></button>';}).join('');
  var t=TABS.filter(function(x){return x[0]===S.tab;})[0]||TABS[0];

function grow(el){el.style.height='auto';el.style.height=Math.max(34,el.scrollHeight)+'px';}

// refresh derived read-outs without re-rendering inputs
function refresh(){
  var D=derive(S);
  S.items.forEach(function(it){
    var c=calc(it);
    var chipEl=document.querySelector('[data-chip="'+it.id+'"]');if(chipEl)chipEl.innerHTML=chip(it);
    var card=document.querySelector('[data-card="'+it.id+'"]');
    if(card){card.className='entry lvl-'+c.level.toLowerCase();}
    var n=document.querySelector('[data-num="'+it.id+'"]');if(n)n.textContent=D.pNo[it.id]?'No.'+D.pNo[it.id]:'—';
    var r=document.querySelector('[data-rank="'+it.id+'"]');if(r)r.textContent=D.sRank[it.id]?'Rank '+D.sRank[it.id]:'—';
    var fl=document.querySelector('[data-flag="'+it.id+'"]');
    if(fl){
      var html='';
      if(S.tab==='opps'){
        var f=it.opp;
        if(c.level==='High')html='<div class="flag high">High — immediate action and escalation to Top Management / Director.'+((f.resp||'').trim()?'':' Responsible will print as Top Management / Director.')+'</div>';
        else if(c.level==='Medium'&&(!(f.action||'').trim()||!(f.resp||'').trim()||!f.target))html='<div class="flag">Medium — needs a defined action, owner and target date.</div>';
        else if(c.level==='Low')html='<div class="flag ok">Low — maintain existing controls.</div>';
      }else if(S.tab==='issues'){
        var row=D.issues.filter(function(x){return x.item.id===it.id;})[0];
        if(c.significant&&row&&!row.auto&&!it.riskRef)html='<div class="flag'+(c.level==='High'?' high':'')+'">'+c.level+' — enter this in the Risk Assessment Register (RG-GEN-23) and add the row reference.</div>';
      }
      fl.innerHTML=html;
    }
  });
  var all=S.items.filter(valid).map(calc);
  document.getElementById('stats').innerHTML='<div class="stat"><b>'+all.length+'</b>scored entries</div><div class="stat"><b>'+all.filter(function(c){return c.significant;}).length+'</b>significant</div><div class="stat"><b>'+all.filter(function(c){return c.level==='High';}).length+'</b>high priority</div>';
}

// ---------- events ----------
function setPath(obj,path,val){var p=path.split('.');var o=obj;for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val;}
function onField(e){
  var t=e.target;if(!t.dataset||!t.dataset.f)return;
  var id=t.dataset.id,f=t.dataset.f;
  var val=t.type==='checkbox'?t.checked:t.value;
  if(id==='settings'){S.settings[f]=val;save();return;}
  var it=byId(id);if(!it)return;
  if(['L','P','F','S'].indexOf(f)>=0)val=parseInt(val,10);
  setPath(it,f,val);
  if(f==='pestelRef'&&val){
    var p=byId(val);
    if(p){['L','P','F','S','sit'].forEach(function(k){it[k]=p[k];});if(!it.text.trim())it.text=p.text;it.date=p.date;render();save();return;}
  }
  if(t.tagName==='TEXTAREA')grow(t);
  if(f==='pol'||f==='inIssues'&&false){}
  save();refresh();
}
document.addEventListener('input',function(e){if(e.target.tagName==='TEXTAREA'||e.target.type==='text')onField(e);});
document.addEventListener('change',function(e){if(e.target.tagName==='SELECT'||e.target.type==='date'||e.target.type==='checkbox')onField(e);});

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='tab'){S.tab=b.dataset.tab;save();render();window.scrollTo(0,0);}
  else if(a==='add'){var n=newItem(b.dataset.type,b.dataset.cat);S.items.push(n);save();render();var el=document.querySelector('[data-card="'+n.id+'"] textarea');if(el)el.focus();}
  else if(a==='del'){S.items=S.items.filter(function(i){return i.id!==b.dataset.id;});S.items.forEach(function(i){if(i.pestelRef===b.dataset.id)i.pestelRef='';});save();render();}
  else if(a==='unissue'||a==='inissue'){var it=byId(b.dataset.id);if(it){it.inIssues=(a==='inissue');save();render();}}
  else if(a==='sync'){
    var D=derive(S),made=0;
    D.pRows.forEach(function(r){
      if(!r.item||!r.item.pol)return;
      var linked=S.items.some(function(s){return s.type==='swot'&&s.pestelRef===r.item.id;});
      if(linked)return;
      var n=newItem('swot',r.item.pol==='Opportunity'?'opportunities':'threats');
      n.text=r.item.text;n.pestelRef=r.item.id;n.date=r.item.date;['L','P','F','S','sit'].forEach(function(k){n[k]=r.item[k];});
      S.items.push(n);made++;
    });
    save();render();toast(made?made+' item'+(made>1?'s':'')+' brought in from PESTEL.':'Everything marked Opportunity or Threat in PESTEL is already in SWOT.');
  }
  else if(a==='seed'){
    var have={};S.items.forEach(function(i){if(i.seed)have[i.seed]=1;});
    var add=seedItems().filter(function(i){return !have[i.seed];});
    if(!add.length){toast('The 2026 register is already on the board.');}
    else{S.items=S.items.concat(add);save();render();toast(add.length+' entries added from the 2026 Context of the Organization register.');}
  }
  else if(a==='dl'){download(b.dataset.doc);}
  else if(a==='dlall'){downloadAll();}
});

function saveBlob(blob,name){var u=URL.createObjectURL(blob);var l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();document.body.removeChild(l);setTimeout(function(){URL.revokeObjectURL(u);},1500);}
function needZip(){if(typeof JSZip==='undefined'){toast('Word export needs an internet connection to load its zip library — check your connection and reload.');return true;}return false;}
function download(key){
  if(needZip())return;
  buildDocx(key,S,JSZip).generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}).then(function(b){saveBlob(b,DOCS[key].file);toast('Downloaded '+DOCS[key].code);});
}
function downloadAll(){
  if(needZip())return;
  var out=new JSZip(),keys=['issues','opps','pestel','swot'];
  Promise.all(keys.map(function(k){return buildDocx(k,S,JSZip).generateAsync({type:'uint8array',compression:'DEFLATE'}).then(function(d){out.file(DOCS[k].file,d);});}))
    .then(function(){return out.generateAsync({type:'blob'});})
    .then(function(b){saveBlob(b,'FITL_Context_Documents.zip');toast('Downloaded all four documents');});
}

render();
})();
</script>
