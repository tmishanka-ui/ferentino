<style>
:root{--bg:#f5f7fa;--card:#fff;--tx:#1d2733;--mu:#64707d;--bd:#d5dce4;--ac:#1f5fa8;--ac2:#e3eefa;--ok:#2e7d4f;--wr:#b26a00;--rd:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1d232a;--tx:#e6ebf0;--mu:#94a0ac;--bd:#323b45;--ac:#6aa8f0;--ac2:#22344a;--ok:#5fc08a;--wr:#e0a64a;--rd:#f2877f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181d;--card:#1d232a;--tx:#e6ebf0;--mu:#94a0ac;--bd:#323b45;--ac:#6aa8f0;--ac2:#22344a;--ok:#5fc08a;--wr:#e0a64a;--rd:#f2877f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Calibri,Tahoma,Arial,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}.sub{color:var(--mu);font-size:12px}
nav{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
nav button,.b{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 13px;border-radius:7px;cursor:pointer;font:inherit}
nav button.on,.b.p{background:var(--ac);border-color:var(--ac);color:#fff}
.b.s{padding:3px 9px;font-size:12px}.b.d{color:var(--rd);border-color:var(--rd)}.b:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px;font-weight:600}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.no{font:700 22px/1.2 Consolas,monospace;color:var(--ac);background:var(--ac2);padding:10px 14px;border-radius:8px;display:inline-block;margin:4px 0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--ac2);text-align:left;font-weight:700}th,td{border:1px solid var(--bd);padding:6px 8px;vertical-align:top}
.msg{padding:9px 12px;border-radius:7px;margin:10px 0;background:var(--ac2)}.msg.w2{background:#fff3dc;color:#6b4300}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .msg.w2{background:#3a2f17;color:#f0cf8c}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;overflow:auto;z-index:20}
.md{background:var(--card);border-radius:10px;padding:18px;width:100%;max-width:1000px}
.md.n{max-width:520px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tag{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--ac2)}
.rep{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.big{font-size:28px;font-weight:700;color:var(--ac)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw}
#toast.on{opacity:1}#toast.bad{background:#b3261e}

<script>

/* ---- sign-in and electronic signature: answered by the management system page (not available when this page is opened alone) ---- */
let AUTH={server:false,user:null};
addEventListener('message',ev=>{if(ev.source===parent&&ev.data&&ev.data.type==='fitl-auth-state'){AUTH={server:!!ev.data.server,user:ev.data.user};if(typeof onAuthChange==='function')onAuthChange()}});
try{if(parent!==window)parent.postMessage({type:'fitl-auth-request'},'*')}catch(e){}
function fitlSign(o){return new Promise(res=>{
  if(parent===window||!AUTH.server){res({ok:false,reason:'noserver'});return}
  const id='s'+Math.random().toString(36).slice(2),h=ev=>{if(ev.source===parent&&ev.data&&ev.data.type==='fitl-sign-result'&&ev.data.id===id){removeEventListener('message',h);res(ev.data)}};
  addEventListener('message',h);parent.postMessage({type:'fitl-sign-request',id,purpose:o.purpose,ref:o.ref,content:o.content,summary:o.summary},'*')})}

function onAuthChange(){if(typeof apvShow==='function')apvShow()}
let APV=null,APVCTX=null;
const lite=g=>({id:g.id,name:g.name,designation:g.designation,at:g.at});
function apvHtml(label){return AUTH.server?`<label style="margin-top:8px">${label}</label><div id="apv"></div>`:`<label style="margin-top:8px">${label}</label><input id="apT" placeholder="Name of the approver">`}
function apvShow(){const b=document.getElementById('apv');if(!b)return;b.innerHTML=APV?`<div class="msg"><b>✔ ${esc(APV.sig.name)}</b>${APV.sig.designation?', '+esc(APV.sig.designation):''}<br><span class="sub">Signed electronically ${esc(new Date(APV.sig.at).toLocaleString())} · Sig #${APV.sig.id}</span> <button class="b" onclick="apvDo()">Sign again</button></div>`:`<button class="b p" onclick="apvDo()">Sign approval with my password</button> <span class="sub">${AUTH.user?'as '+esc(AUTH.user.name):'you will be asked to sign in first'}</span>`}
function apvDo(){const c=APVCTX&&APVCTX();if(!c)return;fitlSign(c).then(r=>{if(r.ok){APV={sig:r.sig,content:c.content};apvShow()}else if(r.reason!=='cancelled')alert('Signing is only possible when the system is opened from the company server.')})}
function apvCheck(content){
  if(!AUTH.server)return{typed:(document.getElementById('apT')?document.getElementById('apT').value.trim():'')};

/* ---------- storage: the server is the real copy, not this browser ----------
   The whole register used to live only in a single localStorage value. That value itself is
   small (file content lives separately in IndexedDB/GridFS), but a browser's localStorage is one
   shared pool across every app on this site — once something else filled it, saving here started
   silently failing too, even though this page's own data was tiny. The server now holds the real
   copy (one small document); the only local read left is a one-time pickup of whatever this

function dcLoad(){
 return dcMetaGet().then(m=>{
  dcVersion=m.version||0;
  if(m.data&&typeof m.data==='object'&&Array.isArray(m.data.docs))return m.data;
  const legacy=dcLocalCopy(); // this browser's register from before the server-backed version
  if(legacy)return dcMetaPut(legacy).then(()=>{try{localStorage.removeItem('fitl_dc')}catch(e){}return legacy}).catch(()=>legacy);

 }).catch(()=>{toast('Could not load from the server — showing this browser\'s last saved copy',1);return dcLocalCopy()||{docs:[]}});
}

const FLIB={db:null,
 open(){return this.db||(this.db=new Promise((res,rej)=>{const q=indexedDB.open('fitl-library',1);q.onupgradeneeded=()=>q.result.createObjectStore('files',{keyPath:'k'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}))},
 async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('files',mode);let out;const r=fn(t.objectStore('files'));if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})},
 put(rec){return this.tx('readwrite',s=>s.put(rec)).then(r=>{fitlFile('fitl-file-saved',rec.k);return r})},get(k){return this.tx('readonly',s=>s.get(k)).then(r=>r||this.fromServer(k))},del(k){return this.tx('readwrite',s=>s.delete(k)).then(r=>{fitlFile('fitl-file-deleted',k);return r})},clear(){return this.tx('readwrite',s=>s.clear())},
 async fromServer(k){try{const r=await fetch('/api/files/'+encodeURIComponent(k),{credentials:'same-origin'});if(!r.ok)return null;const data=await r.arrayBuffer();let nm=k;try{nm=decodeURIComponent(r.headers.get('X-File-Name')||k)}catch(_){}const rec={k,docId:k.split('|')[0],name:nm,type:r.headers.get('Content-Type')||'',size:data.byteLength,at:new Date().toISOString(),data};await this.tx('readwrite',s=>s.put(rec));return rec}catch(_){return null}}};
