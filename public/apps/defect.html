<style>
:root{--bg:#f5f6f8;--fg:#1c2330;--card:#fff;--bd:#dde1e8;--mut:#6a7384;--acc:#1f4e8c;--s:#d64545;--M:#e08a1e;--m:#3b82c4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--fg:#e6e9ef;--card:#1b212b;--bd:#2e3745;--mut:#99a3b5;--acc:#6aa3e8}}
:root[data-theme="dark"]{--bg:#12161d;--fg:#e6e9ef;--card:#1b212b;--bd:#2e3745;--mut:#99a3b5;--acc:#6aa3e8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{margin:0;font-size:22px}h2{margin:0 0 8px;font-size:15px}
.sub{color:var(--mut);margin:2px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:7px 11px}
button{cursor:pointer}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled{opacity:.45;cursor:not-allowed}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{border:1px solid var(--bd);border-radius:8px;padding:10px;border-left:5px solid var(--bd)}
.kpi b{display:block;font-size:22px}.kpi span{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:14px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.sc{overflow:auto;max-height:420px}.sc,.card{min-width:0}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 7px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:130px}
th{position:sticky;top:0;background:var(--card);font-size:12px;color:var(--mut)}
.bar{display:flex;height:9px;min-width:90px;border-radius:3px;overflow:hidden;background:var(--bd)}
.bar i{display:block}
.leg span{margin-right:12px;font-size:12px;color:var(--mut)}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
#msg{color:var(--mut)}
.sel{background:rgba(31,78,140,.2)}tr[data-r]{cursor:pointer}tr[data-r]:hover{background:rgba(31,78,140,.1)}
</style>
</head>

const $=id=>document.getElementById(id), DAY=864e5;
let recs=[], mode='week', anchor=null, view=null, selDef=null, dataMin=null, dataMax=null;
const KEYS={S:'Scrap',M:'Major repair',m:'Minor repair'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.toISOString().slice(0,10);
const fmt=d=>d.toLocaleDateString('en-GB',{timeZone:'UTC',weekday:'short',day:'2-digit',month:'short',year:'numeric'});
const fmtS=d=>d.toLocaleDateString('en-GB',{timeZone:'UTC',day:'2-digit',month:'short'});
const norm=s=>{s=String(s==null?'':s).trim().replace(/\s+/g,' ').toUpperCase();return s||'(BLANK)'};
const n0=n=>Math.round(n).toLocaleString('en-US'), n1=n=>n.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
function toDate(v){
  if(v==null||v==='')return null;
  if(typeof v==='number')return new Date(Date.UTC(1899,11,30)+Math.floor(v)*DAY);
  if(v instanceof Date)return new Date(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate()));
  const t=new Date(v);return isNaN(t)?null:new Date(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()));
}
function findSheet(wb){
  for(const n of wb.SheetNames){
    const ws=wb.Sheets[n]; if(!ws)continue;
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    if(aoa.length&&aoa[0].some(h=>String(h).trim().toUpperCase()==='CLASSIFICATION'))return aoa;
  }
  return null;
}
function load(buf){
  let wb=XLSX.read(buf,{type:'array',sheets:'Daily Quality'});
  let aoa=findSheet(wb);
  if(!aoa){wb=XLSX.read(buf,{type:'array'});aoa=findSheet(wb);}
  if(!aoa)throw new Error('Could not find a sheet with a CLASSIFICATION column (expected "Daily Quality").');
  const H=aoa[0].map(h=>String(h==null?'':h).trim().toUpperCase());
  const col=n=>H.indexOf(n), kg=H.findIndex(h=>h.startsWith('SCRAP'));
  const c={d:col('INSPECTION DATE'),cl:col('CLASSIFICATION'),ca:col('CATEGORY'),q:col('QUANTITY'),r:col('DEFECT DESCRIPTION'),
    p:col('CODE PRESS'),g:col('GROUP'),t:col('DESCRIPTION'),sl:col('SHIFT LOADED'),si:col('INSPECTION SHIFT')};
  for(const k in c)if(c[k]<0)throw new Error('Missing column for: '+k);
  const out=[];
  for(let i=1;i<aoa.length;i++){
    const r=aoa[i], cl=norm(r[c.cl]), ca=norm(r[c.ca]);
    if(cl!=='SCRAP'&&cl!=='REPAIR')continue;
    const d=toDate(r[c.d]); if(!d)continue;
    let q=parseInt(String(r[c.q]).replace(/[^0-9]/g,''),10); if(isNaN(q))q=1;
    const type=cl==='SCRAP'?'S':(ca==='MAJOR'?'M':'m');
    out.push({t:+d,type,q,kg:type==='S'?(Number(r[kg])||0):0,r:norm(r[c.r]),p:norm(r[c.p]),g:norm(r[c.g]),y:norm(r[c.t]),sl:norm(r[c.sl]),si:norm(r[c.si])});
  }
  return {out,total:aoa.length-1};
}

function trend(list,s,e){

    const t=row.getCell(38);t.value={formula:`SUM(B${rr}:AK${rr})`};t.style=rs[37];});
  const tr=5+tl.length,trow=R.getRow(tr);
  trow.getCell(1).value='Total (listed tyres)';trow.getCell(1).style=rt[0];
  for(let c=2;c<=37;c++){const x=trow.getCell(c);x.value={formula:`SUM(${cl(c)}5:${cl(c)}${tr-1})`};x.style=rt[c-1];}
  const xt=trow.getCell(38);xt.value={formula:`SUM(B${tr}:AK${tr})`};xt.style=rt[37];
  // Brand Wise
  B.getCell('A14').value='Brand Wise Defect Comparison - '+(defect?defect+' (Selected in Defect Drill Down)':'All Defects');
  const bw=(first,s,n)=>{for(let i=0;i<5;i++){const rr=first+i;
    for(let k=0;k<12;k++)['D','E','F'].forEach((col,j)=>{B.getCell(rr,2+3*k+j).value={formula:`SUMPRODUCT((${rg(s,'A',n)}=${B.getColumn(2+3*k).letter}$3)*(${rg(s,'G',n)}=$A${rr})*${rg(s,col,n)})`};});}};
  bw(5,"'All'",L);bw(18,sh,DL);
  await addAirTrap(wb,yl,sty);
  wb.calcProperties={fullCalcOnLoad:true};
  return await wb.xlsx.writeBuffer();
}

// ---- Air Trap page: brand-wise comparison + top-five tyres (month / last date) ----
async function addAirTrap(wb,yl,sty){
  const isAT=r=>r.r.indexOf('AIR TRAP')===0;
  const air=yl.filter(isAT);
  const src=new ExcelJS.Workbook();await src.xlsx.load(Uint8Array.from(atob(TPL_AT),c=>c.charCodeAt(0)).buffer);
  const S=src.getWorksheet('Air Trap');
  const A=wb.getWorksheet('All');
  // data sheet (same 7 columns as 'All'), air-trap rows only
  const rows=xlAgg(air),n=Math.max(3,rows.length+2),DS="'Air Trap Data'";
  const D=wb.addWorksheet('Air Trap Data',{views:[{state:'frozen',ySplit:2}]});
  D.mergeCells('A1:G1');D.getCell('A1').value='Defect data: AIR TRAP (all AIR TRAP defect types)';D.getCell('A1').style=sty(A.getCell('A1'));
  for(let i=1;i<=7;i++){const c=D.getCell(2,i);c.value=A.getCell(2,i).value;c.style=sty(A.getCell(2,i));D.getColumn(i).width=A.getColumn(i).width;}
  const as=[1,2,3,4,5,6,7].map(i=>sty(A.getRow(3).getCell(i)));
  rows.forEach((o,i)=>{const r=D.getRow(3+i);
    [MON[o.m],o.y,o.p,o.S||null,o.M||null,o.n||null].forEach((v,j)=>{const c=r.getCell(j+1);c.value=v;c.style=as[j];});
    const g=r.getCell(7);g.value={formula:BRF.replace(/#/g,3+i)};g.style=as[6];});
  D.autoFilter='A2:G'+n;
  // page: copy the layout (widths, heights, merges, styles, labels) from the supplied sheet
  const W=wb.addWorksheet('Air Trap');
  for(let c=1;c<=38;c++){const w=S.getColumn(c).width;if(w)W.getColumn(c).width=w;}
  W.getColumn(1).width=38;
  // wide enough for the top-five tables below (Press (QTY), production, kg and % columns)
  [[2,22],[3,9],[4,9],[5,9],[6,9],[7,16],[8,16],[9,11],[10,11],[11,13],[12,13],[13,13],[14,13]].forEach(a=>W.getColumn(a[0]).width=a[1]);
  for(let r=1;r<=31;r++){const h=S.getRow(r).height;if(h)W.getRow(r).height=h;
    for(let c=1;c<=38;c++){const s=S.getCell(r,c),t=W.getCell(r,c);t.style=sty(s);
      if(typeof s.value==='string')t.value=s.value;}}
  (S.model.merges||[]).forEach(m=>W.mergeCells(m));
  const col=c=>W.getColumn(c).letter;
  // 1) brand x month, Scrap / Major / Minor
  for(let i=0;i<5;i++){const r=5+i;
    for(let k=0;k<12;k++)['D','E','F'].forEach((cl,j)=>{
      W.getCell(r,2+3*k+j).value={formula:`SUMPRODUCT((${DS}!$A$3:$A$${n}=${col(2+3*k)}$3)*(${DS}!$G$3:$G$${n}=$A${r})*${DS}!$${cl}$3:$${cl}$${n})`};});
    W.getCell(r,38).value={formula:`SUM(B${r}:AK${r})`};}
  for(let c=2;c<=38;c++)W.getCell(10,c).value={formula:c===38?'SUM(B10:AK10)':`SUM(${col(c)}5:${col(c)}9)`};
  // 2) + 3) top-five tyres: month of the last date, and the last date itself
  let mx=0;for(const r of yl)if(r.t>mx)mx=r.t;
  const lastAir=air.length?Math.max(...air.map(r=>r.t)):mx;
  const lastT=air.some(r=>r.t===mx)?mx:lastAir;
  const ld=new Date(lastT),lm=ld.getUTCMonth(),ly=ld.getUTCFullYear();
  const top=f=>{const mp=new Map();
    for(const r of air){if(!f(r))continue;let o=mp.get(r.y);if(!o){o={y:r.y,S:0,M:0,n:0,kg:0,pr:new Map()};mp.set(r.y,o);}
      o[r.type==='m'?'n':r.type]+=r.q;if(r.type==='S')o.kg+=r.kg;o.pr.set(r.p,(o.pr.get(r.p)||0)+r.q);}
    return [...mp.values()].map(o=>(o.t=o.S+o.M+o.n,o)).sort((a,b)=>b.t-a.t||a.y.localeCompare(b.y)).slice(0,5);};
  const pressTxt=o=>{const a=[...o.pr].sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0]));return a.slice(0,6).map(e=>e[0]+' ('+e[1]+')').join(', ')+(a.length>6?', …':'');};
  const pk=ly+'-'+lm,monthName=MON[lm],dk=String(lastT);
  const fill=(first,list,pm,byFormula)=>{
    list.forEach((o,i)=>{const r=first+i,p=pm(o.y);
      W.getCell(r,1).value=o.y;W.getCell(r,2).value=pressTxt(o);
      W.getCell(r,2).alignment={wrapText:true,vertical:'top'};W.getCell(r,1).alignment={wrapText:true,vertical:'top'};
      if(byFormula){['D','E','F'].forEach((cl,j)=>{W.getCell(r,3+j).value={formula:`SUMPRODUCT((${DS}!$A$3:$A$${n}="${monthName}")*(${DS}!$B$3:$B$${n}=$A${r})*${DS}!$${cl}$3:$${cl}$${n})`};});}
      else{W.getCell(r,3).value=o.S;W.getCell(r,4).value=o.M;W.getCell(r,5).value=o.n;}
      W.getCell(r,6).value={formula:`SUM(C${r}:E${r})`};
      if(p){W.getCell(r,7).value=p[0];W.getCell(r,8).value=Math.round(p[1]*10)/10;}
      W.getCell(r,9).value=Math.round(o.kg*10)/10;
      W.getCell(r,10).value={formula:`IF(AND(N(G${r})>0,N(H${r})>0),(D${r}+E${r})*H${r}/G${r},"")`};
      W.getCell(r,11).value={formula:`IF(N(G${r})>0,C${r}/G${r},"")`};
      W.getCell(r,12).value={formula:`IF(N(G${r})>0,(D${r}+E${r})/G${r},"")`};
      W.getCell(r,13).value={formula:`IF(N(H${r})>0,I${r}/H${r},"")`};
      W.getCell(r,14).value={formula:`IF(ISNUMBER(J${r}),J${r}/H${r},"")`};
      [7].forEach(c=>W.getCell(r,c).numFmt='#,##0');[8,9,10].forEach(c=>W.getCell(r,c).numFmt='#,##0.0');[11,12,13,14].forEach(c=>W.getCell(r,c).numFmt='0.00%');});
  };
  const mTop=top(r=>{const x=new Date(r.t);return x.getUTCFullYear()===ly&&x.getUTCMonth()===lm;});
  const dTop=top(r=>r.t===lastT);
  const pM=y=>prod&&prod.m[pk]&&prod.m[pk][y],pD=y=>prod&&prod.d[dk]&&prod.d[dk][y];
  W.getCell('A1').value='Brand Wise Defect Comparison - AIR TRAP (all AIR TRAP defect types: '+[...new Set(air.map(r=>r.r))].sort().map(s=>s.replace(/^AIR TRAP\s*/,'').toLowerCase()||'general').join(', ')+')';
  W.getCell('A14').value='By tyre description (Month wise: '+monthName+' '+ly+') - Top Five Tyres';
  W.getCell('A22').value='By tyre description on '+ld.getUTCDate()+' '+monthName.slice(0,3)+' '+ly+' (Last Date) - Top Five Tyres';
  fill(16,mTop,pM,true);fill(24,dTop,pD,false);
  const nt=W.getCell('A30');nt.value='Press (QTY) lists the presses where the defect occurred, with the quantity on each. Repair Kg is estimated as repair quantity x (production kg / production qty) of the same tyre. Production figures come from the Production sheet; last-date figures are taken straight from the inspection log.';
  nt.font={name:'Calibri',size:10,italic:true};nt.alignment={wrapText:true,vertical:'top'};W.mergeCells('A30:N31');
}

$('xl').onclick=async()=>{const b=$('xl');b.disabled=true;
  try{const buf=await buildXlsx(recs,selDef);const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name='Repair_Analysis.xlsx';
    let dl=null;try{dl=window.claude&&await claude.use('downloads');}catch(_){}
    if(dl){try{await dl.save({filename:name,data:blob});}catch(err){if(err&&err.code!=='declined')alert('Could not save workbook: '+(err.message||err.code));}}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();}
  }catch(e){alert('Could not build workbook: '+e.message);}finally{b.disabled=false;}};
// ---- Auto-feed: no upload here. The Production Summary page passes the report’s Daily Quality and Daily Tyres Production sheets through the host page. ----
const STORE_KEY='fitl_defect_analyser_v1';
function show(out,label){
  recs=out;selDef=null;dataMin=Math.min(...out.map(r=>r.t));dataMax=Math.max(...out.map(r=>r.t));
  anchor=new Date(dataMax);
  $('msg').textContent=label+': '+n0(out.length)+' defect records ('+fmtS(new Date(dataMin))+' '+new Date(dataMin).getUTCFullYear()+' to '+fmt(new Date(dataMax))+')';
  $('app').hidden=false;render();
}
function persist(name){
  try{
    const dict=[],idx=new Map(),D=s=>{let i=idx.get(s);if(i===undefined){i=dict.length;idx.set(s,i);dict.push(s);}return i;};
    const rows=recs.map(r=>[r.t,r.type,r.q,r.kg,D(r.r),D(r.p),D(r.g),D(r.y),D(r.sl),D(r.si)]);
    let pr=null;
    if(prod){const pd=[],pi=new Map(),P=s=>{let i=pi.get(s);if(i===undefined){i=pd.length;pi.set(s,i);pd.push(s);}return i;};
      const mm=[],dd=[];
      for(const ym in prod.m)for(const y in prod.m[ym])mm.push([ym,P(y),prod.m[ym][y][0],prod.m[ym][y][1]]);
      for(const t in prod.d)for(const y in prod.d[t])dd.push([t,P(y),prod.d[t][y][0],prod.d[t][y][1]]);
      pr={pd,mm,dd};}
    localStorage.setItem(STORE_KEY,JSON.stringify({name,savedAt:Date.now(),dict,rows,pr}));
  }catch(_){}
}
function restore(){
  try{
    const s=JSON.parse(localStorage.getItem(STORE_KEY)||'null');
    if(!s||!s.rows||!s.rows.length)return false;
    const out=s.rows.map(a=>({t:a[0],type:a[1],q:a[2],kg:a[3],r:s.dict[a[4]],p:s.dict[a[5]],g:s.dict[a[6]],y:s.dict[a[7]],sl:s.dict[a[8]],si:s.dict[a[9]]}));
    prod=null;
    if(s.pr){prod={m:{},d:{}};
      s.pr.mm.forEach(a=>{(prod.m[a[0]]=prod.m[a[0]]||{})[s.pr.pd[a[1]]]=[a[2],a[3]];});
      s.pr.dd.forEach(a=>{(prod.d[a[0]]=prod.d[a[0]]||{})[s.pr.pd[a[1]]]=[a[2],a[3]];});}
    show(out,(s.name||'Saved workbook')+' (last upload '+new Date(s.savedAt).toLocaleString()+')');
    if(prod)$('msg').textContent+=' · production data loaded';
    return true;
  }catch(_){return false;}
}
function ingest(files){
  $('msg').textContent='Reading workbook …';
  setTimeout(()=>{
    let lastErr=null;
    for(const f of files){
      try{
        const {out}=load(f.buffer);
        if(!out.length){lastErr=new Error('No scrap/repair records found in '+f.name+'.');continue;}
        show(out,f.name);
        prod=null;
        $('msg').textContent+=' · reading production sheet …';
        setTimeout(()=>{
          try{prod=loadProd(f.buffer);}catch(_){prod=null;}
          $('msg').textContent=$('msg').textContent.replace(' · reading production sheet …','')+(prod?' · production data loaded':'');
          persist(f.name);
        },30);
        return;
      }catch(err){lastErr=err;}
    }
    $('msg').textContent=(recs.length?'The latest upload had no “Daily Quality” sheet, so the previous data is still shown. ':'Error: ')+(lastErr?lastErr.message:'');
  },30);
}
window.addEventListener('message',ev=>{
  if(ev.source!==window.parent)return;
  const m=ev.data;
  if(m&&m.type==='fitl-workbook'&&Array.isArray(m.files))ingest(m.files);
});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;render();});
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('latest').onclick=()=>{anchor=new Date(dataMax);render();};
$('shiftSel').onchange=render;
$('out').addEventListener('change',ev=>{if(ev.target.id==='defSel'){selDef=ev.target.value||null;render();}});
$('out').addEventListener('click',ev=>{const tr=ev.target.closest('tr[data-r]');if(tr){selDef=tr.dataset.r;render();const d=$('defSel');if(d)d.scrollIntoView({block:'start'});}});
$('dt').onchange=ev=>{const v=ev.target.value;if(!v)return;anchor=mode==='month'?new Date(v+'-01T00:00:00Z'):new Date(v+'T00:00:00Z');render();};
$('pdf').onclick=()=>{$('pdf').disabled=true;makePDF().finally(()=>{$('pdf').disabled=!(view&&view.list.length);});};

restore();
try{window.parent.postMessage({type:'fitl-defect-ready'},'*');}catch(_){}
